[test]
# Every tier runs offline (scripts/ci/test.sh exports the switches).
root = "packages"
pathIgnorePatterns = ["**/tests/unit/**", "**/tests/integration/**", "**/tests/realworld/**"]
# THE PER-TEST TIMEOUT IS NOT SET HERE: `timeout` under `[test]` is ignored by Bun 1.3.13, so it travels
# on the command line from `scripts/ci/test.sh` (see bunfig.int.toml).
# Coverage engages only with --coverage (in-process driver); full-system tier, so the ledger only ignores tests/**.
coverageReporter = ["text", "lcov"]
coverageDir = "coverage/sit"
coverageSkipTestFiles = true
coveragePathIgnorePatterns = ["packages/**/tests/**"]
