[test]
# Every tier runs offline: scripts/ci/test.sh exports the switches that keep a booted daemon from following
# the published model catalog, the hosted relay directory or the update check. (The 4.x preloads that also
# did this, and the unit tier's fake-clock guard, lived in packages/daemon and packages/pwa; in 5.0 the driven
# clock is the test host's, `@ferretry/kernel/testing`.)
root = "packages"
pathIgnorePatterns = ["**/tests/integration/**", "**/tests/sit/**", "**/tests/realworld/**"]
# Bun 1.3.13 truncates LCOV at 640 KiB when the text reporter is also active.
# The gate reads and validates the complete LCOV ledger directly.
coverageReporter = ["lcov"]
coverageDir = "coverage/unit"
coverageSkipTestFiles = true
# Every unit file shares one process: this puts back what a DOM file leaves (nodes, the WebSocket global).
preload = ["./packages/app/tests/support/dom-leak-guard.ts"]
# Unit ledger = the domain tier only: every `lib/` directory of a workspace package, at any depth
# (scripts/ci/coverage-ledger.sh judges only those). tests/** never counts.
coveragePathIgnorePatterns = [
  "packages/**/tests/**",
  # REPO GATES and host text assets, which are not package code: a unit test that imports one to pin its
  # parser would otherwise land it in the ledger.
  "scripts/**",
]
