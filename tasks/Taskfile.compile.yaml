version: '3'
tasks:
  default:
    desc: 'Cross-compile every standalone binary into dist/bin/'
    cmds:
      - task: cli
  cli:
    internal: true
    desc: 'Cross-compile CLI and daemon binary targets'
    cmds:
      # The PWA is a browser bundle, never a standalone binary lane.
      - ./scripts/release/compile.sh
  smoke:
    desc: 'Smoke-test a compiled binary (task compile:smoke -- dist/bin/<binary>)'
    cmds:
      - ./scripts/release/smoke.sh {{.CLI_ARGS}}
