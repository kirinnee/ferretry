version: '3'
vars:
  MODE: '{{.MODE | default "unit"}}'
  CONFIG: '{{.CONFIG | default "bunfig.unit.toml"}}'
  WORKSPACE_ROOT: packages
tasks:
  # Internal building blocks — parameterized by MODE/CONFIG and reached only via the test:* root tasks.
  default:
    internal: true
    desc: 'Run {{.MODE}} tests'
    cmds:
      - bun test {{.WORKSPACE_ROOT}} --config={{.CONFIG}}
  coverage:
    internal: true
    desc: 'Run {{.MODE}} tests with coverage (lcov + text artifacts)'
    cmds:
      - bun test {{.WORKSPACE_ROOT}} --config={{.CONFIG}} --coverage
  watch:
    internal: true
    desc: 'Run {{.MODE}} tests in watch mode'
    cmds:
      - bun test {{.WORKSPACE_ROOT}} --config={{.CONFIG}} --watch
  e2e:
    internal: true
    desc: 'Run the isolated E2E harness'
    cmds:
      - ./scripts/test/run-e2e.sh
