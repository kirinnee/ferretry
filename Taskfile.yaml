version: '3'

vars:
  # The CLI package's bin key is the ONLY place the product name is written; everything derives it.
  CLI_PKG: packages/cli
  # The PWA is a browser bundle, not a Bun program: it builds through its own package script
  # (Vite) rather than through scripts/local/build.sh. The separately owned Pages deployment will
  # publish this package's documented output once its configuration lands.
  PWA_PKG: packages/pwa
  # The relay is a Cloudflare Worker, not a Bun program and not part of any release artifact. It is
  # deployed by its operator into their own account, so it has a deploy task and no build task.
  RELAY_PKG: packages/relay
  ARTIFACT_PREFIX:
    sh: jq -r '.bin | to_entries[0].key' {{.CLI_PKG}}/package.json
  ARTIFACT: '{{.ARTIFACT_PREFIX}}-{{OS}}-{{if eq ARCH "arm64"}}arm64{{else}}x64-baseline{{end}}'
  ENTRY:
    sh: echo "{{.CLI_PKG}}/$(jq -r '.bin | to_entries[0].value' {{.CLI_PKG}}/package.json)"

includes:
  compile: tasks/Taskfile.compile.yaml
  unit:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: unit
      CONFIG: bunfig.unit.toml
  int:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: int
      CONFIG: bunfig.int.toml
      # An adapter test boots a real daemon, binds a loopback port and waits for it.
      # Five seconds is not that budget, and a bunfig cannot supply this one.
      TIMEOUT: --timeout 120000

tasks:
  setup:
    desc: Install locked workspace dependencies
    cmds:
      - ./scripts/local/setup.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files

  check:
    desc: Typecheck the workspace
    cmds:
      - ./scripts/validate/typecheck.sh

  clean:
    desc: Remove Bun build, dependency, and coverage artifacts
    cmds:
      - rm -rf dist prebuilt coverage {{.PWA_PKG}}/dist
      - '[ -d node_modules ] && find node_modules -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true'

  build:
    desc: Build the Bun bundle to dist/
    cmds:
      - ./scripts/local/build.sh

  build:pwa:
    desc: Build the PWA static bundle to packages/pwa/dist
    dir: '{{.PWA_PKG}}'
    cmds:
      # `bun run build`, not `vite build`: the package script is the one build command the pending
      # Pages workflow must invoke too. Two spellings of the same build are how a local bundle and
      # a deployed bundle start differing.
      - bun run build

  relay:check:
    desc: 'Expert: compile the relay Worker and print its bindings without deploying anything'
    dir: '{{.RELAY_PKG}}'
    cmds:
      # The rehearsal for relay:deploy. `--dry-run` compiles and resolves bindings and migrations
      # against your wrangler.jsonc and needs no Cloudflare credentials: it publishes nothing and
      # changes nothing in your account, so a broken config is found here rather than halfway
      # through a real deploy. Wrangler comes from the flake-locked Nix shell, so the rehearsal and
      # production workflow execute the same integrity-pinned tool rather than npm's latest release.
      - wrangler deploy --dry-run

  relay:deploy:
    desc: 'Expert: deploy the rendezvous relay to your own Cloudflare account'
    dir: '{{.RELAY_PKG}}'
    cmds:
      # Running a relay is an opt-in expert path, not product setup: nothing in onboarding asks for
      # it, and the hosted default carries everyone who does not want to operate infrastructure.
      # docs/cloudflare-relay-self-hosting.md is the runbook — plan requirements, the narrow API
      # token, verification, teardown and what it costs. Fill in RELAY_DAEMON_IDS in wrangler.jsonc
      # first: an empty list serves nobody. Run relay:check first.
      #
      # Wrangler comes from the flake-locked Nix shell rather than an ambient global installation.
      - wrangler deploy

  deadcode:
    desc: Review strict and LLM-assisted dead-code findings
    cmds:
      - ./scripts/local/deadcode.sh

  test:
    desc: Run unit, integration, and SIT suites without coverage
    cmds:
      - task: unit:default
      - task: int:default
      - task: test:sit

  test:unit:
    desc: Run the unit suite without coverage
    cmds:
      - task: unit:default

  test:int:
    desc: Run the integration suite without coverage
    cmds:
      - task: int:default

  test:sit:
    desc: Run black-box journeys through the freshly compiled binary
    deps: [compile]
    cmds:
      - SIT_DRIVER=binary CLI_BIN=dist/bin/{{.ARTIFACT}} bun test --config=bunfig.sit.toml

  test:e2e:
    desc: Run isolated end-to-end journeys through the freshly compiled binary
    deps: [compile]
    cmds:
      - task: unit:e2e

  test:coverage:
    desc: Run every coverage-capable suite with coverage
    cmds:
      - task: unit:coverage
      - task: int:coverage
      - task: test:sit:coverage

  test:unit:coverage:
    desc: Run the unit suite with coverage
    cmds:
      - task: unit:coverage

  test:int:coverage:
    desc: Run the integration suite with coverage
    cmds:
      - task: int:coverage

  test:sit:coverage:
    desc: Run SIT journeys in-process and emit the full-system ledger
    cmds:
      - rm -rf coverage/sit
      - SIT_DRIVER=inprocess bun test --config=bunfig.sit.toml --coverage
      - test -f coverage/sit/lcov.info

  test:gate:
    desc: Run the exact coverage gate CI enforces (100% ledger, unit + integration)
    cmds:
      - task: test:gate:unit
      - task: test:gate:int

  test:gate:unit:
    desc: Enforce the unit coverage ledger exactly as CI does
    cmds:
      - ./scripts/ci/test.sh unit

  test:gate:int:
    desc: Enforce the integration coverage ledger exactly as CI does
    cmds:
      - ./scripts/ci/test.sh int

  test:watch:
    desc: Watch the fast unit suite
    cmds:
      - task: unit:watch

  run:
    desc: Run the CLI source entry point
    cmds:
      - bun run {{.ENTRY}} -- {{.CLI_ARGS}}

  preview:
    desc: Run this host's compiled standalone binary
    deps: [compile]
    cmds:
      - ./dist/bin/{{.ARTIFACT}} {{.CLI_ARGS}}
