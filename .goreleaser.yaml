# A Go stub is built per target and the shim swaps the prebuilt Bun binary in (prebuilt builder
# is Pro-only); GoReleaser owns archives, checksums, the cask, and the GitHub release.
# Two-name model: project_name is the PRODUCT (matches root package.json name), binary/archive
# names are the BINARY (matches the CLI package's bin key). scripts/local/rename.sh rewrites both.
version: 2

project_name: ferretry

builds:
  - id: bun
    main: ./goreleaser.go
    binary: fy
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    # Only darwin arm64 ships (no intel mac).
    ignore:
      - goos: darwin
        goarch: amd64
    hooks:
      post:
        - cmd: ./scripts/release/goreleaser-shim.sh "{{ .Path }}" "{{ .Os }}" "{{ .Arch }}"

archives:
  - id: archive
    ids: [bun]
    formats: [tar.gz]
    name_template: 'fy_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: 'checksums.txt'

# Linux packages are named after the BINARY and pushed to Gemfury (apt.fury.io/yum.fury.io,
# account kirinnee) by scripts/release/fury.sh — see INSTALLATION.md.
nfpms:
  - id: packages
    ids: [bun]
    package_name: fy
    # Derives from package_name so rename.sh --bin only has to rewrite the line above.
    file_name_template: '{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [deb, rpm]
    maintainer: kirinnee <kirinnee97@gmail.com>
    homepage: https://github.com/kirinnee/ferretry
    description: Command-line client for the per-host agent daemon
    bindir: /usr/bin

release:
  # replace: CD reruns must be idempotent — a rerun re-uploads the same tag's assets
  mode: replace
  github:
    owner: kirinnee
    name: ferretry
  # install.sh is served from the GitHub release (see INSTALLATION.md's one-line installer).
  extra_files:
    - glob: scripts/release/install.sh

# The cask is committed INTO THIS REPO under Casks/ (no separate homebrew-tap repo):
#   brew tap kirinnee/ferretry https://github.com/kirinnee/ferretry && brew install --cask ferretry
homebrew_casks:
  - name: ferretry
    ids: [archive]
    binaries: [fy]
    repository:
      owner: kirinnee
      name: ferretry
    directory: Casks
    homepage: https://github.com/kirinnee/ferretry
    description: Command-line client for the per-host agent daemon
    # The Bun binary ships unsigned; strip the macOS quarantine attribute on install.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/fy"]
          end
