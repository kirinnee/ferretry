name: Release

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types:
      - completed

concurrency:
  group: release

jobs:
  release:
    name: Semantic Release
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      # RELEASE_TOKEN must be a PAT (or GitHub-App token): tags pushed with the default
      # GITHUB_TOKEN do not trigger the CD workflow.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: nix develop .#ci -c ./scripts/ci/release.sh
