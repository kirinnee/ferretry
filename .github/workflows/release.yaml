name: Release

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types:
      - completed

concurrency:
  group: release

jobs:
  release:
    timeout-minutes: 20
    name: Semantic Release
    # What actually keeps another branch out is that a `workflow_run` workflow always runs the DEFAULT branch's copy of
    # this file, so main's `branches: [main]` governs and a copy on any other branch decides nothing. This repeats the
    # branch where a reader of the job sees it. (On main, `head_branch` is also `main` for a pull request from a fork
    # whose branch is named `main`; adding `workflow_run.event == 'push'` and a `head_repository.full_name` check
    # there is a follow-up for main, not part of this branch.)
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/install-nix
      # RELEASE_TOKEN must be a PAT (or GitHub-App token): tags pushed with the default
      # GITHUB_TOKEN do not trigger the CD workflow.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: nix develop .#ci -c ./scripts/ci/release.sh
