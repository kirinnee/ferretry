name: Release

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types:
      - completed

concurrency:
  group: release

jobs:
  release:
    timeout-minutes: 20
    name: Semantic Release
    # `branches: [main]` filters the triggering run's branch; this repeats it where a reader of the job sees it, so
    # a run of any other branch (rebuild/5.0 included) can never reach semantic-release.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/install-nix
      # RELEASE_TOKEN must be a PAT (or GitHub-App token): tags pushed with the default
      # GITHUB_TOKEN do not trigger the CD workflow.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: nix develop .#ci -c ./scripts/ci/release.sh
