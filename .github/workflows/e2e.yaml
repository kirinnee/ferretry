name: E2E

# The e2e tier: compiled binaries, the real PWA bundle, a real Chrome and a local rendezvous, driven
# through the product journeys in tests/e2e/. Its own workflow because it is advisory and its own
# status, `E2E Journeys`, is what a merge waits on (docs/standards/ci-cd/index.md, "E2E tier").
#
# ON EVERY PULL REQUEST, and the `relevance` job decides: a pull request that changes only docs or
# model catalogs runs no journey and still reports `E2E Journeys` green (scripts/ci/e2e-relevance.sh
# says why that is not a workflow `paths-ignore`). The `[slow]` journeys run in `E2E Slow`.
#
# ADVISORY, NOT REQUIRED: it is not a branch-protection check yet. After two weeks of runs have
# measured its flake rate it becomes one.
on:
  pull_request:
  workflow_dispatch:

# Copied from CI, as the standard asks of every pull_request workflow: a new push to a PR cancels the
# run for its old SHA; a manual dispatch gets a group of its own run id and is never cancelled.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
      || github.run_id
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  relevance:
    name: E2E Relevance
    permissions:
      contents: read
      pull-requests: read
    # GitHub, not Namespace: a few seconds of bash with no nix shell. Namespace bills it a whole minute
    # and attaches the cache volume for nothing, and here it is free.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - id: decide
        name: Decide whether the journeys have anything to prove
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ./scripts/ci/e2e-relevance.sh

  # The journeys of the `fast` tier, split by test across the matrix (scripts/ci/e2e-shards.ts, balanced
  # by tests/e2e/timings.json). Each shard compiles its own binaries: measured, the compile is ~6s of a
  # shard's ~40s setup, and a build-once job in front would add a whole job's startup to the critical path.
  journeys:
    name: E2E Shard (${{ matrix.shard }})
    needs: relevance
    if: needs.relevance.outputs.run == 'true'
    permissions:
      contents: read
    # `ubuntu-latest` ships the Google Chrome the journeys launch and the tmux their agent sessions
    # live in, exactly as the int tier and the Settings geometry gate already rely on. The timeout stops
    # a wedged browser from holding the runner for the default six hours.
    # Namespace on a pull request, GitHub otherwise (docs/standards/ci-cd, "Runners").
    # A shard drives one journey at a time: measured at about one busy core and under 2GB, so 2x4.
    runs-on: >-
      ${{
        (github.event_name != 'pull_request' || vars.CI_RUNNER_POOL == 'github')
        && 'ubuntu-latest'
        || fromJSON('["nscloud-ubuntu-24.04-amd64-2x4-with-cache","nscloud-cache-tag-ferretry-nix","nscloud-cache-size-10gb","nscloud-cache-allow-commit-from-main"]')
      }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Mount the Nix store cache
        if: runner.environment == 'self-hosted'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: nix
      - uses: ./.github/actions/install-nix
      # ADVISORY: `continue-on-error` on this STEP, not the job. On a job it still paints the job's check
      # red; on the step the job stays green while the step's own result, the job summary line, a warning
      # annotation and the `E2E Journeys` tally record every failure. Removed when the tier becomes required.
      - name: Run this shard of the e2e journeys
        continue-on-error: true
        env:
          FY_E2E_TIER: fast
          FY_E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: nix develop .#ci -c ./scripts/ci/e2e.sh
      # `always()` because a red run is the run whose evidence matters most: every screen the journeys
      # reached at phone and desktop width in both colour schemes, the per-step journey log, the relay
      # ledger, the JUnit report the timings are regenerated from, and the shard's result for the summary.
      - name: Upload this shard's e2e evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # One artifact per shard and attempt: v4 artifacts are immutable within a run, so a re-run
          # reusing the name failed its upload after the journeys had passed.
          name: e2e-evidence-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-evidence/
          if-no-files-found: warn
      # The shard's tally alone, so the summary reads a few bytes instead of every shard's screens.
      - name: Upload this shard's result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-result-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-evidence/result.json
          if-no-files-found: warn

  # THE status: one name for branch protection and merge tooling however many shards there are.
  summary:
    name: E2E Journeys
    needs: [relevance, journeys]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    # GitHub, not Namespace: a few seconds of bash with no nix shell. Namespace bills it a whole minute
    # and attaches the cache volume for nothing, and here it is free.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      # Every attempt's: "re-run failed jobs" re-runs only some shards, and the summary keeps each
      # shard's latest. A shard whose journeys never started left no result; the summary counts it.
      - name: Download every shard's result
        if: needs.relevance.outputs.run == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: e2e-result-*
          path: ${{ runner.temp }}/e2e-shards
      - name: Add up the shards
        env:
          RELEVANCE: ${{ needs.relevance.result }}
          RUN: ${{ needs.relevance.outputs.run }}
          SHARDS: ${{ needs.journeys.result }}
        run: ./scripts/ci/e2e-summary.sh "${{ runner.temp }}/e2e-shards" 3
