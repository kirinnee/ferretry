name: CD

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # The release proves darwin works before it publishes. GoReleaser cross-compiles the darwin binary on
  # Linux, and nothing else runs it: `compile` builds the same binaries once more so `smoke-darwin` can
  # start the shipped darwin-arm64 binary on a real Mac. REQUIRED here (`advisory: false`): when GitHub's
  # macOS pool gives the job no runner it is re-queued up to 3 times with backoff, and only then does
  # the release stop, saying the runner was unavailable (docs/standards/ci-cd, "macOS runner shortage").
  compile:
    timeout-minutes: 15
    name: Compile Binaries
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-nix
      - name: Cross-compile standalone binaries
        run: ./scripts/ci/in-devshell.sh ./scripts/release/compile.sh
      # The manifest every consumer holds its download to (.github/actions/download-binaries).
      - name: List the binaries
        run: ./scripts/ci/binaries-manifest.sh write dist/bin
      - name: Upload binaries
        id: upload_1
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: dist/bin/
          if-no-files-found: error
      - name: Upload binaries (retry)
        if: steps.upload_1.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: dist/bin/
          overwrite: true
          if-no-files-found: error
  smoke-darwin:
    name: Smoke darwin-arm64
    needs: compile
    permissions:
      contents: read
    uses: ./.github/workflows/smoke-darwin.yaml
    with:
      advisory: false
  goreleaser:
    timeout-minutes: 30
    name: GoReleaser Publish
    needs: smoke-darwin
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/install-nix
        with:
          shell: .#releaser
      - name: Compile, package, and publish all channels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FURY_PUSH_TOKEN: ${{ secrets.FURY_PUSH_TOKEN }}
        run: nix develop .#releaser -c ./scripts/release/publish.sh
  # Signs checksums.txt so a standalone install can verify a self-update (docs/updating.md). The key
  # lives ONLY in this environment; restrict its deployment refs to `v*.*.*` tags in the repository
  # settings. Until the owner creates DAEMON_RELEASE_SIGNING_KEY this job says so and signs nothing,
  # and standalone self-updates refuse — every other install method is unaffected.
  sign:
    timeout-minutes: 15
    name: Sign daemon release
    needs: goreleaser
    environment: daemon-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # Only for scripts/ci/sign-daemon-release.sh and the trusted key list; nothing is installed.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # The key reaches the signer on STDIN: `printf` is a shell builtin, so no process's arguments
      # carry it, and the signer itself runs without it in its environment.
      - name: Sign checksums.txt and attach the signature
        env:
          DAEMON_RELEASE_SIGNING_KEY: ${{ secrets.DAEMON_RELEASE_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ -z ${DAEMON_RELEASE_SIGNING_KEY} ]]; then
            echo "::notice::DAEMON_RELEASE_SIGNING_KEY is not set; standalone self-updates will refuse this release"
            exit 0
          fi
          dist="${RUNNER_TEMP}/dist"
          mkdir -p "${dist}"
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --pattern checksums.txt --dir "${dist}"
          key="${DAEMON_RELEASE_SIGNING_KEY}"
          unset DAEMON_RELEASE_SIGNING_KEY
          printf '%s\n' "${key}" | ./scripts/ci/sign-daemon-release.sh "${dist}"
          gh release upload "${TAG}" "${dist}/checksums.txt.sig" --repo "${GITHUB_REPOSITORY}" --clobber
