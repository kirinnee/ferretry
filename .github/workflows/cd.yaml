name: CD

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # A tag is not a branch: `v*.*.*` fires for a tag on ANY commit, so a tag on a commit of `rebuild/5.0` (or a feature
  # branch) would run this whole workflow, publish a GitHub release and commit the cask. Every other job therefore waits
  # for this one, which proves the tagged commit is reachable from `main`'s history — what semantic-release tags — and
  # stops here for anything else (scripts/validate/release-guards.sh holds the dependency).
  main-only:
    timeout-minutes: 5
    name: Tag is on main
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse a tag that is not on main
        run: |
          set -euo pipefail
          # fetch-depth 0 brought every branch head, main included, so no credentialed fetch is needed here.
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "❌ ${GITHUB_REF_NAME} tags ${GITHUB_SHA}, which is not on main; a release is only ever cut from main" >&2
            exit 1
          fi
  # The release proves darwin works before it publishes. GoReleaser cross-compiles the darwin binary on
  # Linux, and nothing else runs it: `compile` builds the same binaries once more so `smoke-darwin` can
  # start the shipped darwin-arm64 binary on a real Mac. REQUIRED here (`advisory: false`): when GitHub's
  # macOS pool gives the job no runner it is re-queued up to 3 times with backoff, and only then does
  # the release stop, saying the runner was unavailable (docs/standards/ci-cd, "macOS runner shortage").
  compile:
    timeout-minutes: 15
    name: Compile Binaries
    needs: main-only
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-nix
      - name: Cross-compile standalone binaries
        run: ./scripts/ci/in-devshell.sh ./scripts/release/compile.sh
      # The manifest every consumer holds its download to (.github/actions/download-binaries).
      - name: List the binaries
        run: ./scripts/ci/binaries-manifest.sh write dist/bin
      - name: Upload binaries
        id: upload_1
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: dist/bin/
          if-no-files-found: error
      - name: Upload binaries (retry)
        if: steps.upload_1.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: dist/bin/
          overwrite: true
          if-no-files-found: error
  smoke-darwin:
    name: Smoke darwin-arm64
    needs: compile
    # The owner's switch (docs/standards/ci-cd, "macOS runner shortage"): `vars.MACOS_SMOKE == 'skip'` skips the
    # job, and `goreleaser` then says so and publishes the darwin binary unproven. Unset runs it.
    if: ${{ vars.MACOS_SMOKE != 'skip' }}
    permissions:
      contents: read
    uses: ./.github/workflows/smoke-darwin.yaml
    with:
      advisory: false
  goreleaser:
    timeout-minutes: 30
    name: GoReleaser Publish
    needs: [compile, smoke-darwin]
    # `!cancelled()` replaces the implicit success(), so the gate is spelled out: `compile` passed (a failed
    # compile also leaves `smoke-darwin` skipped, which must never publish) and the smoke passed, or the owner
    # switched it off and it was skipped. A smoke that failed publishes nothing, switch or no switch.
    if: ${{ !cancelled() && needs.compile.result == 'success' && (needs.smoke-darwin.result == 'success' || (vars.MACOS_SMOKE == 'skip' && needs.smoke-darwin.result == 'skipped')) }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Say that the macOS smoke was skipped
        if: ${{ vars.MACOS_SMOKE == 'skip' }}
        run: ./scripts/ci/macos-smoke-skipped.sh
      - uses: ./.github/actions/install-nix
        with:
          shell: .#releaser
      - name: Compile, package, and publish all channels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FURY_PUSH_TOKEN: ${{ secrets.FURY_PUSH_TOKEN }}
        run: nix develop .#releaser -c ./scripts/release/publish.sh
  # Signs checksums.txt so a standalone install can verify a self-update (docs/updating.md). The key
  # lives ONLY in this environment; restrict its deployment refs to `v*.*.*` tags in the repository
  # settings. Until the owner creates DAEMON_RELEASE_SIGNING_KEY this job says so and signs nothing,
  # and standalone self-updates refuse — every other install method is unaffected.
  sign:
    timeout-minutes: 15
    name: Sign daemon release
    needs: goreleaser
    # GitHub skips a job whose dependency CHAIN holds a skipped job, even when the job in between ran. With
    # the macOS smoke skipped by the owner's switch that chain is skipped, so the implicit success() would
    # skip the signing: spell the gate out instead (goreleaser published, nothing was cancelled).
    if: ${{ !cancelled() && needs.goreleaser.result == 'success' }}
    environment: daemon-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # Only for scripts/ci/sign-daemon-release.sh and the trusted key list; nothing is installed.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # The key reaches the signer on STDIN: `printf` is a shell builtin, so no process's arguments
      # carry it, and the signer itself runs without it in its environment.
      - name: Sign checksums.txt and attach the signature
        env:
          DAEMON_RELEASE_SIGNING_KEY: ${{ secrets.DAEMON_RELEASE_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ -z ${DAEMON_RELEASE_SIGNING_KEY} ]]; then
            echo "::notice::DAEMON_RELEASE_SIGNING_KEY is not set; standalone self-updates will refuse this release"
            exit 0
          fi
          dist="${RUNNER_TEMP}/dist"
          mkdir -p "${dist}"
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --pattern checksums.txt --dir "${dist}"
          key="${DAEMON_RELEASE_SIGNING_KEY}"
          unset DAEMON_RELEASE_SIGNING_KEY
          printf '%s\n' "${key}" | ./scripts/ci/sign-daemon-release.sh "${dist}"
          gh release upload "${TAG}" "${dist}/checksums.txt.sig" --repo "${GITHUB_REPOSITORY}" --clobber
