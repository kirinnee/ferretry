name: Deploy PWA to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pwa-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy PWA
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      # The default relay's discovery origin is a BUILD constant, because Pages is
      # static: the relay is a separate Worker hostname and there is no proxy to
      # reach it through. Passing `vars.HOSTED_RELAY_ORIGIN` straight through would
      # have been silently wrong — that variable is optional for the relay's own
      # deploy, which derives the workers.dev origin when it is blank, and this
      # repository sets no variables at all. The Worker would have deployed at a
      # real address while the production bundle compiled an empty one. The script
      # resolves it the same way, from the same inputs, and fails the build rather
      # than shipping a bundle with no default.
      - name: Resolve the relay discovery origin
        env:
          HOSTED_RELAY_ORIGIN: ${{ vars.HOSTED_RELAY_ORIGIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # `tail -n 1` because the devshell hook writes to stdout as a side effect — git-hooks.nix
          # announces itself and prints "pre-commit installed at .git/hooks/pre-commit". A plain
          # command substitution swallows those lines into the value, and GITHUB_ENV then rejects
          # the whole thing with "Invalid format", which is what broke this build. The script emits
          # exactly one line of its own and sends every diagnostic to stderr, so the last line is
          # the origin.
          origin="$(nix develop .#ci -c ./scripts/ci/relay-directory-origin.sh --require | tail -n 1)"
          printf 'FY_RELAY_DIRECTORY_ORIGIN=%s\n' "${origin}" >>"${GITHUB_ENV}"
          echo "relay discovery origin for this build: ${origin:-<none>}"
      - name: Build static PWA bundle
        run: nix develop .#ci -c ./scripts/ci/build-pwa.sh
      # Wrangler runs through the pinned devshell rather than cloudflare/wrangler-action. The action
      # installs wrangler with whichever package manager it detects, picks bun from this repository's
      # lockfile, and then cannot find bun — it runs outside the nix shell that provides it. Calling
      # bunx inside `nix develop` uses the toolchain the rest of CI already uses, and drops a
      # third-party action from the deploy path. Wrangler reads both credentials from the
      # environment, so neither is ever passed as an argument.
      #
      # The project is created on first run: Cloudflare merged Workers and Pages into one flow whose
      # direct-upload path wants files before it will create a project, which a repository that
      # deploys its own build cannot supply from a browser. `project create` fails when the project
      # exists, so the list is checked first rather than swallowing the error — a create that fails
      # for any OTHER reason must still stop the deploy.
      - name: Ensure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if nix develop .#ci -c bunx wrangler pages project list | grep -qE '(^|[[:space:]])ferretry([[:space:]]|$)'; then
            echo "project ferretry already exists"
          else
            nix develop .#ci -c bunx wrangler pages project create ferretry --production-branch=main
          fi
      - name: Deploy production bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          nix develop .#ci -c bunx wrangler pages deploy packages/pwa/dist \
            --project-name=ferretry --branch=main
