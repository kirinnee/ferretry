name: CI

# ONE run per commit under test. A pull request is proved by its `pull_request` run; `main` is
# proved by its `push` run, which is the run Release waits on. `push` used to fire for every branch
# and every tag as well, so each PR ran all 17 jobs twice (the branch push and the PR) and every
# release ran them a third time on the tag — the same tree the `main` run of the release commit had
# already proved. Every duplicate held runners from the same pool the runs that mattered queued for.
# A branch with no PR gets CI from `workflow_dispatch` (or by opening a draft).
#
# `Casks/**` alone is GoReleaser's own cask commit, pushed by CD after a release has already
# shipped: it changes no code any job here reads. The other five paths are exactly what
# semantic-release's `release: X.Y.Z` commit writes (.releaserc.yaml, `@semantic-release/git`
# assets): a version stamp and the changelog over the tree the previous `main` run already proved.
# It was a third of the `main` runs (170 of 513 in two weeks), each billing every Namespace job:
# its parent has a run of its own, and Release has nothing left to release. A commit that changes any
# other file as well still runs everything.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'Casks/**'
      - 'VERSION'
      - 'Changelog.md'
      - 'Changelog.old.md'
      - 'packages/cli/package.json'
      - 'packages/daemon/package.json'
  pull_request:
  workflow_dispatch:

# A new push to a PR supersedes the run for its old SHA, so that run is cancelled instead of holding
# a runner.
#
# `main` shares ONE group and never cancels in progress: at most one main run runs and one waits, and a
# newer push replaces the one waiting. Each main run used to have a group of its own, so every merge
# queued a full run on GitHub's runners; on 2026-10-30 a burst of merges left twelve of them queued for
# over an hour behind pull-request jobs, and no release went out. Superseding a waiting run loses
# nothing: Release releases `main`'s head, and the newer run proves every commit the older one held.
# A run already in progress is never cancelled, so a steady stream of merges cannot starve Release.
# Manual dispatch keeps a group of its own run id.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
      || (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'main'
      || github.run_id
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  precommit:
    timeout-minutes: 10
    name: Pre-Commit (${{ matrix.part }})
    permissions:
      contents: read
    # Namespace on a pull request, GitHub otherwise (docs/standards/ci-cd, "Runners", says why and what
    # `vars.CI_RUNNER_POOL` does). The shape is per part, from measured use. `format` is treefmt alone:
    # 2x4 takes ~55s against ~30s on 4x8, for half the price and still well inside the critical path.
    # `gates` holds knip, which ran out of memory on the 4GB of a 2x4, so it runs on GitHub's free 16GB
    # runner on every event: 113s there against 97s on a Namespace 4x8, for nothing instead of a 4x8.
    runs-on: >-
      ${{
        (matrix.shape == 'github' || github.event_name != 'pull_request' || vars.CI_RUNNER_POOL == 'github')
        && 'ubuntu-latest'
        || fromJSON(format('["nscloud-ubuntu-24.04-amd64-{0}-with-cache","nscloud-cache-tag-ferretry-nix","nscloud-cache-size-10gb","nscloud-cache-allow-commit-from-main"]', matrix.shape))
      }}
    # Two parts on parallel runners: the hooks run one after another, and treefmt alone was ~40s of
    # their ~105s. Between them the parts run every hook an unsplit run does (scripts/ci/pre-commit.sh).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: format, shape: 2x4 }
          - { part: gates, shape: github }
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Mount the Nix store cache
        if: runner.environment == 'self-hosted'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: nix
      - uses: ./.github/actions/install-nix
      - name: Run pre-commit (${{ matrix.part }})
        env:
          PART: ${{ matrix.part }}
        run: nix develop .#ci -c ./scripts/ci/pre-commit.sh "$PART"

  # Three checks that each finish in under 20 seconds, in ONE job. Namespace bills a job by the minute
  # with a one-minute floor and holds a runner and a cache attachment for each, so three 15-second jobs
  # cost three minutes of runner and three cache attachments for 45 seconds of work.
  build-checks:
    timeout-minutes: 20
    name: Build Checks
    permissions:
      contents: read
    # Namespace on EVERY event, `main` included: this is the one Namespace job a `main` run keeps, because
    # only `main` commits the /nix cache volume and this job builds both closures every other Namespace
    # job mounts — the `.#ci` dev shell and the install bundle (docs/standards/ci-cd, "Runners").
    runs-on: >-
      ${{
        vars.CI_RUNNER_POOL == 'github' && 'ubuntu-latest'
        || fromJSON('["nscloud-ubuntu-24.04-amd64-2x4-with-cache","nscloud-cache-tag-ferretry-nix","nscloud-cache-size-10gb","nscloud-cache-allow-commit-from-main"]')
      }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Mount the Nix store cache
        if: runner.environment == 'self-hosted'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: nix
      - uses: ./.github/actions/install-nix
      # This is the documented `nix shell github:kirinnee/ferretry` package graph. It used to copy
      # Bun's workspace links by hand, so fyd gained @ferretry/relay while this build stayed stale;
      # every other job installed the real workspace and remained green. Build the actual bundle.
      - name: Build documented Nix install bundle
        run: nix build .#default --no-link
      # Compile both deployment shapes with the same flake-locked Wrangler production uses. This
      # catches schema, migration, binding and module-resolution drift before a deploy sees secrets.
      - name: Compile relay Workers without publishing
        run: |
          nix develop .#ci -c bash -c '
            set -euo pipefail
            cd packages/relay
            bun install --frozen-lockfile
            wrangler deploy --dry-run --config wrangler.jsonc
            wrangler deploy --dry-run --config wrangler.hosted.json
          '
      # The same gate the Pages deploy runs — but that workflow only fires on a push to `main`, so
      # until now the first thing to notice that the generated `fy-render` sandbox shell and its two
      # library bundles never reached `dist` was the production deploy. The build asserts all three
      # are present and non-empty; running it pre-merge makes a lost generation step a red PR instead
      # of a shipped 404 shell that silently degrades every diagram and animation.
      - name: Build static PWA bundle
        run: nix develop .#ci -c ./scripts/ci/build-pwa.sh
      # Only `main` commits the cache volume (`nscloud-cache-allow-commit-from-main`), so only `main`
      # prunes it: everything the dev shell and the install bundle no longer reach, once the store
      # outgrows its budget. scripts/ci/nix-store-hygiene.sh says why the budget is what it is.
      - name: Prune the Nix store cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.environment == 'self-hosted'
        run: ./scripts/ci/nix-store-hygiene.sh

  pwa-screenshot:
    timeout-minutes: 20
    name: PWA ${{ matrix.scope == 'full' && 'Full Gallery' || 'Settings Geometry' }} (${{ matrix.scheme }}${{ matrix.viewport && format(', {0}', matrix.viewport) || '' }})
    permissions:
      contents: read
    # Linux, deliberately NOT a macOS runner: the image already ships the same Google Chrome the
    # Integration Tests job's shared Chromium launches, so this needs no new tool and no further macOS
    # job. A sibling job rather than a step on an existing one, so it adds runner time and no wall clock.
    # Namespace on a pull request, GitHub otherwise (docs/standards/ci-cd, "Runners"). The Settings walk
    # fits a 2x4. The full gallery is two legs, one viewport each, each on a 4x8: unsplit it walked its
    # viewports one after the other, 643s on GitHub against ~422s on a Namespace 4x8, and a viewport's
    # walk peaks at 5-7GB so a leg cannot drop to a 2x4. A GitHub leg runs about as long as a Namespace one
    # but waits in GitHub's queue, which on a busy day put the pull-request p90 near 11 minutes against
    # 8, so a pull request keeps Namespace (docs/standards/ci-cd, "Runners": GitHub only when Namespace
    # buys close to nothing).
    # Separate jobs, not one job running both at once: that was three software-rendered Chromes on four
    # cores, and it timed out in 3 of 7 runs under load (#598). On `main` both legs take the GitHub
    # branch below, like every other job there.
    runs-on: >-
      ${{
        (matrix.shape == 'github' || github.event_name != 'pull_request' || vars.CI_RUNNER_POOL == 'github')
        && 'ubuntu-latest'
        || fromJSON(format('["nscloud-ubuntu-24.04-amd64-{0}-with-cache","nscloud-cache-tag-ferretry-nix","nscloud-cache-size-10gb","nscloud-cache-allow-commit-from-main"]', matrix.shape))
      }}
    # One job per colour scheme: the two runs are independent first frames (`pre-paint.js` resolves the
    # theme before paint), so running them in sequence only added a scheme's ~70s to the wall clock.
    # The dark leg walks the WHOLE gallery: the Settings walk never reaches its later sections, and one
    # of those timed out on every full run for ~250 commits with this job green. It also makes every
    # Settings check a dark `settings` leg would (the same four tallies, owed in full), which is why
    # there is no such leg: it was the same proof twice. `scripts/ci/pwa-screenshot-proof.sh` says why
    # the full walk is one scheme and what it costs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scheme: light, scope: settings, shape: 2x4 }
          - { scheme: dark, scope: full, viewport: mobile, shape: 4x8 }
          - { scheme: dark, scope: full, viewport: desktop, shape: 4x8 }
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Mount the Nix store cache
        if: runner.environment == 'self-hosted'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: nix
      - uses: ./.github/actions/install-nix
      # `packages/pwa/harness/screenshot.ts` could always prove the Settings surfaces do not scroll
      # sideways at 390px, and until now nothing ran it — so a change could reintroduce the exact
      # clipping that shipped once already and every gate here would stay green. The script's header
      # says which frames this covers, which it does not, and why the assertion is the gate while the
      # images are only evidence.
      - name: Prove the ${{ matrix.scope }} harness at ${{ matrix.viewport || 'both viewports' }} in ${{ matrix.scheme }}
        env:
          SCHEME: ${{ matrix.scheme }}
          SCOPE: ${{ matrix.scope }}
          VIEWPORT: ${{ matrix.viewport }}
        run: nix develop .#ci -c ./scripts/ci/pwa-screenshot-proof.sh "$SCHEME" "$SCOPE" ${VIEWPORT:+"$VIEWPORT"}
      # `always()` because a red run is the run whose frames matter most: the artifact carries this
      # colour scheme at its viewports plus the run's full log, so a reviewer can see the panel that
      # broke instead of reading a geometry number and guessing.
      - name: Upload the captured ${{ matrix.scope }} frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-${{ matrix.scope }}-frames-${{ matrix.scheme }}${{ matrix.viewport && format('-{0}', matrix.viewport) || '' }}
          path: packages/pwa/.artifacts/pwa-screenshot/
          if-no-files-found: warn

  # The unit tier in parallel shares (config/test-groups.json), exactly like `int` below. Serially it
  # was ~105s of tests in one process; the slowest group is under a minute.
  test:
    timeout-minutes: 15
    name: Unit Tests (${{ matrix.group }})
    permissions:
      contents: read
    # Namespace on a pull request, GitHub otherwise (docs/standards/ci-cd, "Runners").
    # `bun test` runs one file at a time: measured at under one busy core of four, so two is plenty.
    runs-on: >-
      ${{
        (github.event_name != 'pull_request' || vars.CI_RUNNER_POOL == 'github')
        && 'ubuntu-latest'
        || fromJSON('["nscloud-ubuntu-24.04-amd64-2x4-with-cache","nscloud-cache-tag-ferretry-nix","nscloud-cache-size-10gb","nscloud-cache-allow-commit-from-main"]')
      }}
    strategy:
      fail-fast: false
      matrix:
        group: [pwa-features, pwa, everything-else]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Mount the Nix store cache
        if: runner.environment == 'self-hosted'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: nix
      - uses: ./.github/actions/install-nix
      - name: Run the ${{ matrix.group }} unit tests
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: nix develop .#ci -c ./scripts/ci/test.sh unit "$TEST_GROUP"
      - name: Upload the ${{ matrix.group }} coverage ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-${{ matrix.group }}
          path: coverage/unit/groups/${{ matrix.group }}/lcov.info
          if-no-files-found: warn

  # The unit tier's 100% ledger over every group's, as `int-ledger` does for int; no nix shell.
  unit-ledger:
    timeout-minutes: 5
    name: Unit Tests
    needs: test
    permissions:
      contents: read
    # GitHub, not Namespace: bash, awk and jq over a few artifacts, under ten seconds and no nix shell.
    # Namespace bills that a whole minute and attaches the cache volume for nothing; here it is free.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download every group's coverage ledger
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-unit-*
          path: coverage/unit/groups
      - name: Hold the unit tier to its 100% ledger
        run: ./scripts/ci/coverage-ledger.sh unit --groups coverage/unit/groups
      - name: Upload unit coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit/lcov.info
          if-no-files-found: warn

  # The integration tier in parallel shares (config/test-groups.json). Serially it was the CI critical
  # path at ~4.4 min (~3.8 min of tests); each group is about a minute. The matrix lists every group
  # by name, and `int-ledger` refuses to judge unless every group in the config reported.
  # The tier grew back to the critical path: by Oct 28 `everything-else` took ~480s and
  # `daemon-runtime` ~330s on GitHub. Their slowest files now have groups of their own — the PWA feature
  # surfaces plus the send handover (~175s of browser walks) — so no group needs much over five
  # minutes. The real-time budget suites that once had a group are the realworld tier's now
  # (realworld.yaml): they asserted the machine, not the code, so they cannot gate a merge. GitHub
  # runs these for free; the cost is two more jobs in its 20-job queue, measured as worth it.
  int:
    name: Integration Tests (${{ matrix.group }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # A CEILING, NOT A RETRY: the slowest group takes ~8 min, so 20 is a wedged run. On 2026-10-29 the
    # daemon group hung in a test and held its runner for two hours; without this it holds one for six.
    # `scripts/test/stall-watch.ts` ends a silent run sooner and says why; this catches everything else.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [daemon-runtime, daemon, pwa-render, pwa-chat, pwa-surfaces, everything-else]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-nix
      - name: Run the ${{ matrix.group }} integration tests
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: nix develop .#ci -c ./scripts/ci/test.sh int "$TEST_GROUP"
      - name: Upload the ${{ matrix.group }} coverage ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-int-${{ matrix.group }}
          path: coverage/int/groups/${{ matrix.group }}/lcov.info
          if-no-files-found: warn

  # The integration tier's 100% ledger over every group's (scripts/ci/coverage-ledger.sh says why it
  # merges per file, never per line). Like `smoke`, it enters no nix shell: the gate is bash, awk,
  # grep and jq, all on the runner image, and a nix shell would add ~30s to the critical path.
  int-ledger:
    timeout-minutes: 5
    name: Integration Tests
    needs: int
    permissions:
      contents: read
    # GitHub, not Namespace: bash, awk and jq over a few artifacts, under ten seconds and no nix shell.
    # Namespace bills that a whole minute and attaches the cache volume for nothing; here it is free.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download every group's coverage ledger
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-int-*
          path: coverage/int/groups
      - name: Hold the integration tier to its 100% ledger
        run: ./scripts/ci/coverage-ledger.sh int --groups coverage/int/groups
      - name: Upload int coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-int
          path: coverage/int/lcov.info
          if-no-files-found: warn

  compile:
    timeout-minutes: 15
    name: Compile Binaries
    permissions:
      contents: read
    # Namespace on a pull request, GitHub otherwise (docs/standards/ci-cd, "Runners").
    # Measured at under one and a half busy cores, so the smallest shape.
    runs-on: >-
      ${{
        (github.event_name != 'pull_request' || vars.CI_RUNNER_POOL == 'github')
        && 'ubuntu-latest'
        || fromJSON('["nscloud-ubuntu-24.04-amd64-2x4-with-cache","nscloud-cache-tag-ferretry-nix","nscloud-cache-size-10gb","nscloud-cache-allow-commit-from-main"]')
      }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Mount the Nix store cache
        if: runner.environment == 'self-hosted'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: nix
      - uses: ./.github/actions/install-nix
      - name: Cross-compile standalone binaries
        run: nix develop .#ci -c ./scripts/release/compile.sh
      # The manifest every consumer holds its download to (.github/actions/download-binaries).
      - name: List the binaries
        run: ./scripts/ci/binaries-manifest.sh write dist/bin
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: dist/bin/
          if-no-files-found: error

  sit:
    timeout-minutes: 10
    name: SIT
    needs: compile
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-nix
      - name: Download compiled binaries
        uses: ./.github/actions/download-binaries
      - name: Run SIT
        run: nix develop .#ci -c ./scripts/ci/test.sh sit

  smoke:
    timeout-minutes: 10
    name: Smoke ${{ matrix.target }}
    needs: compile
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-baseline
            runs_on: ubuntu-latest
          - target: linux-arm64
            runs_on: ubuntu-24.04-arm
          - target: darwin-arm64
            runs_on: macos-15
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download compiled binaries
        uses: ./.github/actions/download-binaries
      # The smoke starts a real session, and a session lives in a tmux pane. Not every runner
      # image ships tmux (macOS never does), so install it where it is missing.
      - name: Install tmux
        run: |
          if command -v tmux >/dev/null 2>&1; then
            tmux -V
          elif [ "$(uname -s)" = Darwin ]; then
            brew install tmux
          else
            sudo apt-get update && sudo apt-get install -y tmux
          fi
      # download-artifact drops the exec bit; smoke.sh restores it. The binary name is derived
      # from the CLI package's bin key so the matrix stays rename-proof. It runs the daemon
      # binary beside it too, through `daemon start`, and starts and stops one real session.
      - name: Smoke
        env:
          TARGET: ${{ matrix.target }}
        run: |
          prefix="$(jq -r '.bin | to_entries[0].key' packages/cli/package.json)"
          ./scripts/release/smoke.sh "dist/bin/${prefix}-${TARGET}"
