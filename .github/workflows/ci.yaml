name: CI

# ONE run per commit under test. A pull request is proved by its `pull_request` run; `main` is
# proved by its `push` run, which is the run Release waits on. `push` used to fire for every branch
# and every tag as well, so each PR ran all 17 jobs twice (the branch push and the PR) and every
# release ran them a third time on the tag — the same tree the `main` run of the release commit had
# already proved. Every duplicate held runners from the same pool the runs that mattered queued for.
# A branch with no PR gets CI from `workflow_dispatch` (or by opening a draft).
#
# `Casks/**` alone is GoReleaser's own cask commit, pushed by CD after a release has already
# shipped: it changes no code any job here reads. The other five paths are exactly what
# semantic-release's `release: X.Y.Z` commit writes (.releaserc.yaml, `@semantic-release/git`
# assets): a version stamp and the changelog over the tree the previous `main` run already proved.
# It was a third of the `main` runs (170 of 513 in two weeks), each billing every Namespace job:
# its parent has a run of its own, and Release has nothing left to release. A commit that changes any
# other file as well still runs everything.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'Casks/**'
      - 'VERSION'
      - 'Changelog.md'
      - 'Changelog.old.md'
      - 'packages/cli/package.json'
      - 'packages/daemon/package.json'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      quick_shape:
        description: >-
          Quick Checks machine for this dispatch only: 8x16 (the pull-request shape) or 4x8 (what main's push run
          uses, so a branch can measure main's shape before merge). Pull requests and main ignore it.
        type: choice
        options: ['8x16', '4x8']
        default: '8x16'

# A new push to a PR supersedes the run for its old SHA, so that run is cancelled instead of holding
# a runner.
#
# `main` shares ONE group and never cancels in progress: at most one main run runs and one waits, and a
# newer push replaces the one waiting. Each main run used to have a group of its own, so every merge
# queued a full run on GitHub's runners; on 2026-10-30 a burst of merges left twelve of them queued for
# over an hour behind pull-request jobs, and no release went out. Superseding a waiting run loses
# nothing: Release releases `main`'s head, and the newer run proves every commit the older one held.
# A run already in progress is never cancelled, so a steady stream of merges cannot starve Release.
# Manual dispatch keeps a group of its own run id.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') && format('pr-{0}', github.event.pull_request.number)
      || (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'main'
      || github.run_id
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}

jobs:
  # Shared setup once, then independent processes with separate logs and coverage directories.
  quick:
    name: Quick Checks
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'full-ci' }}
    timeout-minutes: 20
    permissions:
      contents: read
    # Main only refreshes the cache and waits for the full release gates; its smaller Quick
    # machine preserves tsc/Nix cache commits without paying 8 units on every main push.
    # A dispatch picks its own shape (`quick_shape`), so main's 4x8 can be measured on a branch before merge.
    runs-on: >-
      ${{ fromJSON(format('["nscloud-ubuntu-24.04-amd64-{0}-with-cache","nscloud-cache-tag-ferretry-nix","nscloud-cache-size-10gb","nscloud-cache-allow-commit-from-main"]',
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && '4x8')
        || (github.event_name == 'workflow_dispatch' && inputs.quick_shape)
        || '8x16')) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Mount the Nix store cache
        id: cache
        if: runner.environment == 'self-hosted'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: nix
          path: ~/.cache/ferretry-tsc
      - uses: ./.github/actions/install-nix
      - name: Run the quick set
        env:
          FY_CI_QUICK_PARALLEL: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.quick_shape == '4x8')) && '3' || '6' }}
          FY_CI_GATE_PARALLEL: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.quick_shape == '4x8')) && '2' || '4' }}
          # quick.sh derives FY_TSC_CACHE_DIR from $HOME, the same directory the cache action mounts
          # above, and on main deletes it first so the cache a pull request reads is a clean proof.
          FY_CI_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '' }}
          FY_CI_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: ./scripts/ci/in-devshell.sh ./scripts/ci/quick.sh
      - name: Upload unit coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit/
          if-no-files-found: warn
      - name: Upload quick part results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: quick-parts
          path: |
            coverage/ci/quick/*.log
            coverage/ci/quick/*.tsv
            coverage/ci/quick/hooks/
            coverage/ci/quick/static/
          if-no-files-found: warn
      - name: Prune the Nix store cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.environment == 'self-hosted'
        run: ./scripts/ci/nix-store-hygiene.sh

  # Does this pull request change anything the PWA browser gate reads? One decision for all three legs of
  # `pwa-screenshot`: when it is `false` they are SKIPPED, which counts as passed, so a daemon-only, CLI-only
  # or docs-only pull request skips a gate that is ~19% of the Namespace bill. scripts/ci/pwa-relevance.sh has the
  # list and why it is a job and not `paths-ignore`; scripts/validate/pwa-relevance.sh holds it to the
  # imports of the harness. `main`, dispatch and any doubt decide `true`.
  # The job is self-contained: it reads the PR's file list through the API and nothing else, so it stays
  # valid whenever and however `pwa-screenshot` is triggered.
  pwa-relevance:
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}
    timeout-minutes: 5
    name: PWA Relevance
    permissions:
      contents: read
      pull-requests: read
    # GitHub, not Namespace: a few seconds of bash with no nix shell (docs/standards/ci-cd, "Runners").
    # It must stay that cheap: `pwa-screenshot` waits for it, so its seconds are the gate's start delay.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - id: decide
        name: Decide whether the PWA browser gate has anything to prove
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ./scripts/ci/pwa-relevance.sh

  # Starts immediately, before Namespace provisioning. A new head has no full proof yet.
  full-pending:
    name: Full CI Pending
    if: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Mark the exact PR head as awaiting full proof
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/ci/full-status.sh pending

  pwa-screenshot:
    timeout-minutes: 20
    name: PWA ${{ matrix.scope == 'full' && 'Full Gallery' || 'Settings Geometry' }} (${{ matrix.scheme }}${{ matrix.viewport && format(', {0}', matrix.viewport) || '' }})
    needs: pwa-relevance
    if: ${{ !cancelled() && needs.pwa-relevance.outputs.run != 'false' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}
    permissions:
      contents: read
    # Linux, deliberately NOT a macOS runner: the image already ships the same Google Chrome the
    # Integration Tests job's shared Chromium launches, so this needs no new tool and no further macOS
    # job. A sibling job rather than a step on an existing one, so it adds runner time and no wall clock.
    # Namespace on a pull request, GitHub otherwise (docs/standards/ci-cd, "Runners"). The Settings walk
    # fits a 2x4. The full gallery is two legs, one viewport each, each on a 4x8: unsplit it walked its
    # viewports one after the other, 643s on GitHub against ~422s on a Namespace 4x8, and a viewport's
    # walk peaks at 5-7GB so a leg cannot drop to a 2x4. A GitHub leg runs about as long as a Namespace one
    # but waits in GitHub's queue, which on a busy day put the pull-request p90 near 11 minutes against
    # 8, so a pull request keeps Namespace (docs/standards/ci-cd, "Runners": GitHub only when Namespace
    # buys close to nothing).
    # Separate jobs, not one job running both at once: that was three software-rendered Chromes on four
    # cores, and it timed out in 3 of 7 runs under load (#598). On `main` both legs take the GitHub
    # branch below, like every other job there.
    runs-on: >-
      ${{
        (matrix.shape == 'github' || github.event_name != 'pull_request' || vars.CI_RUNNER_POOL == 'github')
        && 'ubuntu-latest'
        || fromJSON(format('["nscloud-ubuntu-24.04-amd64-{0}-with-cache","nscloud-cache-tag-ferretry-nix","nscloud-cache-size-10gb","nscloud-cache-allow-commit-from-main"]', matrix.shape))
      }}
    # One job per colour scheme: the two runs are independent first frames (`pre-paint.js` resolves the
    # theme before paint), so running them in sequence only added a scheme's ~70s to the wall clock.
    # The dark leg walks the WHOLE gallery: the Settings walk never reaches its later sections, and one
    # of those timed out on every full run for ~250 commits with this job green. It also makes every
    # Settings check a dark `settings` leg would (the same four tallies, owed in full), which is why
    # there is no such leg: it was the same proof twice. `scripts/ci/pwa-screenshot-proof.sh` says why
    # the full walk is one scheme and what it costs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scheme: light, scope: settings, shape: 2x4 }
          - { scheme: dark, scope: full, viewport: mobile, shape: 4x8 }
          - { scheme: dark, scope: full, viewport: desktop, shape: 4x8 }
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Mount the Nix store cache
        if: runner.environment == 'self-hosted'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: nix
      - uses: ./.github/actions/install-nix
      # `packages/pwa/harness/screenshot.ts` could always prove the Settings surfaces do not scroll
      # sideways at 390px, and until now nothing ran it — so a change could reintroduce the exact
      # clipping that shipped once already and every gate here would stay green. The script's header
      # says which frames this covers, which it does not, and why the assertion is the gate while the
      # images are only evidence.
      - name: Prove the ${{ matrix.scope }} harness at ${{ matrix.viewport || 'both viewports' }} in ${{ matrix.scheme }}
        env:
          SCHEME: ${{ matrix.scheme }}
          SCOPE: ${{ matrix.scope }}
          VIEWPORT: ${{ matrix.viewport }}
        run: ./scripts/ci/in-devshell.sh ./scripts/ci/pwa-screenshot-proof.sh "$SCHEME" "$SCOPE" ${VIEWPORT:+"$VIEWPORT"}
      # `always()` because a red run is the run whose frames matter most: the artifact carries this
      # colour scheme at its viewports plus the run's full log, so a reviewer can see the panel that
      # broke instead of reading a geometry number and guessing.
      - name: Upload the captured ${{ matrix.scope }} frames
        if: always()
        # Evidence only: a reader's convenience, never the gate. GitHub's artifact service drops a
        # finalize now and then (ECONNRESET), and that must not turn a proven run red.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pwa-${{ matrix.scope }}-frames-${{ matrix.scheme }}${{ matrix.viewport && format('-{0}', matrix.viewport) || '' }}
          path: packages/pwa/.artifacts/pwa-screenshot/
          if-no-files-found: warn

  # ONE job on one 8x16 runner, not a matrix of 2x4 runners: `integration.sh` runs every group of
  # config/test-groups.json side by side (six at a time) and then the 100% ledger. The groups are
  # balanced by measured test time (the PWA browser walks are dealt out by name prefix), so no one
  # group is the long pole; rebalance from per-file times, not by guessing.
  int:
    name: Integration Tests
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}
    timeout-minutes: 20
    permissions:
      contents: read
    runs-on:
      [
        nscloud-ubuntu-24.04-amd64-8x16-with-cache,
        nscloud-cache-tag-ferretry-nix,
        nscloud-cache-size-10gb,
        nscloud-cache-allow-commit-from-main,
      ]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Mount the Nix store cache
        if: runner.environment == 'self-hosted'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: nix
      - uses: ./.github/actions/install-nix
      - name: Run every integration group and its ledger
        run: ./scripts/ci/in-devshell.sh ./scripts/ci/integration.sh
      - name: Upload integration coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-int
          path: coverage/int/
          if-no-files-found: warn
      - name: Upload integration part results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: integration-parts
          path: |
            coverage/ci/int/*.log
            coverage/ci/int/*.tsv
          if-no-files-found: warn

  # Knip (twice) and the route agreement: the gates that need more than 4GB, so they are not in Quick's
  # per-hook buckets and not in compile, whose binaries SIT, the smokes and darwin wait for. A job of
  # its own, in the verdict's needs, so it overlaps compile instead of lengthening the critical path.
  full-gates:
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}
    timeout-minutes: 15
    name: Full Gates
    permissions:
      contents: read
    # Namespace on a pull request, GitHub otherwise (docs/standards/ci-cd, "Runners"). Knip ran out of
    # memory on a 2x4's 4GB, so this is a 4x8; its two modes and the route check run one after another.
    runs-on: >-
      ${{
        (github.event_name != 'pull_request' || vars.CI_RUNNER_POOL == 'github')
        && 'ubuntu-latest'
        || fromJSON('["nscloud-ubuntu-24.04-amd64-4x8-with-cache","nscloud-cache-tag-ferretry-nix","nscloud-cache-size-10gb","nscloud-cache-allow-commit-from-main"]')
      }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Mount the Nix store cache
        if: runner.environment == 'self-hosted'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: nix
      - uses: ./.github/actions/install-nix
      - name: Run the full-only static gates
        run: ./scripts/ci/in-devshell.sh ./scripts/ci/full-gates.sh

  compile:
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}
    timeout-minutes: 15
    name: Compile Binaries
    permissions:
      contents: read
    # Namespace on a pull request, GitHub otherwise (docs/standards/ci-cd, "Runners").
    # Measured at under one and a half busy cores, so the smallest shape.
    runs-on: >-
      ${{
        (github.event_name != 'pull_request' || vars.CI_RUNNER_POOL == 'github')
        && 'ubuntu-latest'
        || fromJSON('["nscloud-ubuntu-24.04-amd64-2x4-with-cache","nscloud-cache-tag-ferretry-nix","nscloud-cache-size-10gb","nscloud-cache-allow-commit-from-main"]')
      }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Say that the macOS smoke was skipped
        if: ${{ vars.MACOS_SMOKE == 'skip' }}
        run: ./scripts/ci/macos-smoke-skipped.sh
      - name: Mount the Nix store cache
        if: runner.environment == 'self-hosted'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: nix
      - uses: ./.github/actions/install-nix
      - name: Cross-compile standalone binaries
        run: ./scripts/ci/in-devshell.sh ./scripts/release/compile.sh
      # The manifest every consumer holds its download to (.github/actions/download-binaries).
      - name: List the binaries
        run: ./scripts/ci/binaries-manifest.sh write dist/bin
      - name: Upload binaries
        id: upload_3
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: dist/bin/
          if-no-files-found: error
      # A later job reads this artifact, so a dropped upload (GitHub's artifact service resets a finalize
      # now and then) is retried once from the same files; a second failure fails the job as before.
      - name: Upload binaries (retry)
        if: steps.upload_3.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: dist/bin/
          overwrite: true
          if-no-files-found: error

  sit:
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}
    timeout-minutes: 10
    name: SIT
    needs: compile
    permissions:
      contents: read
    runs-on: >-
      ${{
        (github.event_name != 'pull_request' || vars.CI_RUNNER_POOL == 'github')
        && 'ubuntu-latest'
        || fromJSON('["nscloud-ubuntu-24.04-amd64-2x4-with-cache","nscloud-cache-tag-ferretry-nix","nscloud-cache-size-10gb","nscloud-cache-allow-commit-from-main"]')
      }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Mount the Nix store cache
        if: runner.environment == 'self-hosted'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: nix
      - uses: ./.github/actions/install-nix
      - name: Download compiled binaries
        uses: ./.github/actions/download-binaries
      - name: Run SIT
        run: ./scripts/ci/in-devshell.sh ./scripts/ci/test.sh sit

  smoke:
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}
    timeout-minutes: 10
    name: Smoke ${{ matrix.target }}
    needs: compile
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-baseline
            runs_on: ubuntu-latest
          - target: linux-arm64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download compiled binaries
        uses: ./.github/actions/download-binaries
      # The smoke starts a real session, and a session lives in a tmux pane. Not every runner
      # image ships tmux, so install it where it is missing.
      - name: Install tmux
        run: |
          if command -v tmux >/dev/null 2>&1; then
            tmux -V
          else
            sudo apt-get update && sudo apt-get install -y tmux
          fi
      # download-artifact drops the exec bit; smoke.sh restores it. The binary name is derived
      # from the CLI package's bin key so the matrix stays rename-proof. It runs the daemon
      # binary beside it too, through `daemon start`, and starts and stops one real session.
      - name: Smoke
        env:
          TARGET: ${{ matrix.target }}
        run: |
          prefix="$(jq -r '.bin | to_entries[0].key' packages/cli/package.json)"
          ./scripts/release/smoke.sh "dist/bin/${prefix}-${TARGET}"

  # The darwin-arm64 smoke, the one macOS job in this workflow. GitHub's macOS pool is small and shared,
  # and when it has no runner it CANCELS the job with no step run (docs/standards/ci-cd, "macOS runner
  # shortage"). smoke-darwin.yaml tells that from a smoke that ran and failed: on a pull request it is
  # ADVISORY (a missing runner is a warning, a failed smoke is still red); on `main` it is REQUIRED and
  # a job that could not start is re-queued up to 3 times before the verdict fails. Release waits on
  # this, so a darwin binary is never released unproven. The Linux legs above stay required everywhere.
  # `vars.MACOS_SMOKE == 'skip'` is the owner's switch for a macOS pool with no runner for hours: the job does
  # not run at all, and `compile` says so in a warning and the job summary (docs/standards/ci-cd,
  # "macOS runner shortage"). Unset, or any other value, runs the smoke exactly as above.
  smoke-darwin:
    name: Smoke darwin-arm64
    needs: compile
    if: ${{ vars.MACOS_SMOKE != 'skip' && ((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')) }}
    permissions:
      contents: read
    uses: ./.github/workflows/smoke-darwin.yaml
    with:
      advisory: ${{ github.event_name == 'pull_request' }}

  relevance:
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}
    timeout-minutes: 5
    name: E2E Relevance
    permissions:
      contents: read
      pull-requests: read
    # GitHub, not Namespace: a few seconds of bash with no nix shell. Namespace bills it a whole minute
    # and attaches the cache volume for nothing, and here it is free.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - id: decide
        name: Decide whether the journeys have anything to prove
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ./scripts/ci/e2e-relevance.sh

  # The journeys of the `fast` tier, split by test across the matrix (scripts/ci/e2e-shards.ts, balanced
  # by tests/e2e/timings.json). Each shard compiles its own binaries: measured, the compile is ~6s of a
  # shard's ~40s setup, and a build-once job in front would add a whole job's startup to the critical path.
  journeys:
    name: E2E Shard (${{ matrix.shard }})
    needs: relevance
    if: ${{ ((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')) && needs.relevance.outputs.run == 'true' }}
    permissions:
      contents: read
    # `ubuntu-latest` ships the Google Chrome the journeys launch and the tmux their agent sessions
    # live in, exactly as the int tier and the Settings geometry gate already rely on. The timeout stops
    # a wedged browser from holding the runner for the default six hours.
    # Namespace on a pull request, GitHub otherwise (docs/standards/ci-cd, "Runners").
    # A shard drives one journey at a time: measured at about one busy core and under 2GB, so 2x4.
    runs-on: >-
      ${{
        (github.event_name != 'pull_request' || vars.CI_RUNNER_POOL == 'github')
        && 'ubuntu-latest'
        || fromJSON('["nscloud-ubuntu-24.04-amd64-2x4-with-cache","nscloud-cache-tag-ferretry-nix","nscloud-cache-size-10gb","nscloud-cache-allow-commit-from-main"]')
      }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Mount the Nix store cache
        if: runner.environment == 'self-hosted'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: nix
      - uses: ./.github/actions/install-nix
      # ADVISORY: `continue-on-error` on this STEP, not the job. On a job it still paints the job's check
      # red; on the step the job stays green while the step's own result, the job summary line, a warning
      # annotation and the `E2E Journeys` tally record every failure. Removed when the tier becomes required.
      - name: Run this shard of the e2e journeys
        continue-on-error: true
        env:
          FY_E2E_TIER: fast
          FY_E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: nix develop .#ci -c ./scripts/ci/e2e.sh
      # `always()` because a red run is the run whose evidence matters most: every screen the journeys
      # reached at phone and desktop width in both colour schemes, the per-step journey log, the relay
      # ledger, the JUnit report the timings are regenerated from, and the shard's result for the summary.
      - name: Upload this shard's e2e evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # One artifact per shard and attempt: v4 artifacts are immutable within a run, so a re-run
          # reusing the name failed its upload after the journeys had passed.
          name: e2e-evidence-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-evidence/
          if-no-files-found: warn
      # The shard's tally alone, so the summary reads a few bytes instead of every shard's screens.
      - name: Upload this shard's result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-result-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-evidence/result.json
          if-no-files-found: warn

  # THE status: one name for branch protection and merge tooling however many shards there are.
  summary:
    timeout-minutes: 5
    name: E2E Journeys
    needs: [relevance, journeys]
    if: ${{ !cancelled() && ((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')) }}
    permissions:
      contents: read
    # GitHub, not Namespace: a few seconds of bash with no nix shell. Namespace bills it a whole minute
    # and attaches the cache volume for nothing, and here it is free.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      # Every attempt's: "re-run failed jobs" re-runs only some shards, and the summary keeps each
      # shard's latest. A shard whose journeys never started left no result; the summary counts it.
      - name: Download every shard's result
        if: needs.relevance.outputs.run == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: e2e-result-*
          path: ${{ runner.temp }}/e2e-shards
      - name: Add up the shards
        env:
          RELEVANCE: ${{ needs.relevance.result }}
          RUN: ${{ needs.relevance.outputs.run }}
          SHARDS: ${{ needs.journeys.result }}
        run: ./scripts/ci/e2e-summary.sh "${{ runner.temp }}/e2e-shards" 3

  full:
    name: Full CI
    needs:
      [
        quick,
        full-pending,
        int,
        full-gates,
        compile,
        sit,
        smoke,
        smoke-darwin,
        pwa-relevance,
        pwa-screenshot,
        relevance,
        journeys,
        summary,
      ]
    if: ${{ always() && ((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')) }}
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Judge the full set on this exact head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NEEDS: ${{ toJSON(needs) }}
          MACOS_SMOKE: ${{ vars.MACOS_SMOKE }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ./scripts/ci/full-status.sh verdict
