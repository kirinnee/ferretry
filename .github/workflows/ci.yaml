name: CI

# ONE run per commit under test. A pull request is proved by its `pull_request` run; `main` is
# proved by its `push` run, which is the run Release waits on. `push` used to fire for every branch
# and every tag as well, so each PR ran all 17 jobs twice (the branch push and the PR) and every
# release ran them a third time on the tag — the same tree the `main` run of the release commit had
# already proved. Every duplicate held runners from the same pool the runs that mattered queued for.
# A branch with no PR gets CI from `workflow_dispatch` (or by opening a draft).
#
# `Casks/**` alone is GoReleaser's own cask commit, pushed by CD after a release has already
# shipped: it changes no code any job here reads.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'Casks/**'
  pull_request:
  workflow_dispatch:

# A new push to a PR supersedes the run for its old SHA, so that run is cancelled instead of holding
# a runner. Everything else — `main`, manual dispatch — gets a group of its own run id: a shared group
# would still cancel a *pending* main run when a newer one queued, and Release needs every main CI
# run to complete.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
      || github.run_id
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  precommit:
    name: Pre-Commit
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Run pre-commit
        run: nix develop .#ci -c ./scripts/ci/pre-commit.sh

  nix-install:
    name: Nix Install Bundle
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      # This is the documented `nix shell github:kirinnee/ferretry` package graph. It used to copy
      # Bun's workspace links by hand, so fyd gained @ferretry/relay while this build stayed stale;
      # every other job installed the real workspace and remained green. Build the actual bundle.
      - name: Build documented Nix install bundle
        run: nix build .#default --no-link

  relay-configurations:
    name: Relay Configurations
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      # Compile both deployment shapes with the same flake-locked Wrangler production uses. This
      # catches schema, migration, binding and module-resolution drift before a deploy sees secrets.
      - name: Compile relay Workers without publishing
        run: |
          nix develop .#ci -c bash -c '
            set -euo pipefail
            cd packages/relay
            bun install --frozen-lockfile
            wrangler deploy --dry-run --config wrangler.jsonc
            wrangler deploy --dry-run --config wrangler.hosted.json
          '

  pwa-bundle:
    name: PWA Static Bundle
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      # The same gate the Pages deploy runs — but that workflow only fires on a push to `main`, so
      # until now the first thing to notice that the generated `fy-render` sandbox shell and its two
      # library bundles never reached `dist` was the production deploy. The build asserts all three
      # are present and non-empty; running it pre-merge makes a lost generation step a red PR instead
      # of a shipped 404 shell that silently degrades every diagram and animation.
      - name: Build static PWA bundle
        run: nix develop .#ci -c ./scripts/ci/build-pwa.sh

  pwa-screenshot:
    name: PWA Settings Geometry
    permissions:
      contents: read
    # `ubuntu-latest`, and deliberately NOT a macOS runner: the runner image already ships the same
    # Google Chrome the Integration Tests job's shared Chromium launches, so this needs no new tool and
    # no third `macos-14` job. Measured at roughly 2 minutes against a ~4.6min Integration Tests
    # critical path, which is why it is a sibling job rather than another step on an existing one — it
    # adds runner time and no wall clock.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      # `packages/pwa/harness/screenshot.ts` could always prove the Settings surfaces do not scroll
      # sideways at 390px, and until now nothing ran it — so a change could reintroduce the exact
      # clipping that shipped once already and every gate here would stay green. The script's header
      # says which frames this covers, which it does not, and why the assertion is the gate while the
      # images are only evidence.
      - name: Prove the Settings surfaces fit both viewports
        run: nix develop .#ci -c ./scripts/ci/pwa-screenshot-proof.sh
      # `always()` because a red run is the run whose frames matter most: the artifact carries both
      # colour schemes at both viewports plus each run's full log, so a reviewer can see the panel that
      # broke instead of reading a geometry number and guessing.
      - name: Upload the captured Settings frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-settings-frames
          path: packages/pwa/.artifacts/pwa-screenshot/
          if-no-files-found: warn

  test:
    name: Unit Tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Run unit tests
        run: nix develop .#ci -c ./scripts/ci/test.sh unit
      - name: Upload unit coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit
          if-no-files-found: warn

  # The integration tier in parallel shares (config/test-groups.json). Serially it was the CI critical
  # path at ~4.4 min (~3.8 min of tests); each group is about a minute. The matrix lists every group
  # by name, and `int-ledger` refuses to judge unless every group in the config reported.
  int:
    name: Integration Tests (${{ matrix.group }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [daemon-runtime, daemon, pwa-render, everything-else]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Run the ${{ matrix.group }} integration tests
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: nix develop .#ci -c ./scripts/ci/test.sh int "$TEST_GROUP"
      - name: Upload the ${{ matrix.group }} coverage ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-int-${{ matrix.group }}
          path: coverage/int/groups/${{ matrix.group }}/lcov.info
          if-no-files-found: warn

  # The integration tier's 100% ledger over every group's (scripts/ci/coverage-ledger.sh says why it
  # merges per file, never per line). Like `smoke`, it enters no nix shell: the gate is bash, awk,
  # grep and jq, all on the runner image, and a nix shell would add ~30s to the critical path.
  int-ledger:
    name: Integration Tests
    needs: int
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download every group's coverage ledger
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-int-*
          path: coverage/int/groups
      - name: Hold the integration tier to its 100% ledger
        run: ./scripts/ci/coverage-ledger.sh int --groups coverage/int/groups
      - name: Upload int coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-int
          path: coverage/int/lcov.info
          if-no-files-found: warn

  darwin-confinement:
    name: Containment (macOS)
    permissions:
      contents: read
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      # The one claim in this repository that a Linux runner cannot check for macOS: that the file
      # viewer's confinement actually holds on the kernel the POSIX pinner was written for.
      - name: Prove containment on macOS
        run: nix develop .#ci -c ./scripts/ci/darwin-confinement.sh

  safari-sandbox-shell:
    name: Sandbox Shell (Safari)
    permissions:
      contents: read
    # `macos-15`, NOT `macos-14`. macOS 14 entered deprecation on 2026-07-06 with October brownout
    # windows that fail jobs outright and retirement on 2026-11-02, so pinning a release-blocking gate
    # to it buys a job that starts failing for reasons unrelated to Safari. `macos-15` also ships the
    # newer Safari/SafariDriver pair. The two remaining `macos-14` jobs above need the same migration
    # before November; that is not this job's scope, but a new job must not add a third.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      # safaridriver has no headless mode and Safari hosts exactly one WebDriver session at a time, so
      # this runs HEADED in the runner's autologin GUI session and strictly sequentially. The image
      # already ran `sudo safaridriver --enable` and wrote AllowRemoteAutomation at build time;
      # re-running is idempotent and costs nothing, and asserting the flag turns the one unproven
      # assumption behind this job into a loud failure instead of a confusing session error.
      - name: Prove Safari can host a WebDriver session
        run: |
          sudo safaridriver --enable
          /usr/libexec/PlistBuddy -c 'print AllowRemoteAutomation' "$HOME/Library/WebDriver/com.apple.Safari.plist"
      # The only claim in this repository that no Linux runner can check: that the sandbox shell's
      # hash-pinned inline install, its opaque origin and its zero-request posture hold in the browser
      # every Apple device actually runs. A red here is either a product outage on every iPhone and Mac
      # or the deletion of the shell's security argument — the script's header says which is which.
      - name: Prove the fy-render sandbox shell in Safari
        run: nix develop .#ci -c ./scripts/ci/safari-render-proof.sh
      # `always()` because a red run is the run whose facts matter most: the artifact carries the exact
      # policy and hashes measured, the Safari and SafariDriver versions, the ordered request ledger,
      # every property's rule and outcome, and what a green run does NOT establish.
      - name: Upload the Safari evidence ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-render-proof
          path: packages/pwa/.artifacts/safari-render/
          if-no-files-found: warn

  harness-contract:
    name: Harness Contract (${{ matrix.os }})
    permissions:
      contents: read
    # The account model shares one login across many runtimes through mechanisms Claude Code and
    # Codex never documented (design §8.5): CLAUDE_SECURESTORAGE_CONFIG_DIR and its refresh lock, a
    # Codex auth.json rewritten in place through a link, file-only credential storage, and the
    # trust/onboarding keys a wrapper writes. This measures each one against the PINNED harnesses
    # (the flake's own nixpkgs) with fake credentials and a proxy that forwards nothing, so a pin
    # bump that breaks one turns this red instead of forking somebody's login.
    #
    # `macos-15` is not optional: Claude's macOS keychain path is compiled out of the Linux build,
    # so this is the only place it is measured (gap G1). Release runs only after a green CI, which
    # is what makes this a release gate. FY_CONTRACT_KEYCHAIN lets that job write throwaway items
    # into the runner's login keychain; the suite refuses to anywhere `CI` is not `true`.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Measure the pinned harnesses
        env:
          FY_CONTRACT_KEYCHAIN: ${{ startsWith(matrix.os, 'macos') && '1' || '' }}
          FY_CONTRACT_ARTIFACTS: ${{ runner.temp }}/harness-contract
        run: nix develop .#ci -c ./packages/fleet/tests/contract/run.sh pinned
      - name: Upload the harness contract result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-contract-pinned-${{ matrix.os }}
          path: ${{ runner.temp }}/harness-contract/
          if-no-files-found: warn

  compile:
    name: Compile Binaries
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Cross-compile standalone binaries
        run: nix develop .#ci -c ./scripts/release/compile.sh
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: dist/bin/
          if-no-files-found: error

  sit:
    name: SIT
    needs: compile
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Download compiled binaries
        uses: actions/download-artifact@v4
        with:
          name: cli-binaries
          path: dist/bin
      - name: Run SIT
        run: nix develop .#ci -c ./scripts/ci/test.sh sit

  smoke:
    name: Smoke ${{ matrix.target }}
    needs: compile
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-baseline
            runs_on: ubuntu-latest
          - target: linux-arm64
            runs_on: ubuntu-24.04-arm
          - target: darwin-arm64
            runs_on: macos-14
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download compiled binaries
        uses: actions/download-artifact@v4
        with:
          name: cli-binaries
          path: dist/bin
      # The smoke starts a real session, and a session lives in a tmux pane. Not every runner
      # image ships tmux (macOS never does), so install it where it is missing.
      - name: Install tmux
        run: |
          if command -v tmux >/dev/null 2>&1; then
            tmux -V
          elif [ "$(uname -s)" = Darwin ]; then
            brew install tmux
          else
            sudo apt-get update && sudo apt-get install -y tmux
          fi
      # download-artifact drops the exec bit; smoke.sh restores it. The binary name is derived
      # from the CLI package's bin key so the matrix stays rename-proof. It runs the daemon
      # binary beside it too, through `daemon start`, and starts and stops one real session.
      - name: Smoke
        env:
          TARGET: ${{ matrix.target }}
        run: |
          prefix="$(jq -r '.bin | to_entries[0].key' packages/cli/package.json)"
          ./scripts/release/smoke.sh "dist/bin/${prefix}-${TARGET}"
