name: Deploy 5.0 preview PWA to Pages

# THE 5.0 PREVIEW. Builds, signs and deploys the app from ONE dedicated ref, `rebuild/preview` (and no other), to its own
# Cloudflare Pages project (`ferretry-v5`, https://ferretry-v5.pages.dev), beside production. Nothing here touches
# production: another workflow file (so its own run counter), another signing key and environment, another Pages
# project. It is a copy of pwa-pages.yaml's three-job split; read that file's comments for why the jobs are separate. A
# push to any other branch does not trigger it, and there is no manual trigger (no `workflow_dispatch`): the kit's push
# is the only way in, and every job still repeats the ref.
#
# WHAT MOVES THE PREVIEW (the rule, and why it cannot go backwards). THE PREVIEW APP FOLLOWS THE OWNER'S SLOT, NOT EVERY
# MERGE. The app refuses a daemon whose plugin contracts differ ("Reload to get the new app"), so a deploy per merge to
# `rebuild/5.0` / `rebuild/5.0-after` broke the owner's slot-8 daemon after any contract-changing merge, until the next
# slot upgrade. Now a merge deploys nothing. The sweep kit's `upgrade-v5` / `reset-v5`
# first fast-forward `refs/heads/rebuild/preview` to the exact commit the new daemon was built from, wait for THIS
# workflow's `Deploy PWA` job to succeed for that commit, and only then swap the daemon. Nobody else pushes that ref.
# The signed list names the real built commit (GITHUB_SHA) and this run's number. Every deploy goes to the project's
# PRODUCTION alias: `wrangler pages deploy --branch=` is the Pages project's production branch (`rebuild/5.0`, a Pages
# project setting that predates this ref and is not a git ref this workflow reads), whichever ref built the bundle.
#
# NEVER BACKWARDS, in two layers (an installed copy refuses a release whose sequence is lower than the one it holds, so
# an older commit behind a newer run number would be a stuck preview):
#   1. The `gate` job refuses a push that is not the LIVE commit or a descendant of it. "Live" is read from the live site's
#      own signed release record (`release-manifest.json` + `.sig`: its proved `commit`), not from run history (which
#      misses a deploy made by the old per-merge trigger, a cancelled run and a failed re-run) and not from `event.before`
#      (a refused force-rewind still moves the ref). The compare API must say the pushed commit is `ahead` or `identical`;
#      `behind` or `diverged` builds, signs and deploys NOTHING. An unreadable, non-200 or unverifiable live record, or a
#      failed compare, FAILS the job (closed). THAT IS ONLY A PRE-FILTER: GitHub can re-run the deploy job alone on a
#      stale "allow", so the deploy job repeats the decision immediately before the upload from the project's CURRENT
#      production deployment (the Cloudflare Pages API) and the signed record, on every attempt (below). A
#      skipped run is a green run with no deploy, so a consumer must read the `deploy` job's own conclusion, not the run's.
#   2. A STALE COMMIT NEVER DEPLOYS LAST. The concurrency group below serialises runs but does NOT order them: pushes A
#      then B can run B first, and re-running an older green run does the same, so A would then overwrite the production
#      alias with older app code. The `deploy` job therefore refuses a stale commit inside the serialised path,
#      immediately before `wrangler pages deploy`: it reads the CURRENT head of the run's own branch (read-only
#      `git ls-remote`) and deploys only when that head is this run's GITHUB_SHA. Otherwise the step logs "a newer
#      commit <sha> is on <branch>; its own run deploys it" and EXITS NON-ZERO, so the `deploy` job concludes `failure`,
#      never `success` (a consumer that needs a green "Deploy PWA" job for a commit must not read a refused deploy as a
#      deployed one). A branch read that fails fails the step too: never a guess, never a deploy.
#
# Environments: `pwa-release-v5` and `pwa-deploy-v5` must allow `rebuild/preview` (scripts/local/setup-pwa-release-v5.sh
# sets that rule). Until they do, a `rebuild/preview` run passes `gate` and `build`, then `sign` is rejected at the
# environment gate ("Branch `rebuild/preview` is not allowed to deploy to pwa-release-v5 due to environment protection
# rules"), so nothing is signed or deployed and the run is red.
#
# The preview names its own app through ONE switch, `FY_HOSTED_APP_ORIGIN`, which `scripts/ci/hosted-app-origin.sh`
# turns into the app's origin define, the release key file (`packages/app/release-signing-key.preview.pub`, committed
# on this branch only) and, for the daemon compile, its defines. Set it at workflow level so the signing and deploy
# jobs, which run the same script, agree with the build.
#
# Owner set-up, once, before the first run: scripts/local/setup-pwa-release-v5.sh (environments, deployment-branch
# rule, signing key). docs/pwa-release-signing.md is the contract.
on:
  push:
    branches: [rebuild/preview]

concurrency:
  group: pwa-pages-v5
  cancel-in-progress: false

env:
  FY_HOSTED_APP_ORIGIN: https://ferretry-v5.pages.dev

# THREE JOBS, BECAUSE THE SIGNING KEY MUST NEVER SHARE A RUNNER WITH THE BUILD (docs/pwa-release-signing.md).
#
#   build   installs dependencies and builds the release. Holds NO secret: any dependency's install
#           script or build plugin runs here, so NOTHING it produces is trusted downstream.
#   sign    holds the signing key, and nothing else. It installs nothing and runs no build — only
#           openssl and jq, through scripts/ci/sign-pwa-release.sh. Before it signs, that script
#           proves the list says only what THIS run decided (scripts/ci/check-pwa-release.sh): this
#           run's number and commit, the checkout's next key or none, no Pages server code, and
#           exactly the built files. A compromised build therefore cannot get a real signature on an
#           attacker's next key or a frozen sequence; at worst it spoils one release's app code.
#   deploy  holds only the Cloudflare token. It runs the same check and proves the signature
#           (scripts/ci/verify-pwa-release.sh) before it uploads a byte.
#
# Every action in this workflow is pinned to an exact SHA, because two of its jobs hold long-lived
# secrets (docs/standards/ci-cd/index.md).
jobs:
  gate:
    timeout-minutes: 5
    name: Does this ref feed the preview
    # Every job opens with this exact one-ref guard (scripts/validate/release-guards.sh holds it): `push` is already
    # filtered to this branch (and there is no manual trigger), so the guard is the second line, not the only one.
    if: github.ref == 'refs/heads/rebuild/preview'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.rule.outputs.deploy }}
    steps:
      # Only for the committed release public key and scripts/ci/verify-pwa-release.sh; nothing is installed and no
      # environment is entered, so the gate holds no secret.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # THE REFERENCE IS WHAT THE LIVE SITE SAYS IT IS, NOT RUN HISTORY AND NOT `event.before`. The commit that is really
      # live is in the site's own signed release record, the manifest the app itself verifies (`commit` and `sequence`).
      # Run history misses a live deploy that came from the old per-merge trigger, one whose run was cancelled while
      # finishing, and one whose later re-run failed; `event.before` moves with a refused force-rewind. So the gate
      # downloads the live `release-manifest.json` and `.sig`, PROVES the signature with the same script the deploy uses
      # (against this commit's committed preview key), and requires the pushed commit to be the live commit or a
      # descendant of it (the compare API). Anything it cannot read, prove or relate FAILS CLOSED: the job fails, nothing
      # is built, signed or deployed, except a 404 for the manifest, which this pre-filter passes on to the deploy job.
      #
      # THIS JOB IS ONLY A FAST PRE-FILTER, NOT THE AUTHORITY. GitHub can re-run the `deploy` job alone, reusing this
      # job's stale "allow" after the live release moved on, so the check that counts is repeated INSIDE the deploy job,
      # immediately before the upload ("Refuse a release that goes backwards"), on every attempt.
      - name: Apply the never-backwards rule
        id: rule
        env:
          GH_TOKEN: ${{ github.token }}
          DELETED: ${{ github.event.deleted }}
          AFTER: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ ${DELETED} == true ]]; then
            echo "the preview ref was deleted: there is nothing to deploy"
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          origin="$(./scripts/ci/hosted-app-origin.sh)"
          live_dir="$(mktemp -d)"
          trap 'rm -rf "${live_dir}"' EXIT
          # One fetch per file, no redirects followed, a cache-busting query and no-cache so a just-finished deploy is
          # not read as the previous one. The status is read from the response, never guessed from the body.
          fetch() {
            curl --silent --show-error --max-time 30 --retry 2 --header 'Cache-Control: no-cache' \
              --output "${live_dir}/$1" --write-out '%{http_code}' "${origin}/$1?gate=${RUN_ID}"
          }
          manifest_status="$(fetch release-manifest.json)" || {
            echo "❌ could not read ${origin}/release-manifest.json; refusing to guess what is live" >&2
            exit 1
          }
          if [[ ${manifest_status} == 404 ]]; then
            # This job is only a FAST PRE-FILTER (it holds no Cloudflare credential, so it cannot tell a never-deployed
            # project from a wrong origin). It lets a 404 through; the deploy job's own check, which reads the project's
            # production deployment from the Cloudflare Pages API on EVERY attempt, is the authority and fails when that
            # shows a deployment.
            echo "${origin} has no release manifest (HTTP 404): the deploy job decides whether anything is live, so this pre-filter passes ${AFTER} on"
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ ${manifest_status} != 200 ]]; then
            echo "❌ ${origin}/release-manifest.json answered HTTP ${manifest_status}; refusing to guess what is live" >&2
            exit 1
          fi
          signature_status="$(fetch release-manifest.sig)" || {
            echo "❌ could not read ${origin}/release-manifest.sig; refusing to guess what is live" >&2
            exit 1
          }
          if [[ ${signature_status} != 200 ]]; then
            echo "❌ ${origin}/release-manifest.sig answered HTTP ${signature_status}; refusing to guess what is live" >&2
            exit 1
          fi
          # The live record must be signed by this commit's preview key; a record that does not verify is not evidence.
          ./scripts/ci/verify-pwa-release.sh "${live_dir}" ||
            {
              echo "❌ the live release record at ${origin} does not verify; refusing to guess what is live" >&2
              exit 1
            }
          live="$(jq -er '.commit' "${live_dir}/release-manifest.json")"
          if [[ ! ${live} =~ ^[0-9a-f]{40}$ ]]; then
            echo "❌ the live release record names '${live}', which is not a commit id; refusing to guess whether this would go backwards" >&2
            exit 1
          fi
          # `status` is how AFTER relates to the live commit: ahead, identical, behind or diverged. A failed read fails the job (never a guess).
          relation="$(gh api "repos/${REPOSITORY}/compare/${live}...${AFTER}" --jq .status)"
          case "${relation}" in
            ahead | identical)
              echo "${AFTER} is ${relation} of the live ${live}: it is the live commit or a descendant, so the preview follows it"
              echo "deploy=true" >> "${GITHUB_OUTPUT}"
              ;;
            behind | diverged)
              echo "${AFTER} is ${relation} relative to the live ${live}: this push deploys nothing (it would go backwards)"
              echo "deploy=false" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "❌ unexpected compare status '${relation}'; refusing to guess whether this would go backwards" >&2
              exit 1
              ;;
          esac

  build:
    timeout-minutes: 15
    name: Build PWA release
    needs: gate
    if: github.ref == 'refs/heads/rebuild/preview' && needs.gate.outputs.deploy == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # The published model catalog is versioned by the commits that changed its model lists
          # (docs/model-catalog.md), which needs the history a shallow checkout leaves out.
          fetch-depth: 0
      - uses: ./.github/actions/install-nix
      - name: Build static PWA bundle
        env:
          # What orders releases: a counter GitHub owns and only ever raises. A re-run keeps its run's
          # number, so re-running an old run republishes an OLD release, which installed copies refuse.
          # This workflow file's counter is the preview's own: it does not share production's (docs/pwa-release-signing.md).
          PWA_RELEASE_SEQUENCE: ${{ github.run_number }}
          # A shallow checkout here would publish one catalog version forever; fail instead.
          MODEL_CATALOG_REQUIRE_HISTORY: '1'
        run: nix develop .#ci -c ./scripts/ci/build-pwa.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pwa-dist
          path: packages/app/dist
          if-no-files-found: error
          retention-days: 1

  sign:
    timeout-minutes: 10
    name: Sign PWA release
    needs: [gate, build]
    if: github.ref == 'refs/heads/rebuild/preview' && needs.gate.outputs.deploy == 'true'
    # The preview's release signing key lives ONLY in this protected environment, whose deployment-branch rule allows
    # `rebuild/preview` and nothing else (scripts/local/setup-pwa-release-v5.sh creates them), so no
    # other workflow or ref can read it.
    environment: pwa-release-v5
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      # Only for scripts/ci/sign-pwa-release.sh and the committed public key; nothing is installed.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pwa-dist
          path: ${{ runner.temp }}/dist
      # An installed copy of the app refuses any release it cannot verify, so an unsigned deploy
      # would strand every reader on their current version. A missing secret fails here instead.
      # The key reaches the signer on STDIN: `printf` is a shell builtin, so no process's arguments
      # carry it, and the signer itself runs without it in its environment.
      - name: Sign the release list
        env:
          PWA_RELEASE_SIGNING_KEY: ${{ secrets.PWA_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z ${PWA_RELEASE_SIGNING_KEY} ]]; then
            echo "❌ PWA_RELEASE_SIGNING_KEY is not set; refusing to deploy an unsigned PWA release" >&2
            echo "   Add it to the protected 'pwa-release-v5' environment (docs/pwa-release-signing.md)." >&2
            exit 1
          fi
          printf '%s\n' "${PWA_RELEASE_SIGNING_KEY}" |
            env -u PWA_RELEASE_SIGNING_KEY ./scripts/ci/sign-pwa-release.sh \
              --sequence "${GITHUB_RUN_NUMBER}" --commit "${GITHUB_SHA}" "${RUNNER_TEMP}/dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pwa-release-signature
          path: ${{ runner.temp }}/dist/release-manifest.sig
          if-no-files-found: error
          retention-days: 1

  deploy:
    timeout-minutes: 10
    name: Deploy PWA
    needs: [gate, build, sign]
    if: github.ref == 'refs/heads/rebuild/preview' && needs.gate.outputs.deploy == 'true'
    # The Cloudflare credentials live in this environment, which only `rebuild/preview` may deploy
    # to, so no other branch can reach them; it is not the signing key's environment, so the deploy job never holds that key. They are named
    # CLOUDFLARE_PAGES_V5_* and nothing at repository level has those names, so this job can NEVER fall back to
    # production's account token (the secrets setup script requires a Pages-only token for ferretry-v5).
    environment: pwa-deploy-v5
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # Whole history: "Refuse a release that goes backwards" asks git whether the live commit is an ancestor of this one.
          fetch-depth: 0
      - uses: ./.github/actions/install-nix
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pwa-dist
          path: packages/app/dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pwa-release-signature
          path: ${{ runner.temp }}/signature
      - name: Verify the signed release
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/signature/release-manifest.sig" packages/app/dist/release-manifest.sig
          ./scripts/ci/check-pwa-release.sh --sequence "${GITHUB_RUN_NUMBER}" --commit "${GITHUB_SHA}" packages/app/dist
          ./scripts/ci/verify-pwa-release.sh packages/app/dist
      # Wrangler runs through the pinned devshell rather than cloudflare/wrangler-action. The action
      # installs wrangler with whichever package manager it detects, picks bun from this repository's
      # lockfile, and then cannot find bun — it runs outside the nix shell that provides it. Calling
      # bunx inside `nix develop` uses the toolchain the rest of CI already uses, and drops a
      # third-party action from the deploy path. Wrangler reads both credentials from the
      # environment, so neither is ever passed as an argument.
      #
      # The project is created on first run: Cloudflare merged Workers and Pages into one flow whose
      # direct-upload path wants files before it will create a project, which a repository that
      # deploys its own build cannot supply from a browser. `project create` fails when the project
      # exists, so the list is checked first rather than swallowing the error — a create that fails
      # for any OTHER reason must still stop the deploy.
      - name: Require the preview's own Cloudflare credentials
        env:
          CLOUDFLARE_PAGES_V5_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_V5_API_TOKEN }}
          CLOUDFLARE_PAGES_V5_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PAGES_V5_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z ${CLOUDFLARE_PAGES_V5_API_TOKEN} || -z ${CLOUDFLARE_PAGES_V5_ACCOUNT_ID} ]]; then
            echo "❌ the Pages-only credentials for ferretry-v5 are not set in the 'pwa-deploy-v5' environment" >&2
            echo "   Run scripts/local/setup-pwa-release-v5.sh. This deploy never falls back to a repository-level token." >&2
            exit 1
          fi
      - name: Ensure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_V5_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PAGES_V5_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          projects="$(nix develop .#ci -c bunx wrangler pages project list)"
          if grep -qE '(^|[[:space:]])ferretry-v5([[:space:]]|$)' <<<"${projects}"; then
            echo "project ferretry-v5 already exists"
          else
            nix develop .#ci -c bunx wrangler pages project create ferretry-v5 --production-branch=rebuild/5.0
          fi
      # Runs inside the serialised path (the shared concurrency group) and holds no Cloudflare credential. The
      # concurrency group does not order runs, so an older commit's run can reach this point AFTER a newer one has
      # deployed (or while it waits); deploying it would put older app code on the production alias. Deploy only the
      # branch's current head. Exiting non-zero keeps this job's conclusion honest: a refused deploy is not a success.
      # The token reaches git through GIT_CONFIG_* variables, never an argument, and is masked.
      - name: Refuse a stale commit
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth}"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader "GIT_CONFIG_VALUE_0=AUTHORIZATION: basic ${auth}"
          # --exit-code: 0 = the branch exists, 2 = it does not; any failure to read is a failure here (never a guess).
          status=0
          listing="$(git ls-remote --exit-code --heads "https://github.com/${REPOSITORY}" "refs/heads/${BRANCH}")" || status=$?
          if ((status != 0)); then
            echo "❌ could not read the head of ${BRANCH} (git ls-remote exit ${status}); refusing to deploy ${GITHUB_SHA} without knowing it is the newest" >&2
            exit 1
          fi
          current="${listing%%[[:space:]]*}"
          # Exactly one line, "<40-hex sha><TAB>refs/heads/<branch>": anything else is not a head we can compare.
          if [[ ! ${current} =~ ^[0-9a-f]{40}$ || ${listing} != "${current}"[[:space:]]"refs/heads/${BRANCH}" ]]; then
            echo "❌ unexpected branch listing for ${BRANCH}; refusing to deploy ${GITHUB_SHA}" >&2
            exit 1
          fi
          if [[ ${current} != "${GITHUB_SHA}" ]]; then
            echo "a newer commit ${current} is on ${BRANCH}; its own run deploys it" >&2
            echo "❌ not deploying ${GITHUB_SHA}: it is no longer the head of ${BRANCH} (this job concludes as failed on purpose, so it never reads as deployed)" >&2
            exit 1
          fi
          echo "${GITHUB_SHA} is the head of ${BRANCH}: deploying it"
      # THE AUTHORITATIVE NEVER-BACKWARDS CHECK. It runs on every attempt of this job (GitHub can re-run this job alone,
      # so nothing the gate decided earlier is trusted), right before the upload, with the token this job already has.
      # What is live is the project's CURRENT PRODUCTION DEPLOYMENT, read from the Cloudflare Pages API
      # (`canonical_deployment`; its commit hash is recorded by every upload, this workflow's `--commit-hash` and, before
      # it, wrangler's own from the checkout), cross-checked against the live SIGNED release record, which also gives the
      # live sequence. Then: the live commit must be an ancestor of (or equal to) this commit (git, on the full history);
      # an identical commit is a no-op (the upload is skipped, the job is still green); otherwise this run's sequence must
      # exceed the live signed sequence. Anything unreadable, unparseable, unverifiable, or disagreeing FAILS the job.
      # "No production deployment" from the API is the one first-deploy signal; a manifest that is missing while the API
      # shows a deployment is a failure. The token reaches curl on stdin, never in an argument.
      - name: Refuse a release that goes backwards
        id: live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_V5_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PAGES_V5_ACCOUNT_ID }}
          AFTER: ${{ github.sha }}
          SEQUENCE: ${{ github.run_number }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          fail() {
            echo "❌ $*" >&2
            exit 1
          }
          work_dir="$(mktemp -d)"
          trap 'rm -rf "${work_dir}"' EXIT
          # 1. The project's current production deployment, from the API.
          api_status="$(printf 'Authorization: Bearer %s\n' "${CLOUDFLARE_API_TOKEN}" |
            curl --silent --show-error --max-time 30 --retry 2 --header @- --output "${work_dir}/project.json" \
              --write-out '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/ferretry-v5")" ||
            fail "could not read the Pages project ferretry-v5; refusing to guess what is live"
          [[ ${api_status} == 200 ]] || fail "the Pages API answered HTTP ${api_status} for ferretry-v5; refusing to guess what is live"
          jq -e '.success == true and (.result | type == "object") and (.result | has("canonical_deployment"))' "${work_dir}/project.json" >/dev/null ||
            fail "the Pages API answer for ferretry-v5 is not a project with a production deployment field; refusing to guess what is live"
          if [[ "$(jq -c '.result.canonical_deployment' "${work_dir}/project.json")" == null ]]; then
            echo "the Pages API shows no production deployment of ferretry-v5: this is the first deploy, so nothing is older"
            echo "skip=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          api_commit="$(jq -r '.result.canonical_deployment.deployment_trigger.metadata.commit_hash // ""' "${work_dir}/project.json")"
          # 2. The live signed record: it gives the live sequence, and (when the API recorded no commit) the live commit.
          # A manifest that is missing or unverifiable while a deployment exists is a failure, never a first deploy.
          origin="$(./scripts/ci/hosted-app-origin.sh)"
          nonce="${GITHUB_RUN_ID}-${ATTEMPT}-$(date +%s%N)"
          for name in release-manifest.json release-manifest.sig; do
            file_status="$(curl --silent --show-error --max-time 30 --retry 2 --header 'Cache-Control: no-cache' \
              --output "${work_dir}/${name}" --write-out '%{http_code}' "${origin}/${name}?check=${nonce}")" ||
              fail "could not read ${origin}/${name} while a production deployment exists; refusing to guess what is live"
            [[ ${file_status} == 200 ]] || fail "${origin}/${name} answered HTTP ${file_status} while a production deployment exists; refusing to guess what is live"
          done
          ./scripts/ci/verify-pwa-release.sh "${work_dir}" || fail "the live release record at ${origin} does not verify; refusing to guess what is live"
          record_commit="$(jq -er '.commit' "${work_dir}/release-manifest.json")"
          live_sequence="$(jq -er '.sequence' "${work_dir}/release-manifest.json")"
          [[ ${record_commit} =~ ^[0-9a-f]{40}$ ]] || fail "the live release record names '${record_commit}', which is not a commit id"
          [[ ${live_sequence} =~ ^(0|[1-9][0-9]{0,14})$ ]] || fail "the live release record names sequence '${live_sequence}', which is not a run number"
          if [[ ${api_commit} =~ ^[0-9a-f]{40}$ ]]; then
            # The API's commit is the authority. A different signed record is a stale CDN copy or a deploy in flight: not evidence.
            [[ ${api_commit} == "${record_commit}" ]] ||
              fail "the production deployment is ${api_commit} but the signed record at ${origin} says ${record_commit} (stale copy or a deploy in flight); refusing to guess what is live"
            live="${api_commit}"
          else
            echo "the production deployment records no commit hash: falling back to the signed release record's ${record_commit}"
            live="${record_commit}"
          fi
          # 3. The decision.
          git cat-file -e "${live}^{commit}" 2>/dev/null || fail "the live commit ${live} is not in this checkout's history; refusing to guess whether ${AFTER} goes backwards"
          if [[ ${live} == "${AFTER}" ]]; then
            echo "${AFTER} is already the live production deployment: nothing to upload (this job stays green)"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git merge-base --is-ancestor "${live}" "${AFTER}" ||
            fail "the live ${live} is not an ancestor of ${AFTER}: deploying it would go backwards or sideways"
          if ((SEQUENCE <= live_sequence)); then
            fail "this run's sequence ${SEQUENCE} does not exceed the live signed sequence ${live_sequence}; installed copies would refuse it"
          fi
          echo "${AFTER} descends from the live ${live} and its sequence ${SEQUENCE} exceeds ${live_sequence}: deploying it"
          echo "skip=false" >> "${GITHUB_OUTPUT}"
      # `--branch` is the Pages project's PRODUCTION branch whatever ref built this bundle: a deploy of any other
      # branch name would land on a preview alias and leave https://ferretry-v5.pages.dev on the old app. `--commit-hash`
      # records the built commit on the deployment, which is what the check above reads next time.
      - name: Deploy production bundle
        if: steps.live.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_V5_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PAGES_V5_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          nix develop .#ci -c bunx wrangler pages deploy packages/app/dist \
            --project-name=ferretry-v5 --branch=rebuild/5.0 --commit-hash="${GITHUB_SHA}"
