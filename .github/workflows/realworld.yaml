name: Realworld

# THE REALWORLD TIER. Everything here is machine-dependent: a wall-clock, memory or rate claim
# (`packages/**/tests/realworld/`, bunfig.realworld.toml). Its outcome depends on the machine, not only on
# the code, so none of it may gate a pull request or a release — see docs/standards/testing ("Realworld")
# and docs/standards/ci-cd ("Release gating").
#
# ITS OWN WORKFLOW, so that:
#   - Release, which fires on CI's conclusion on `main`, never waits on it: a failure here files an issue
#     (`report` below) and releases anyway;
#   - nothing in branch protection names it, so a red run is never a merge blocker;
#   - the nightly run measures only this, not all of CI again.
#
# The `realworld` job (the timing, memory and rate budgets, on a Namespace 8x16) runs ONLY on the nightly
# schedule and on manual dispatch: ~9.4k runner-minutes a day when it ran on every full pull request and
# every merge, for an advisory tier nobody waits on (owner's call, 2026-11-06). To measure a branch's
# budgets before the night: Actions > Realworld > Run workflow.
#
# Ferretry 5.0: the containment, Safari sandbox, pinned harness contract and tmux 3.8 proofs that also
# lived here drove packages that no longer exist (packages/daemon, fleet, pwa). They return, beside the
# plugin that owns each claim, when that plugin is ported; until then this workflow holds only the nightly
# tier, so it has no pull-request or push trigger left to run.
on:
  schedule:
    # ~09:00 UTC, off the hour; once a day, on the default branch.
    - cron: '17 9 * * *'
  workflow_dispatch:

# The nightly and a manual dispatch each keep a group of their own run id, so neither is ever superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # The Linux realworld tier: the machine-dependent tests, in one process, on a quiet dedicated VM. Nightly and
  # manual dispatch ONLY: on a pull request or a push to `main` this job is skipped (a skipped job counts as
  # passed, and `report` below still reads the others).
  realworld:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    name: Realworld Tests
    timeout-minutes: 30
    permissions:
      contents: read
    # Namespace 8x16 on every event that runs it (the nightly and a manual dispatch): a timing or memory budget is only
    # worth measuring on a machine nothing else is using, and a shared runner's noise was the reason
    # these tests left the blocking tier. `vars.CI_RUNNER_POOL == 'github'` is the same escape hatch the
    # other jobs have.
    runs-on: >-
      ${{
        vars.CI_RUNNER_POOL == 'github' && 'ubuntu-latest'
        || fromJSON('["nscloud-ubuntu-24.04-amd64-8x16-with-cache","nscloud-cache-tag-ferretry-nix","nscloud-cache-size-10gb","nscloud-cache-allow-commit-from-main"]')
      }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Mount the Nix store cache
        if: runner.environment == 'self-hosted'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: nix
      - uses: ./.github/actions/install-nix
      - name: Run the realworld tests
        run: nix develop .#ci -c ./scripts/ci/test.sh realworld
      # `always()`: a red run is the run whose results matter, and `report` reads them.
      - name: Upload the realworld results
        id: upload_1
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realworld-results
          path: |
            coverage/realworld/junit.xml
            coverage/realworld/console.log
          if-no-files-found: warn

  # A red night nobody reads is a night nobody acts on, so a failed nightly or dispatched run files (or adds
  # to) one issue per failing test, `realworld: <file> > <test>`.
  report:
    name: Report failed realworld tests
    needs: [realworld]
    # `failure()` is true when the realworld job failed.
    if: ${{ failure() && github.event_name != 'pull_request' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: realworld-results
          path: ${{ runner.temp }}/results
        continue-on-error: true
      - name: File or update the issues
        env:
          GH_TOKEN: ${{ github.token }}
          FY_REALWORLD_JOB_RESULT: ${{ needs.realworld.result }}
        run: |
          ./scripts/ci/realworld-report.sh "${{ runner.temp }}/results/junit.xml" "${{ runner.temp }}/results/console.log"
