# The kernel's darwin-only tests, on a real Mac. Each of these files holds a `describe.skipIf(process.platform !==
# 'darwin')` copy (or a real-library case) that checks what Linux cannot: the `libSystem.B.dylib` name, the `__error`
# symbol, the darwin constant values, the real `fchdir`, the real `mkdirat`, and Apple arm64's handling of openat's
# variadic `mode`. Until this ran, nothing ran them (the smoke only runs scripts/release/smoke.sh): ports-pending
# "[kernel: macOS descriptor calls]". One file per step, so a red step names the file; each is one `bun test`
# process, with the same switches the unit and integration tiers set. Called from each attempt of smoke-darwin.yaml,
# so a macOS runner that never starts is read by the one policy in docs/standards/ci-cd ("macOS runner shortage").
name: Kernel darwin tests
description: Install the pinned toolchain and run the kernel's darwin-only integration test files, one per step.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/install-nix
    - name: Install dependencies
      shell: bash
      run: ./scripts/ci/in-devshell.sh bun install --frozen-lockfile
    - name: Kernel darwin tests (root-rename-ffi)
      shell: bash
      env:
        FY_MODEL_CATALOG: 'off'
        FY_LOCAL_MODELS: 'off'
        FY_RELAY_DIRECTORY_ORIGIN: 'off'
        FY_UPDATE_CHECK: 'off'
      run: ./scripts/ci/in-devshell.sh bun test --config=bunfig.int.toml packages/core/kernel/tests/integration/host/root-rename-ffi.test.ts
    - name: Kernel darwin tests (root-remove-bracket)
      shell: bash
      env:
        FY_MODEL_CATALOG: 'off'
        FY_LOCAL_MODELS: 'off'
        FY_RELAY_DIRECTORY_ORIGIN: 'off'
        FY_UPDATE_CHECK: 'off'
      run: ./scripts/ci/in-devshell.sh bun test --config=bunfig.int.toml packages/core/kernel/tests/integration/host/root-remove-bracket.test.ts
    - name: Kernel darwin tests (node-fs-held-folder, the real mkdirat)
      shell: bash
      env:
        FY_MODEL_CATALOG: 'off'
        FY_LOCAL_MODELS: 'off'
        FY_RELAY_DIRECTORY_ORIGIN: 'off'
        FY_UPDATE_CHECK: 'off'
      run: ./scripts/ci/in-devshell.sh bun test --config=bunfig.int.toml packages/core/kernel/tests/integration/host/node-fs-held-folder.test.ts
