# The one way a job installs Nix (docs/standards/ci-cd/index.md#installing-nix). Every workflow calls
# this instead of an installer action directly so the Nix setup, the network settings and the retries
# below are written once. On Namespace the action also mounts the `/nix` cache volume itself, so a job
# no longer mounts it first.
name: Install Nix
description: Set up Nix with AtomiCloud/actions.setup-nix, then realise the job's dev shell, retrying network failures.
inputs:
  shell:
    description: The flake dev shell the job enters, realised here so a failed download is retried before the job's real step.
    default: .#ci
runs:
  using: composite
  steps:
    # `runner.environment == 'self-hosted'` is how every workflow already tells a Namespace runner from a
    # GitHub-hosted one. checkout is the job's own step before this action (it owns `persist-credentials`),
    # and nothing here reads the GITHUB_*_SLUG variables.
    #
    # THE RETRY. The installer's download (`releases.nixos.org` / `install.determinate.systems`) fails before
    # anything is installed, so a second attempt a minute later is safe; there is no third. On Namespace the
    # first attempt has already created and mounted `/nix` (a second `namespacelabs: 'true'` run would stop at
    # `mkdir /nix`), so the second attempt runs as `namespacelabs: 'false'`: the plain installer over the
    # mounted volume. A warm Namespace job never downloads an installer at all.
    - id: first
      continue-on-error: true
      uses: AtomiCloud/actions.setup-nix@6d7c1e0710ce2fbda572edd6c3a473ea8210b4c0 # v4.0.0
      with:
        namespacelabs: ${{ runner.environment == 'self-hosted' && 'true' || 'false' }}
        checkout: 'false'
        github-slug: 'false'
    - if: steps.first.outcome == 'failure'
      shell: bash
      run: echo "::warning::installing Nix failed once; trying again in 60s" && sleep 60
    - if: steps.first.outcome == 'failure'
      uses: AtomiCloud/actions.setup-nix@6d7c1e0710ce2fbda572edd6c3a473ea8210b4c0 # v4.0.0
      with:
        namespacelabs: 'false'
        checkout: 'false'
        github-slug: 'false'
    # Patient downloads for every Nix client call after this step (flake inputs fetched by the client).
    - shell: bash
      run: |
        {
          echo "NIX_CONFIG<<__FY_NIX_CONFIG__"
          echo "download-attempts = 10"
          echo "connect-timeout = 15"
          echo "__FY_NIX_CONFIG__"
        } >>"${GITHUB_ENV}"
    - shell: bash
      env:
        SHELL_REF: ${{ inputs.shell }}
      run: ./scripts/ci/nix-realise.sh "${SHELL_REF}"
