[test]
# The REALWORLD tier: tests whose outcome depends on the machine (wall-clock speed, memory, rate, a real
# upstream tool), not on the code. It is non-blocking — `.github/workflows/realworld.yaml` is its own
# workflow, and a failure files an issue instead of failing a pull request or a release.
# Every tier runs offline: no booted daemon follows the published model catalog or the hosted relay.
preload = ["./packages/daemon/tests/support/offline-environment.ts"]
root = "packages"
pathIgnorePatterns = ["**/tests/unit/**", "**/tests/integration/**", "**/tests/sit/**"]
# THE PER-TEST TIMEOUT IS NOT SET HERE: `timeout` under `[test]` is ignored by Bun 1.3.13, so
# `scripts/ci/test.sh realworld` passes `--timeout` on the command line (see bunfig.int.toml).
#
# NO COVERAGE LEDGER. A test that asserts a machine-dependent outcome proves how this machine behaved,
# not that a line of the product is correct; the lines it reaches are owned by the unit and integration
# ledgers, which must be green without it.
