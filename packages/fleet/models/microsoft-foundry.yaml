# Claude on Microsoft Foundry. A model here is Claude Code's tier alias: the login's
# ANTHROPIC_DEFAULT_OPUS/SONNET/HAIKU_MODEL variables name YOUR deployments, so /model opus lands on yours.
label: Microsoft Foundry
docs: https://code.claude.com/docs/en/microsoft-foundry
verified: '2026-10-18'
unverified:
  - 'Haiku 5.5 costs five times as much for a request whose prompt is over 100,000 tokens; analytics prices whole sessions, so its price is the lower one and a long-prompt session is under-counted.'
  - "Foundry bills Anthropic's standard rates, which are the prices here; a transcript names your deployment rather than these aliases, so a session is priced only when the two match."
customIds: true
claude:
  models:
    - id: opus
      price:
        provider: anthropic
        input: 4
        output: 20
        cacheRead: 0.2
        cacheWrite5m: 5
        cacheWrite1h: 8
        source: https://platform.claude.com/docs/en/about-claude/pricing
        verified: '2026-10-20'
      label: Opus 5.5 (your Opus deployment)
      tier: best
      context: 1000000
      efforts: [low, medium, high, xhigh, max]
      defaultEffort: medium
      default: true
    - id: sonnet
      price:
        provider: anthropic
        input: 2
        output: 10
        cacheRead: 0.1
        cacheWrite5m: 2.5
        cacheWrite1h: 4
        source: https://platform.claude.com/docs/en/about-claude/pricing
        verified: '2026-10-20'
      label: Sonnet 5.5 (your Sonnet deployment)
      tier: balanced
      context: 1000000
      efforts: [low, medium, high, xhigh, max]
      defaultEffort: high
    - id: haiku
      price:
        provider: anthropic
        input: 0.1
        output: 0.5
        cacheRead: 0.01
        cacheWrite5m: 0.125
        cacheWrite1h: 0.2
        source: https://platform.claude.com/docs/en/about-claude/pricing
        verified: '2026-10-20'
      label: Haiku 5.5 (your Haiku deployment)
      tier: fast
      context: 1000000
      efforts: [low, medium, high, xhigh, max]
      defaultEffort: medium
