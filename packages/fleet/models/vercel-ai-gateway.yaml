# The Vercel AI Gateway's Claude models, as its claude-code endpoint names them in Claude Code's picker.
label: Vercel AI Gateway
docs: https://vercel.com/docs/ai-gateway/coding-agents/claude-code
verified: '2026-10-18'
unverified:
  - Vercel's guide shows claude-code/anthropic/claude-opus-5; the 5.5 ids here follow its documented format and were not read on that page.
  - "Haiku 5.5 costs five times as much for a request whose prompt is over 100,000 tokens; analytics prices whole sessions, so its price is the lower one and a long-prompt session is under-counted."
  - "Vercel lists no 1-hour cache write price; Anthropic's, which every other Vercel price matches, is used."
customIds: true
claude:
  tiers:
    opus: claude-code/anthropic/claude-opus-5.5[1m]
    sonnet: claude-code/anthropic/claude-sonnet-5.5[1m]
    haiku: claude-code/anthropic/claude-haiku-5.5[1m]
  models:
    - id: claude-code/anthropic/claude-opus-5.5
      price:
        provider: anthropic
        input: 4
        output: 20
        cacheRead: 0.2
        cacheWrite5m: 5
        cacheWrite1h: 8
        source: https://ai-gateway.vercel.sh/v1/models
        verified: '2026-10-20'
      suffix: '[1m]'
      label: Opus 5.5
      tier: best
      context: 1000000
      efforts: [low, medium, high, xhigh, max]
      defaultEffort: medium
      default: true
    - id: claude-code/anthropic/claude-sonnet-5.5
      price:
        provider: anthropic
        input: 2
        output: 10
        cacheRead: 0.1
        cacheWrite5m: 2.5
        cacheWrite1h: 4
        source: https://ai-gateway.vercel.sh/v1/models
        verified: '2026-10-20'
      suffix: '[1m]'
      label: Sonnet 5.5
      tier: balanced
      context: 1000000
      efforts: [low, medium, high, xhigh, max]
      defaultEffort: high
    - id: claude-code/anthropic/claude-haiku-5.5
      price:
        provider: anthropic
        input: 0.1
        output: 0.5
        cacheRead: 0.01
        cacheWrite5m: 0.125
        cacheWrite1h: 0.2
        source: https://ai-gateway.vercel.sh/v1/models
        verified: '2026-10-20'
      suffix: '[1m]'
      label: Haiku 5.5
      tier: fast
      context: 1000000
      efforts: [low, medium, high, xhigh, max]
      defaultEffort: medium
