# A gateway you run (LiteLLM, or any Anthropic-compatible proxy) serves the names it is configured with.
# These are Anthropic's model ids, which a gateway in front of Claude usually keeps; type any other.
label: Your gateway
docs: https://code.claude.com/docs/en/llm-gateway
verified: '2026-10-18'
unverified:
  - A gateway serves whatever names its owner configured; these are Anthropic's ids, which a gateway may rename.
  - "Haiku 5.5 costs five times as much for a request whose prompt is over 100,000 tokens; analytics prices whole sessions, so its price is the lower one and a long-prompt session is under-counted."
  - "A gateway charges whatever its owner arranged; the prices are Anthropic's list prices for these ids."
customIds: true
claude:
  models:
    - id: claude-opus-5-5
      price:
        provider: anthropic
        input: 4
        output: 20
        cacheRead: 0.2
        cacheWrite5m: 5
        cacheWrite1h: 8
        source: https://platform.claude.com/docs/en/about-claude/pricing
        verified: '2026-10-20'
      label: Opus 5.5
      tier: best
      context: 1000000
      efforts: [low, medium, high, xhigh, max]
      defaultEffort: medium
    - id: claude-sonnet-5-5
      price:
        provider: anthropic
        input: 2
        output: 10
        cacheRead: 0.1
        cacheWrite5m: 2.5
        cacheWrite1h: 4
        source: https://platform.claude.com/docs/en/about-claude/pricing
        verified: '2026-10-20'
      label: Sonnet 5.5
      tier: balanced
      context: 1000000
      efforts: [low, medium, high, xhigh, max]
      defaultEffort: high
      default: true
    - id: claude-haiku-5-5
      price:
        provider: anthropic
        input: 0.1
        output: 0.5
        cacheRead: 0.01
        cacheWrite5m: 0.125
        cacheWrite1h: 0.2
        source: https://platform.claude.com/docs/en/about-claude/pricing
        verified: '2026-10-20'
      label: Haiku 5.5
      tier: fast
      context: 1000000
      efforts: [low, medium, high, xhigh, max]
      defaultEffort: medium
