# Kimi (Moonshot AI) models, for Claude Code (its Anthropic-compatible endpoint) and Codex (its Responses endpoint).
label: Kimi / Moonshot
docs: https://platform.kimi.ai/docs/guide/claude-code-kimi
verified: '2026-10-18'
unverified:
  - Kimi's guide says kimi-k2.7-code always thinks, while its model table says it does not; Ferretry offers no effort choice for it.
  - "Kimi charges one cache-write price per request in analytics: K3's 5-minute one ($3); its 1-hour write costs $6."
  - "Kimi lists no cache-write price for the K2.7 Code models; a written token is charged as input."
