# Qwen models on Alibaba Cloud Model Studio. The Coding Plan maps every slot to qwen3.7-plus;
# qwen3.7-max and qwen3.6-flash are pay-as-you-go models that a Coding Plan key may not serve.
label: Qwen / Model Studio
docs: https://www.alibabacloud.com/help/en/model-studio/claude-code
verified: '2026-10-18'
unverified:
  - Per-model context windows and reasoning controls are not on Alibaba's Claude Code page.
  - "Qwen prices rise with a request's input length; the prices are the lowest tier."
  - "Cache reads (10% of input) and cache writes (125% of input) are Model Studio's general rule, not per-model prices."
  - 'qwen3.7-plus shows a limited-time discount; whether its price is the discounted one is not stated.'
claude:
  tiers:
    opus: qwen3.7-plus
    sonnet: qwen3.7-plus
    haiku: qwen3.7-plus
    subagent: qwen3.7-plus
  models:
    - id: qwen3.7-max
      price:
        provider: alibaba
        input: 2.5
        output: 7.5
        cacheRead: 0.25
        cacheWrite: 3.125
        source: https://www.alibabacloud.com/help/en/model-studio/model-pricing
        verified: '2026-10-20'
      label: Qwen3.7 Max (pay-as-you-go)
      tier: best
      context: 1000000
    - id: qwen3.7-plus
      price:
        provider: alibaba
        input: 0.4
        output: 1.6
        cacheRead: 0.04
        cacheWrite: 0.5
        source: https://www.alibabacloud.com/help/en/model-studio/model-pricing
        verified: '2026-10-20'
      label: Qwen3.7 Plus
      tier: balanced
      context: 1000000
      default: true
    - id: qwen3.6-flash
      price:
        provider: alibaba
        input: 0.25
        output: 1.5
        cacheRead: 0.025
        cacheWrite: 0.3125
        source: https://www.alibabacloud.com/help/en/model-studio/model-pricing
        verified: '2026-10-20'
      label: Qwen3.6 Flash (pay-as-you-go)
      tier: fast
      context: 1000000
