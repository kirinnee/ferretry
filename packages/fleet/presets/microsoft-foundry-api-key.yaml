# Claude Code on Microsoft Foundry with a resource API key.
label: Microsoft Foundry (API key)
harness: claude
summary: Claude Code through your Microsoft Foundry resource with its API key. The model variables are your deployment names.
group: cloud
docs: https://code.claude.com/docs/en/microsoft-foundry
verified: '2026-10-16'
catalog: microsoft-foundry
unverified:
  - Foundry documents no free read, so the Test is one message capped at one token.
env:
  CLAUDE_CODE_USE_FOUNDRY:
    value: '1'
  ANTHROPIC_FOUNDRY_RESOURCE:
    value: ''
    description: the resource name only, not a URL
  ANTHROPIC_FOUNDRY_API_KEY:
    secretName: ANTHROPIC_FOUNDRY_API_KEY
  ANTHROPIC_DEFAULT_OPUS_MODEL:
    value: claude-opus-5-5
    description: your Opus deployment name
  ANTHROPIC_DEFAULT_SONNET_MODEL:
    value: claude-sonnet-5-5
    description: your Sonnet deployment name
  ANTHROPIC_DEFAULT_HAIKU_MODEL:
    value: claude-haiku-5-5
    description: your Haiku deployment name
test:
  kind: inference
  url: https://{ANTHROPIC_FOUNDRY_RESOURCE}.services.ai.azure.com/anthropic/v1/messages
  keyVariable: ANTHROPIC_FOUNDRY_API_KEY
  header: x-api-key
  scheme: ''
  headers:
    anthropic-version: '2023-06-01'
    content-type: application/json
  body: '{"model":"{ANTHROPIC_DEFAULT_HAIKU_MODEL}","max_tokens":1,"messages":[{"role":"user","content":"ping"}]}'
  note: Sends one message to your Haiku deployment, capped at one output token — a fraction of a cent.
quota:
  source: transcript-pricing
  note: Foundry documents no usage endpoint, so cost is counted from the transcript.
pricing: anthropic
detect:
  variables: [CLAUDE_CODE_USE_FOUNDRY, ANTHROPIC_FOUNDRY_API_KEY]
