# Codex on a model served by Ollama on this machine.
label: Ollama (local)
harness: codex
summary: Codex on a model Ollama serves on this machine, through Codex's own Ollama provider. Nothing leaves the machine.
docs: https://docs.ollama.com/integrations/codex
verified: '2026-10-16'
unverified:
  - Ollama's Responses API is stateless, so Codex features that resume a response on the server do not work.
codexProvider:
  id: ollama
  model: gpt-oss:20b
models: [gpt-oss:20b, gpt-oss:120b]
test:
  kind: local
  url: http://localhost:11434/api/tags
  note: Asks Ollama on this machine which models it has. Nothing leaves the machine.
quota:
  source: none
  note: A local model has no quota and no bill.
