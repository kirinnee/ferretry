<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Ferretry sign-in</title>
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <!-- The page an MCP server's sign-in provider sends the browser back to (docs/mcp-oauth.md). It is
         NOT the app: it needs no daemon, no pairing and no service worker. It hands its own address to
         the Ferretry tab that started the sign-in and wipes the code from its address bar, or asks the
         person to copy the address there. The logic is mcp-callback.js, a same-origin classic script,
         because the site policy runs no inline script. -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfbfc;
        --surface: #ffffff;
        --fg: #17171b;
        --muted: #666673;
        --border: #d9d9e0;
        --accent: #4f52d6;
        --accent-fg: #ffffff;
        --ok: #3d7b50;
        --warn: #8a6420;
        --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0d;
          --surface: #141417;
          --fg: #f2f2f4;
          --muted: #90909c;
          --border: #2a2a30;
          --accent: #8f93ee;
          --accent-fg: #0b0b0e;
          --ok: #6fae82;
          --warn: #c79a52;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--fg);
        font: 400 16px/1.5 var(--sans);
      }
      main {
        width: 100%;
        max-width: 440px;
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
      }
      .brand {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        line-height: 1.25;
      }
      p {
        margin: 0;
      }
      #message {
        color: var(--fg);
      }
      [data-state='done'] h1 {
        color: var(--ok);
      }
      [data-state='error'] h1,
      [data-state='failed'] h1 {
        color: var(--warn);
      }
      button {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        margin-top: 20px;
        padding: 0 20px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-fg);
        font: 600 16px/1 var(--sans);
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      [hidden] {
        display: none !important;
      }
      #note {
        margin-top: 12px;
        color: var(--muted);
        font-size: 14px;
      }
      #note:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <main id="callback" data-state="waiting" aria-live="polite">
      <p class="brand">Ferretry</p>
      <h1 id="title">Finishing sign-in</h1>
      <p id="message">Handing this sign-in to Ferretry…</p>
      <noscript>
        <p>Copy this page’s address from the address bar and paste it into the sign-in sheet in Ferretry.</p>
      </noscript>
      <button id="copy" type="button" hidden>Copy address</button>
      <p id="note" role="status"></p>
    </main>
    <script src="/oauth/mcp-callback.js"></script>
  </body>
</html>
