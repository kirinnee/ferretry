<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `interactive-widget=resizes-content`: Android's software keyboard must
         RESIZE the layout viewport rather than pan over it, so the composer stays
         inside the shell. iOS ignores this and pans instead — that half is
         handled by sizing the shell from `window.visualViewport`
         (`src/hooks/use-app-viewport.ts`).
         `viewport-fit=cover` lets the app paint into the notch / home-indicator
         area; `src/styles/index.css` pays the safe-area insets back where they
         matter.
         NO `maximum-scale` / `user-scalable=no`: pinch-zoom must keep working
         (WCAG 1.4.4). iOS focus-zoom is prevented the correct way instead — by
         never rendering a text field below 16px on a phone. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Both modes are real here, and every one of the seven families ships a
         light and a dark token set, so the UA is told to expect either rather
         than being handed a single scheme it would then have to fight. -->
    <meta name="color-scheme" content="light dark" />
    <title>Ferretry</title>
    <!-- iOS ignores the web manifest for Add-to-Home-Screen and reads these
         instead. Everything here is SNAPSHOTTED AT ADD TIME and effectively
         frozen: a later release cannot change the installed title.
         `black-translucent` lets the app paint under the status bar, which is
         what makes the notch area take the theme's `--bg` rather than a black
         band — `styles/index.css` pays back the safe-area insets. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ferretry" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- THE BRAND MARK. Fleet Grid, from `docs/brand/fleet-grid/`. Every file
         here is a committed static asset under `public/`, copied verbatim into
         the bundle, so all four references are same-origin — which they have to
         be: the deployment sends `default-src 'self'` and an external icon host
         would simply not load.

         `favicon.svg` FIRST and unsized, because a browser that understands it
         should prefer it: it is the only one of these that follows the reader's
         colour scheme, which a favicon needs and cannot get from the page (see
         the file's own comment). The 32px PNG is the fallback for browsers with
         no SVG favicon support, and is a self-contained dark tile for the same
         reason — a PNG cannot switch ink.

         `apple-touch-icon` is a separate link rather than a manifest entry
         because iOS does not read the manifest for Add-to-Home-Screen; like the
         `apple-mobile-web-app-*` metas above, it is snapshotted at add time. -->
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- ONE STATIC MANIFEST, carrying the id `useTheme` looks up.

         kteam generated 14 (seven families × light/dark) from its release
         orchestrator, and that orchestrator is still unported (HANDOFF.md §14).
         `useTheme` was already written for both worlds: it repoints this link by
         id, and `manifestHrefFor` returns a href unchanged unless it matches the
         generated `manifest-<family>-<mode>.` shape. `/manifest.webmanifest` does
         not match, so the effect is a no-op rather than a 404 — asserted in
         `tests/unit/app-icons.test.ts` for every family and mode, so the day the
         generator lands the swap starts working without touching this line's id.

         The manifest declares NO `theme_color`, for the reason given below: a
         static one would be wrong for six of the seven families, and `useTheme`
         mints the meta from the resolved theme's own `--bg`. It does declare
         `background_color`, which is not a theme claim — it is the field colour
         the maskable icon already paints, and the launch splash sits directly
         behind that icon. -->
    <link id="fy-manifest" rel="manifest" href="/manifest.webmanifest" />
    <!-- STILL NOT LINKED HERE, and the absence is deliberate rather than
         forgotten: a service-worker registration. No worker is built yet, so
         there is nothing to register — and no `theme-color` meta either, because
         `useTheme` creates that one on demand from the resolved theme's own
         `--bg` and a static value would be wrong for six of the seven
         families. -->
    <!-- Pre-paint theme + text-scale bootstrap. Classic and same-origin ON
         PURPOSE: it must run before first paint (so `defer`/`type="module"` are
         both wrong), and the pending Cloudflare Pages deployment (not yet in
         this repo; a separate unit owns it) is meant to send `script-src
         'self'` — an inline script, which is what kteam used, would be blocked
         outright under that policy. See `public/pre-paint.js` for the contract
         it restates. -->
    <script src="/pre-paint.js"></script>
  </head>
  <body>
    <!-- The one mount point. `src/main.tsx` throws if it is missing rather than
         rendering into a document it does not recognise. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
