<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `interactive-widget=resizes-content`: Android's software keyboard must
         RESIZE the layout viewport rather than pan over it, so the composer stays
         inside the shell. iOS ignores this and pans instead — that half is
         handled by sizing the shell from `window.visualViewport`
         (`src/hooks/use-app-viewport.ts`).
         `viewport-fit=cover` lets the app paint into the notch / home-indicator
         area; `src/styles/index.css` pays the safe-area insets back where they
         matter.
         NO `maximum-scale` / `user-scalable=no`: pinch-zoom must keep working
         (WCAG 1.4.4). iOS focus-zoom is prevented the correct way instead — by
         never rendering a text field below 16px on a phone. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Both modes are real here, and every one of the seven families ships a
         light and a dark token set, so the UA is told to expect either rather
         than being handed a single scheme it would then have to fight. -->
    <meta name="color-scheme" content="light dark" />
    <title>Ferretry</title>
    <!-- iOS ignores the web manifest for Add-to-Home-Screen and reads these
         instead. Everything here is SNAPSHOTTED AT ADD TIME and effectively
         frozen: a later release cannot change the installed title.
         `black-translucent` lets the app paint under the status bar, which is
         what makes the notch area take the theme's `--bg` rather than a black
         band — `styles/index.css` pays back the safe-area insets. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ferretry" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- NOT LINKED HERE YET, and each absence is deliberate rather than
         forgotten:
           * `rel="icon"` / `apple-touch-icon` — the icon generator
             (kteam `scripts/gen-icons.ts`) is not ported, so there is no
             fingerprinted icon to point at. A link to a file the bundle does not
             contain would 404 on every load.
           * `rel="manifest"` — the 14 themed manifests are generated by the
             unported release orchestrator (HANDOFF.md §14). `useTheme` repoints
             the ONE manifest link by id (`fy-manifest`) and tolerates its
             absence, so the app is correct without it; add the link, with that
             id, in the same change that starts generating them.
           * a service-worker registration — no worker is built yet, so there is
             nothing to register and no `theme-color` meta either: `useTheme`
             creates that one on demand from the resolved theme's own `--bg`,
             because a static value would be wrong for six of the seven
             families. -->
    <!-- Pre-paint theme + text-scale bootstrap. Classic and same-origin ON
         PURPOSE: it must run before first paint (so `defer`/`type="module"` are
         both wrong), and the Pages deployment sends `script-src 'self'` — an
         inline script, which is what kteam used, would be blocked outright.
         See `public/pre-paint.js` for the contract it restates. -->
    <script src="/pre-paint.js"></script>
  </head>
  <body>
    <!-- The one mount point. `src/main.tsx` throws if it is missing rather than
         rendering into a document it does not recognise. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
