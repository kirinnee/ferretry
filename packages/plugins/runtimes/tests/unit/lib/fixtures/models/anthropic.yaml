# Anthropic's own Claude models, for a Claude account sign-in and an Anthropic API key.
# How to change this list: docs/model-catalog.md. A machine overrides it with config/models/anthropic.yaml.
label: Anthropic
docs: https://platform.claude.com/docs/en/about-claude/models/overview
verified: '2026-10-18'
unverified:
  - 'Haiku 5.5 costs five times as much for a request whose prompt is over 100,000 tokens; analytics prices whole sessions, so its price is the lower one and a long-prompt session is under-counted.'
claude:
  docs: https://code.claude.com/docs/en/model-config
  tiers:
    opus: claude-opus-5-5
    sonnet: claude-sonnet-5-5
    haiku: claude-haiku-5-5
  models:
    - id: claude-opus-5-5
      price:
        provider: anthropic
        input: 4
        output: 20
        cacheRead: 0.2
        cacheWrite5m: 5
        cacheWrite1h: 8
        source: https://platform.claude.com/docs/en/about-claude/pricing
        verified: '2026-10-20'
      label: Opus 5.5
      tier: best
      context: 1000000
      efforts: [low, medium, high, xhigh, max]
      defaultEffort: medium
      default: true
    - id: claude-sonnet-5-5
      price:
        provider: anthropic
        input: 2
        output: 10
        cacheRead: 0.1
        cacheWrite5m: 2.5
        cacheWrite1h: 4
        source: https://platform.claude.com/docs/en/about-claude/pricing
        verified: '2026-10-20'
      label: Sonnet 5.5
      tier: balanced
      context: 1000000
      efforts: [low, medium, high, xhigh, max]
      defaultEffort: high
    - id: claude-haiku-5-5
      price:
        provider: anthropic
        input: 0.1
        output: 0.5
        cacheRead: 0.01
        cacheWrite5m: 0.125
        cacheWrite1h: 0.2
        source: https://platform.claude.com/docs/en/about-claude/pricing
        verified: '2026-10-20'
      label: Haiku 5.5
      tier: fast
      context: 1000000
      efforts: [low, medium, high, xhigh, max]
      defaultEffort: medium
