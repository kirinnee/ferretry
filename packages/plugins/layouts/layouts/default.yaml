    [
      ferret-agenda,
      queue,
      cards-of-ferret,
      terminals,
      console,
      processes,
      browser,
      files,
      ferret-warden,
      mcp-servers,
      helpers,
      skills,
      instructions,
      usage,
      insights,
    ]
density: comfortable
