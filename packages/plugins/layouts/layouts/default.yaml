# The built-in default layout (design §5.3). With Layouts off, the app shell uses its own copy of this one.
id: default
nav: { side: left, style: list, items: [ferrets, agenda, board, projects, insights, settings] }
side: { show: wide-only, holds: ferrets }
top: [daemon-picker, search]
composer.tools: [attachments, dictation, runtime-picker, composer-quota]
panels:
  ferret.side:
    [
      ferret-agenda,
      queue,
      cards-of-ferret,
      terminals,
      console,
      processes,
      browser,
      files,
      ferret-warden,
      mcp-servers,
      helpers,
      skills,
      instructions,
      usage,
      insights,
    ]
density: comfortable
phone: { nav: { side: bottom, items: [ferrets, agenda, board] } }
