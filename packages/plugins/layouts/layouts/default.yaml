# The built-in default layout (design §5.3). With Layouts off, the app shell uses its own copy of this one.
id: default
nav:
  side: left
  style: dock
  labels: icons
  items: [ferrets, conversation.links, agenda, board, projects, insights, settings]
side: { show: wide-only, holds: ferrets, at: left }
top: [daemon-picker, search]
