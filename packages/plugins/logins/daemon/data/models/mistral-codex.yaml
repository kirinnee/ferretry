# Mistral AI models for Codex (Mistral's Responses API, https://api.mistral.ai/v1). The OpenCode list is mistral.yaml.
label: Mistral (Codex)
docs: https://docs.mistral.ai/studio/conversations/responses
verified: '2026-11-27'
unverified:
  - "Mistral's Responses API is stateless, so Codex features that resume a response on the server do not work."
  - "Mistral does not rank its models for coding, so the tiers follow size; a person's own file can re-rank them."
  - 'The `-latest` aliases and context sizes are the ones mistral.yaml carries (models.dev, 2026-11-23); no Codex run against Mistral was made.'
customIds: true
codex:
  models:
    - id: mistral-large-latest
      label: Mistral Large (latest)
      tier: best
      context: 1048576
      reasoning: true
    - id: mistral-medium-latest
      label: Mistral Medium (latest)
      tier: balanced
      context: 262144
      reasoning: true
      default: true
    - id: mistral-small-latest
      label: Mistral Small (latest)
      tier: fast
      context: 262144
      reasoning: true
