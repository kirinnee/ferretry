# Codex on Groq (its Responses endpoint). Groq has no Anthropic-compatible endpoint, so Claude Code is not offered.
label: Groq
harness: codex
summary: Codex on models Groq serves, with one Groq API key, through Groq's Responses API.
docs: https://console.groq.com/docs/responses-api
verified: '2026-11-27'
unverified:
  - "Groq's Responses API is marked beta, and its API reference says previous_response_id is not supported, so Codex features that resume a response on the server may not work."
  - 'The default model is the open-weight gpt-oss model Groq lists; no Codex run against Groq was made when this preset was written.'
catalog: groq
env:
  GROQ_API_KEY:
    secretName: GROQ_API_KEY
codexProvider:
  id: groq
  name: Groq
  baseUrl: https://api.groq.com/openai/v1
  keyVariable: GROQ_API_KEY
  model: openai/gpt-oss-120b
test:
  kind: request
  url: https://api.groq.com/openai/v1/models
  keyVariable: GROQ_API_KEY
  note: Lists the models the key can use. Spends nothing.
quota:
  source: transcript-pricing
  note: Groq reports no balance to an API key, so cost is counted from the transcript where the model has a price.
detect:
  hosts: [api.groq.com]
  variables: [GROQ_*]
  keyPrefixes: [gsk_]
