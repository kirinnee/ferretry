[test]
root = "packages"
pathIgnorePatterns = ["**/tests/unit/**", "**/tests/sit/**"]
# This is a global multi-file hook, not a per-file teardown. The shared Chromium
# support closes its one process only after every integration file has completed;
# putting the hook in an importing test file would close a sibling's browser.
preload = ["./packages/pwa/tests/integration/support/chromium.ts"]
# THE PER-TEST TIMEOUT IS NOT SET HERE, and it is not an omission.
#
# `timeout` under `[test]` is IGNORED by Bun 1.3.13: this file used to carry
# `timeout = 120000` and every test in this tier still ran on Bun's 5-second
# default. A tier that believes it has two minutes and has five seconds is a tier
# whose slowest honest test fails as a timeout rather than as an assertion — which
# is exactly what happened to the daemon boot tests, whose readiness poll budgets
# 5000ms against a 5000ms ceiling and therefore had no headroom at all.
#
# So the real budget travels on the command line, as `--timeout`, from the two
# places this tier is invoked: `tasks/Taskfile.test.yaml` and `scripts/ci/test.sh`.
# Do not restore the key here — a value that is read by nothing is worse than no
# value, because the next reader believes it.
coverageReporter = ["text", "lcov"]
coverageDir = "coverage/int"
coverageSkipTestFiles = true
# Int ledger = the adapters tier only; the domain is the unit ledger, the glue is not an adapter, tests/** never counts.
#
# The PWA's browser glue (components, features, hooks, shell) deliberately lives outside src/lib but
# is claimed by the UNIT ledger at 100% — scripts/ci/test.sh names those four directories explicitly.
# A browser integration test that renders one of those components would otherwise drag it into the
# adapters ledger, where it is neither expected nor measurable. Excluding them here is the same
# classification the src/lib line above makes, not a relaxation: every one of these files is already
# proved to 100% by `task test:gate`.
coveragePathIgnorePatterns = [
  "packages/*/bin/**",
  "packages/*/src/lib/**",
  "packages/*/tests/**",
  "packages/pwa/src/features/**",
  "packages/pwa/src/hooks/**",
  "packages/pwa/src/shell/**",
  # BUILD-TIME GENERATORS, not adapters. `scripts/build-fy-render-libs.ts` emits the `fy-render`
  # sandbox shell and its two pinned library bundles; the Chromium security tier imports it so that
  # it measures a FRESHLY BUILT shell rather than whatever artifact happened to be on disk, which is
  # the difference between testing the design and testing a stale file.
  #
  # Without this line the int ledger records a `packages/pwa/scripts/…` path, `scripts/ci/test.sh`'s
  # awk gate refuses it as "coverage path outside src/adapters", and the tier fails on a PATH rather
  # than on a test — which looks like nothing to do with the file that caused it.
  "packages/pwa/scripts/**",
]
