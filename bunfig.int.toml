[test]
root = "packages"
pathIgnorePatterns = ["**/tests/unit/**", "**/tests/sit/**", "**/tests/realworld/**"]
# THE PER-TEST TIMEOUT IS NOT SET HERE, and it is not an omission.
#
# `timeout` under `[test]` is IGNORED by Bun 1.3.13: a tier that believes it has two minutes and has five
# seconds is a tier whose slowest honest test fails as a timeout rather than as an assertion. So the real
# budget travels on the command line, as `--timeout`, from the two places this tier is invoked:
# `Taskfile.yaml` (the `int` include) and `scripts/ci/test.sh`. Do not restore the key here — a value that
# is read by nothing is worse than no value, because the next reader believes it.
coverageReporter = ["text", "lcov"]
coverageDir = "coverage/int"
coverageSkipTestFiles = true
# Int ledger = the adapters tier only: every `adapters/` directory of a workspace package, at any depth
# (scripts/ci/coverage-ledger.sh judges only those). tests/** never counts.
coveragePathIgnorePatterns = [
  "packages/**/tests/**",
  "scripts/**",
]
