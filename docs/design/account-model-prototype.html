<title>Ferretry Runtimes Prototype</title>
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&family=JetBrains+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --bg: #fbfbfc;
    --surface: #ffffff;
    --surface-2: #f5f5f7;
    --surface-3: #ededf1;
    --fg: #17171b;
    --fg-soft: #45454e;
    --fg-muted: #6e6e77;
    --border: #e7e7ec;
    --border-strong: #868689;
    --accent: #4f52d6;
    --accent-fg: #ffffff;
    --accent-soft: #eeeffc;
    --accent-border: #d6d8f5;
    --ok: #3d7b50;
    --ok-bg: #eef4f0;
    --ok-border: #cfe2d6;
    --warn: #8a6420;
    --warn-bg: #f7f1e6;
    --warn-border: #e7dac0;
    --danger: #b03a3a;
    --danger-bg: #f9eded;
    --danger-border: #ecd0d0;
    --shadow: 0 1px 2px rgba(23, 23, 27, 0.05), 0 18px 40px -18px rgba(23, 23, 27, 0.22);
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --bg: #0b0b0d;
      --surface: #141417;
      --surface-2: #1a1a1e;
      --surface-3: #232329;
      --fg: #f2f2f4;
      --fg-soft: #c9c9d1;
      --fg-muted: #8e8e98;
      --border: #2a2a30;
      --border-strong: #5a5a63;
      --accent: #8f93ee;
      --accent-fg: #0b0b0e;
      --accent-soft: #1b1b2b;
      --accent-border: #34345c;
      --ok: #6fae82;
      --ok-bg: #14241a;
      --ok-border: #234630;
      --warn: #d6a85a;
      --warn-bg: #2a2114;
      --warn-border: #4a3a1e;
      --danger: #e07c7c;
      --danger-bg: #2a1515;
      --danger-border: #4d2626;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 18px 40px -18px rgba(0, 0, 0, 0.7);
      color-scheme: dark;
    }
  }
  :root[data-theme='dark'] {
    --bg: #0b0b0d;
    --surface: #141417;
    --surface-2: #1a1a1e;
    --surface-3: #232329;
    --fg: #f2f2f4;
    --fg-soft: #c9c9d1;
    --fg-muted: #8e8e98;
    --border: #2a2a30;
    --border-strong: #5a5a63;
    --accent: #8f93ee;
    --accent-fg: #0b0b0e;
    --accent-soft: #1b1b2b;
    --accent-border: #34345c;
    --ok: #6fae82;
    --ok-bg: #14241a;
    --ok-border: #234630;
    --warn: #d6a85a;
    --warn-bg: #2a2114;
    --warn-border: #4a3a1e;
    --danger: #e07c7c;
    --danger-bg: #2a1515;
    --danger-border: #4d2626;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 18px 40px -18px rgba(0, 0, 0, 0.7);
    color-scheme: dark;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 400 12.5px/1.5 var(--sans);
    padding-inline: 16px;
    padding-block: 28px 56px;
    -webkit-font-smoothing: antialiased;
  }
  button,
  input,
  select,
  textarea {
    font: inherit;
    color: inherit;
  }
  button {
    cursor: pointer;
  }
  button:disabled {
    cursor: not-allowed;
  }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }
  .mono {
    font-family: var(--mono);
    font-size: 0.94em;
    letter-spacing: -0.01em;
  }
  .lbl {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--fg-muted);
  }
  .muted {
    color: var(--fg-muted);
  }
  .soft {
    color: var(--fg-soft);
  }
  .num {
    font-variant-numeric: tabular-nums;
  }

  /* ---------- page layout ---------- */
  .wrap {
    max-width: 1160px;
    margin-inline: auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 392px;
    gap: 48px;
    align-items: start;
  }
  .cat {
    order: 1;
    min-width: 0;
  }
  .stage {
    order: 2;
    position: sticky;
    top: max(16px, env(safe-area-inset-top, 0px));
  }
  @media (max-width: 900px) {
    .wrap {
      grid-template-columns: minmax(0, 1fr);
      gap: 32px;
    }
    .stage {
      order: 1;
      position: static;
    }
    .cat {
      order: 2;
    }
    .phone {
      width: 100%;
    }
  }

  /* ---------- catalogue ---------- */
  .cat h1 {
    font-size: 18px;
    font-weight: 650;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
    text-wrap: balance;
  }
  .cat .lede {
    font-size: 13.5px;
    color: var(--fg-soft);
    margin: 0 0 4px;
    max-width: 60ch;
  }
  .cat .sample {
    color: var(--fg-muted);
    margin: 0 0 14px;
    max-width: 60ch;
  }
  .cat-tools {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    align-items: center;
    margin-bottom: 12px;
  }
  .seg {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    background: var(--surface);
  }
  .seg button {
    border: 0;
    background: transparent;
    padding: 5px 10px;
    font-size: 12px;
    color: var(--fg-soft);
  }
  .seg button + button {
    border-left: 1px solid var(--border);
  }
  .seg button[aria-pressed='true'] {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    color: var(--fg-soft);
    margin: 0 0 22px;
    padding: 0;
    list-style: none;
  }
  .legend li {
    display: inline-flex;
    gap: 5px;
    align-items: center;
  }
  .cat-group {
    margin-bottom: 20px;
  }
  .cat-group h2 {
    margin: 0 0 6px;
  }
  .cases {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    overflow: hidden;
  }
  .case {
    display: grid;
    grid-template-columns: 38px minmax(0, 1fr) auto;
    gap: 10px;
    align-items: center;
    padding: 7px 8px 7px 12px;
    border-top: 1px solid var(--border);
  }
  .case:first-child {
    border-top: 0;
  }
  .case .cid {
    color: var(--fg-muted);
    font-size: 11.5px;
  }
  .case .ct {
    color: var(--fg-soft);
    min-width: 0;
  }
  .case .cbtns {
    display: flex;
    gap: 6px;
  }
  .case.on {
    background: var(--accent-soft);
  }
  .case.on .cid,
  .case.on .ct {
    color: var(--fg);
  }
  .case.on .cid {
    color: var(--accent);
    font-weight: 500;
  }

  /* ---------- phone ---------- */
  .now {
    display: flex;
    gap: 8px;
    align-items: baseline;
    margin: 0 0 8px;
    min-height: 18px;
    color: var(--fg-muted);
  }
  .now b {
    color: var(--accent);
    font-weight: 600;
  }
  .phone {
    width: 392px;
    max-width: 100%;
    height: min(780px, calc(100vh - 64px));
    min-height: 560px;
    background: var(--bg);
    border: 1px solid var(--border-strong);
    border-radius: 26px;
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .p-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 14px 8px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .msw {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    border-radius: 6px;
    padding: 4px 9px;
    font-family: var(--mono);
    font-size: 12px;
  }
  .msw.static {
    background: transparent;
    border-color: transparent;
    padding-inline: 0;
  }
  .msw .caret {
    color: var(--fg-muted);
    font-family: var(--sans);
  }
  .p-top .where {
    color: var(--fg-muted);
    font-size: 11.5px;
  }
  .p-head {
    padding: 12px 16px 10px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .p-head .hrow {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 22px;
  }
  .back {
    border: 0;
    background: transparent;
    color: var(--accent);
    padding: 2px 4px 2px 0;
    font-weight: 500;
    font-size: 12.5px;
    display: inline-flex;
    gap: 3px;
    align-items: center;
  }
  .back:disabled {
    color: var(--fg-muted);
    opacity: 0.5;
  }
  .p-title {
    font-size: 18px;
    font-weight: 650;
    letter-spacing: -0.01em;
    margin: 4px 0 0;
    line-height: 1.25;
    text-wrap: balance;
    overflow-wrap: anywhere;
  }
  .p-title:focus {
    outline: none;
  }
  .p-sub {
    color: var(--fg-muted);
    margin: 2px 0 0;
  }
  .p-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 14px 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overscroll-behavior: contain;
  }
  .p-foot {
    padding: 10px 16px 14px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .tabs {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 4px 4px calc(8px + env(safe-area-inset-bottom, 0px));
  }
  .tab {
    border: 0;
    background: transparent;
    padding: 6px 2px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: var(--fg-muted);
    font-size: 10.5px;
    border-radius: 6px;
  }
  .tab svg {
    width: 18px;
    height: 18px;
  }
  .tab[aria-current='page'] {
    color: var(--accent);
    font-weight: 600;
  }
  .toast {
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: 72px;
    background: var(--fg);
    color: var(--bg);
    border-radius: 6px;
    padding: 9px 12px;
    font-size: 12.5px;
    box-shadow: var(--shadow);
    z-index: 3;
  }
  .toast.raised {
    bottom: 96px;
  }

  /* stepper header */
  .sh {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .sh-step {
    color: var(--fg-muted);
    font-size: 11.5px;
    text-align: center;
    flex: 1;
  }
  .sh-x {
    border: 0;
    background: transparent;
    color: var(--fg-soft);
    padding: 2px 0 2px 4px;
  }
  .prog {
    display: flex;
    gap: 4px;
    margin-top: 10px;
  }
  .prog span {
    flex: 1;
    height: 3px;
    border-radius: 2px;
    background: var(--surface-3);
  }
  .prog span.done {
    background: var(--accent-border);
  }
  .prog span.cur {
    background: var(--accent);
  }

  /* ---------- building blocks ---------- */
  .sec {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sec-h {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  h2.h {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.005em;
    text-wrap: balance;
  }
  p {
    margin: 0;
  }
  .p {
    color: var(--fg-soft);
    max-width: 60ch;
  }
  .list {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    overflow: hidden;
  }
  .list > * + * {
    border-top: 1px solid var(--border);
  }
  .row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 0;
    padding: 10px 12px;
    color: var(--fg);
  }
  button.row:hover {
    background: var(--surface-2);
  }
  .row .main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .row .t {
    font-size: 13.5px;
    font-weight: 500;
    overflow-wrap: anywhere;
  }
  .row .s {
    color: var(--fg-muted);
    overflow-wrap: anywhere;
  }
  .row .chev {
    color: var(--fg-muted);
    align-self: center;
    font-size: 16px;
  }
  .row .k {
    width: 92px;
    flex: none;
    color: var(--fg-muted);
  }
  .item-note {
    padding: 7px 12px 9px 34px;
    background: var(--warn-bg);
    color: var(--warn);
    display: flex;
    flex-wrap: wrap;
    gap: 4px 8px;
    align-items: center;
  }
  .addrow {
    color: var(--accent);
    font-weight: 500;
  }
  .addrow .plus {
    width: 18px;
    text-align: center;
    font-size: 15px;
    line-height: 1.2;
  }
  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 2px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--fg-soft);
    border-radius: 4px;
    padding: 0 6px;
    font-size: 11px;
    line-height: 18px;
    white-space: nowrap;
  }
  .badge.ok {
    background: var(--ok-bg);
    border-color: var(--ok-border);
    color: var(--ok);
  }
  .badge.warn {
    background: var(--warn-bg);
    border-color: var(--warn-border);
    color: var(--warn);
    white-space: normal;
  }
  .badge.danger {
    background: var(--danger-bg);
    border-color: var(--danger-border);
    color: var(--danger);
  }
  .badge.accent {
    background: var(--accent-soft);
    border-color: var(--accent-border);
    color: var(--accent);
  }
  .ic {
    width: 11px;
    height: 11px;
    flex: none;
    vertical-align: -1px;
  }
  .st {
    display: inline-block;
    width: 14px;
    text-align: center;
    flex: none;
    font-size: 13px;
    line-height: 1.35;
  }
  .st-ok {
    color: var(--ok);
  }
  .st-warn {
    color: var(--warn);
  }
  .st-danger {
    color: var(--danger);
  }
  .st-muted {
    color: var(--fg-muted);
  }
  .stl {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-weight: 500;
  }
  .spin {
    display: inline-block;
    animation: spin 1.4s linear infinite;
  }
  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  .note {
    border: 1px solid var(--border);
    background: var(--surface-2);
    border-radius: 6px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    color: var(--fg-soft);
  }
  .note b {
    color: var(--fg);
    font-weight: 600;
  }
  .note.ok {
    background: var(--ok-bg);
    border-color: var(--ok-border);
  }
  .note.ok b {
    color: var(--ok);
  }
  .note.warn {
    background: var(--warn-bg);
    border-color: var(--warn-border);
  }
  .note.warn b {
    color: var(--warn);
  }
  .note.danger {
    background: var(--danger-bg);
    border-color: var(--danger-border);
  }
  .note.danger b {
    color: var(--danger);
  }
  .note.info {
    background: var(--accent-soft);
    border-color: var(--accent-border);
  }
  .note .acts {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 2px;
  }

  .btn {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    border-radius: 6px;
    padding: 8px 14px;
    font-weight: 500;
    font-size: 13px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--fg);
    text-align: center;
  }
  .btn:hover:not(:disabled) {
    background: var(--surface-2);
  }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-fg);
  }
  .btn.primary:hover:not(:disabled) {
    background: var(--accent);
    filter: brightness(1.07);
  }
  .btn.danger {
    background: var(--danger);
    border-color: var(--danger);
    color: var(--surface);
  }
  .btn.danger:hover:not(:disabled) {
    background: var(--danger);
    filter: brightness(1.07);
  }
  .btn.quiet {
    border-color: var(--border);
  }
  .btn:disabled {
    opacity: 0.45;
  }
  .btn.sm {
    padding: 3px 10px;
    font-size: 12px;
  }
  .btn.block {
    width: 100%;
  }
  .link {
    border: 0;
    background: transparent;
    padding: 0;
    color: var(--accent);
    font-weight: 500;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .btns {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .btns .btn {
    flex: 1 1 auto;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .field label {
    font-weight: 500;
    color: var(--fg-soft);
  }
  .inp {
    width: 100%;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    background: var(--surface);
    padding: 8px 10px;
    font-size: 13.5px;
  }
  .inp.mono {
    font-family: var(--mono);
    font-size: 13px;
  }
  textarea.inp {
    min-height: 110px;
    resize: vertical;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.5;
  }
  .inp[aria-invalid='true'] {
    border-color: var(--danger);
  }
  .err {
    color: var(--danger);
    display: flex;
    flex-wrap: wrap;
    gap: 4px 8px;
    align-items: center;
  }
  .hint {
    color: var(--fg-muted);
  }

  .opt {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 10px 12px;
    cursor: pointer;
    background: var(--surface);
  }
  .opt input {
    margin: 2px 0 0;
    accent-color: var(--accent);
    width: 15px;
    height: 15px;
    flex: none;
  }
  .opt.on {
    background: var(--accent-soft);
  }
  .opt.off {
    cursor: not-allowed;
  }
  .opt.off .t,
  .opt.off .s {
    color: var(--fg-muted);
  }
  .opt-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .opt .t {
    font-size: 13.5px;
    font-weight: 500;
    overflow-wrap: anywhere;
  }
  .opt .s {
    color: var(--fg-muted);
    overflow-wrap: anywhere;
  }
  .opt .why {
    color: var(--fg-soft);
    display: flex;
    gap: 4px;
    align-items: center;
  }

  pre.code {
    margin: 0;
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.55;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 10px;
    overflow-x: auto;
    white-space: pre;
    color: var(--fg);
  }
  pre.code.wrapc {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .usage {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 4px;
  }
  .bar {
    display: grid;
    grid-template-columns: 34px 1fr auto;
    gap: 8px;
    align-items: center;
    font-variant-numeric: tabular-nums;
  }
  .bar-l {
    color: var(--fg-muted);
    font-size: 11px;
  }
  .bar-t {
    height: 5px;
    border-radius: 3px;
    background: var(--surface-3);
    overflow: hidden;
  }
  .bar-t span {
    display: block;
    height: 100%;

  /* =====================================================================
   Model: layering, conflicts, usage
   ===================================================================== */
  function flattenLayers(m, layers, ownName, seen) {
    const out = [];
    for (const l of layers) {
      if (l.p) {
        if (seen.has(l.p)) continue;
        const p = find(m.profiles, l.p);
        if (!p) continue;
        out.push(...flattenLayers(m, p.layers, p.name, new Set([...seen, l.p])));
      } else {
        const c = find(m.comps, l.c);
        if (c) out.push({ c, from: ownName });
      }
    }
    const last = new Map();
    out.forEach((x, i) => last.set(x.c.id, i));
    return out.filter((x, i) => last.get(x.c.id) === i); // a repeated part counts at its newest position
  }
  function flattenProfile(m, pid) {
    const p = find(m.profiles, pid);
    return p ? flattenLayers(m, p.layers, p.name, new Set([pid])) : [];
  }
  const appliesTo = (c, h) => c.harness === 'generic' || c.harness === h;
  const keysOf = c => (c.type === 'modelset' ? { model: c.def } : c.keys || {});
  function conflicts(flat) {
    const by = new Map();
    for (const x of flat)
      for (const [k, v] of Object.entries(keysOf(x.c))) {
        const id = x.c.harness + '|' + k;
        if (!by.has(id)) by.set(id, []);
        by.get(id).push({ k, h: x.c.harness, v, from: x.from, comp: x.c.name });
      }
    const res = [];
    for (const arr of by.values()) {
      if (arr.length < 2) continue;
      const win = arr[arr.length - 1];
      const losers = arr.slice(0, -1).filter(a => a.v !== win.v);
      if (losers.length) res.push({ win, losers });
    }
    return res;
  }
  function srcLabel(a, all) {
    return all.every(b => b.from === a.from) ? a.comp : a.from;
  }
  function conflictsHtml(list) {
    if (!list.length) return '<p class="hint">No conflicts. Nothing in a newer layer replaces an older one.</p>';
    return (
      '<ul class="conf">' +
      list
        .map(({ win, losers }) => {
          const all = [win, ...losers];
          const key = win.k + (win.h !== 'generic' ? ' · ' + HN[win.h] : '');
          return `<li><span class="key">${esc(key)}</span>: <span class="win">${esc(win.v)}</span> (from ${esc(srcLabel(win, all))}) overrides ${losers.map(l => `${esc(l.v)} (from ${esc(srcLabel(l, all))})`).join(', ')}</li>`;
        })
        .join('') +
      '</ul>'
    );
  }
  function effModels(m, r) {
    const c = find(m.creds, r.credId);
    const flat = flattenProfile(m, r.profileId).filter(x => appliesTo(x.c, c.harness));
    const ms = [...flat].reverse().find(x => x.c.type === 'modelset');
    if (!ms) return { set: null, models: [], def: null };
    const avail = MODELS[c.harness];
    const models = ms.c.models.map(n => ({ n, ok: avail.includes(n) }));
    const def = avail.includes(ms.c.def) ? ms.c.def : (models.find(x => x.ok) || {}).n || null;
    return { set: ms.c, from: ms.from, models, def, fellBack: def !== ms.c.def };

  function includesProfile(m, pid, target, seen = new Set()) {
    if (pid === target) return true;
    if (seen.has(pid)) return false;

  function compUse(m, cid) {

    const rts = m.runtimes.filter(r => profs.some(p => p.id === r.profileId));

  function compat(m, pid, h) {
    const flat = flattenProfile(m, pid);

    const mine = flat.filter(x => appliesTo(x.c, h));
    const other = flat.filter(x => !appliesTo(x.c, h));
    const oh = h === 'claude' ? 'codex' : 'claude';
    if (!mine.length) return { ok: false, why: `Only ${HS[oh]} settings. Nothing here applies on ${HN[h]}.` };

  /* =====================================================================
   Import (first run)
   ===================================================================== */
  function getOrMake(m, type, name, harness, props) {
    let c = m.comps.find(x => x.type === type && x.name === name);
    if (!c) {
      c = C(nid('c'), type, name, Object.assign({ harness }, props));
      m.comps.push(c);
    }
    return c;
  }
  function getProfile(m, name) {
    let p = m.profiles.find(x => x.name === name);
    if (!p) {
      p = { id: nid('p'), name, layers: [] };
      m.profiles.push(p);
    }
    return p;
  }
  function doImport(fl, m, h) {
    const f = m.fr;
    const status = f.signed[h] === 'yes' ? 'ready' : f.signed[h] === 'refresh' ? 'refresh' : 'signin';
    let cred = m.creds.find(c => c.harness === h && c.imported);
    if (!cred) {
      cred = {
        id: nid('cr'),
        harness: h,
        email: 'you@example.com',
        label: '',
        status,
        cli: true,
        imported: true,
        usage: h === 'claude' ? [38, '2h 10m', 61, 'Fri'] : [12, '3h 40m', 27, 'Mon'],
      };
      m.creds.push(cred);
    }
    const notes = [];
    let prof,
      what = [];
    if (f.config[h]) {
      prof = getProfile(m, 'Default');
      const add = c => {
        if (!prof.layers.some(l => l.c === c.id)) prof.layers.push({ c: c.id });
      };
      // instructions: one shared copy when the two files match, otherwise one per tool
      const first = m.comps.find(c => c.type === 'instructions' && c.imported);
      if (first && first.importedFrom !== h) {
        if (f.same) {
          first.harness = 'generic';
          first.source = 'CLAUDE.md and AGENTS.md';
          add(first);
          notes.push({
            k: 'ok',
            t: 'Your CLAUDE.md and AGENTS.md match, so both tools share one copy of your instructions.',
          });
        } else {
          first.harness = first.importedFrom;
          first.name = HS[first.importedFrom] + ' instructions';
          const ic = getOrMake(m, 'instructions', HS[h] + ' instructions', h, {
            source: h === 'claude' ? 'CLAUDE.md' : 'AGENTS.md',
            body:
              h === 'codex'
                ? '# Codex\n- Run `make check` before finishing.\n- Explain each change in the final message.'
                : INSTR,
            imported: true,
            importedFrom: h,
          });
          add(ic);
          notes.push({
            k: 'info',
            t: 'Your CLAUDE.md and AGENTS.md are different, so each tool keeps its own instructions.',
          });
        }
      } else if (!first) {
        const ic = getOrMake(m, 'instructions', 'Main instructions', 'generic', {
          source: h === 'claude' ? 'CLAUDE.md' : 'AGENTS.md',
          body: INSTR,
          imported: true,
          importedFrom: h,
        });
        add(ic);
      }
      what.push('your instructions');
      // MCP servers
      const servers =
        h === 'claude'
          ? [
              ['github', 'npx -y @modelcontextprotocol/server-github'],
              ['linear', 'npx -y mcp-remote https://mcp.linear.app/sse'],
              ['notes', 'uvx notes-mcp --vault /Users/you/Notes'],
            ]
          : [
              ['github', 'npx -y @modelcontextprotocol/server-github'],
              ['linear', 'npx -y mcp-remote https://mcp.linear.app/sse'],
            ];
      for (const [n, cmd] of servers) {
        const c = getOrMake(m, 'mcp', n, 'generic', { body: cmd });
        if (n === 'notes' && f.uvx && !c.warn.includes('Command not found: uvx')) c.warn.push('Command not found: uvx');
        add(c);
      }
      // skills
      const sk = getOrMake(m, 'skills', 'My skills', 'generic', {
        items:
          h === 'claude'
            ? ['release-notes', 'pr-review', 'changelog', 'db-migrate', 'incident-summary']
            : ['pr-review', 'changelog'],
      });
      if (h === 'claude') {
        sk.items = Array.from(
          new Set(['release-notes', 'pr-review', 'changelog', 'db-migrate', 'incident-summary', ...sk.items]),
        );
        sk.partial = 'Codex';
        sk.partialWhy = 'release-notes limits which tools it may use. Codex ignores that limit and loads the rest.';
      }
      add(sk);
      // settings (+ hooks on Claude)
      const st = getOrMake(m, 'settings', HS[h] + ' settings', h, {
        keys:
          h === 'claude'
            ? { model: 'opus', 'env.LOG_LEVEL': 'info', statusLine: 'on' }
            : { approval_policy: 'on-request', sandbox_mode: 'workspace-write' },
      });
      if (h === 'claude' && f.secrets) {
        st.secrets = ['ANTHROPIC_API_KEY', 'GITHUB_TOKEN'];
        notes.push({
          k: 'info',
          t: "Your settings had 2 values that look like secrets (ANTHROPIC_API_KEY, GITHUB_TOKEN). They went into Ferretry's secret store and are never shown.",
        });
      }
      add(st);
      if (h === 'claude')
        add(
          getOrMake(m, 'hooks', 'Format on save', 'claude', {
            body: 'PostToolUse  Edit|Write\n  /Users/you/bin/fmt-hook.sh',
          }),
        );
      add(
        getOrMake(
          m,
          'modelset',
          HS[h] + ' models',
          h,
          h === 'claude'
            ? { models: ['Opus 5.5', 'Sonnet 5.5', 'Haiku 5.5'], def: 'Opus 5.5' }
            : { models: ['GPT-6'], def: 'GPT-6' },
        ),
      );
      what.push('settings', plural(servers.length, 'MCP server'), plural(h === 'claude' ? 5 : 2, 'skill'));
      if (h === 'claude' && f.uvx)
        notes.push({
          k: 'warn',
          t:
            'The notes MCP server came in with a warning: Command not found: uvx. Install uv on ' +
            m.name +
            ' to use it.',
        });
    } else {
      prof = getProfile(m, 'Starter');
      const ms = getOrMake(
        m,
        'modelset',
        HS[h] + ' models',
        h,
        h === 'claude'
          ? { models: ['Opus 5.5', 'Sonnet 5.5', 'Haiku 5.5'], def: 'Opus 5.5' }
          : { models: ['GPT-6'], def: 'GPT-6' },
      );
      if (!prof.layers.some(l => l.c === ms.id)) prof.layers.push({ c: ms.id });
      notes.push({
        k: 'info',
        t: 'No instructions, settings, MCP servers or skills were found, so Ferretry made a plain Starter profile. You can add to it later.',
      });
    }
    if (status === 'refresh')
      notes.push({ k: 'warn', t: 'Your sign-in is due for a refresh. Ferretry renews it the first time you launch.' });
    if (status === 'signin')
      notes.push({ k: 'danger', t: 'You are not signed in yet. Sign in from Credentials before you launch.' });
    fl.res[h] = { credId: cred.id, profileId: prof.id, what, notes };
    fl.names[h] = fl.names[h] || uniqName(h + '-' + slug(prof.name), new Set(m.runtimes.map(r => r.name)));
    fl.make[h] = !m.runtimes.some(r => r.credId === cred.id && r.profileId === prof.id);
  }

  /* =====================================================================
   Clone
   ===================================================================== */
  function clonePreview(src, tgt) {
    const comps = src.comps.filter(c => c.type !== 'modelset');
    const sets = src.comps.filter(c => c.type === 'modelset');
    const usedCreds = src.creds.filter(c => src.runtimes.some(r => r.credId === c.id));
    const paths = src.comps.filter(c => /\/(Users|home)\//.test(c.body));
    const missing = ['claude', 'codex'].filter(
      h => !tgt.installed[h] && src.runtimes.some(r => (find(src.creds, r.credId) || {}).harness === h),
    );
    return { comps, sets, usedCreds, paths, missing };
  }
  function doClone(src, tgt, mode) {
    if (mode === 'replace') {
      tgt.comps = [];
      tgt.profiles = [];
      tgt.runtimes = [];
    }
    const cmap = {},
      pmap = {},
      crmap = {};
    const res = { comps: 0, sets: 0, profiles: 0, runtimes: 0, slots: [], paths: [], renamed: 0 };
    for (const c of src.comps) {
      const taken = new Set(tgt.comps.filter(x => x.type === c.type).map(x => x.name));
      const n = Object.assign(JSON.parse(JSON.stringify(c)), {
        id: nid('c'),
        name: uniqName(c.name, taken),
        imported: false,
      });
      if (n.name !== c.name) res.renamed++;
      n.warn = n.warn.filter(w => !w.startsWith('Command not found'));
      if (/\/(Users|home)\//.test(n.body)) {
        n.checkPath = tgt.name;
        res.paths.push(n.name);
      }
      cmap[c.id] = n.id;
      tgt.comps.push(n);
      c.type === 'modelset' ? res.sets++ : res.comps++;
    }
    for (const p of src.profiles) {
      const name = uniqName(p.name, new Set(tgt.profiles.map(x => x.name)));
      if (name !== p.name) res.renamed++;
      pmap[p.id] = nid('p');
      tgt.profiles.push({ id: pmap[p.id], name, layers: [] });
      res.profiles++;
    }
    for (const p of src.profiles)
      find(tgt.profiles, pmap[p.id]).layers = p.layers.map(l => (l.p ? { p: pmap[l.p] } : { c: cmap[l.c] }));
    for (const r of src.runtimes) {
      if (!crmap[r.credId]) {
        const c = find(src.creds, r.credId);
        const slot = {
          id: nid('cr'),
          harness: c.harness,
          email: c.email,
          label: c.label,
          status: 'signin',
          slot: true,
          from: src.name,
          cli: false,
          usage: [5, '4h 51m', 14, 'Sun'],
        };
        tgt.creds.push(slot);
        crmap[r.credId] = slot.id;
        res.slots.push(slot.id);
      }
      const name = uniqName(r.name, new Set(tgt.runtimes.map(x => x.name)));
      if (name !== r.name) res.renamed++;
      tgt.runtimes.push({ id: nid('r'), name, credId: crmap[r.credId], profileId: pmap[r.profileId], agent: r.agent });
      res.runtimes++;
    }
    tgt.setup = true;
    return res;
  }

  /* =====================================================================

  const stG = s =>
    `<span class="st st-${ST[s][1]}" aria-hidden="true">${s === 'checking' ? '<span class="spin">◌</span>' : ST[s][0]}</span>`;
  const stL = s => `<span class="stl st-${ST[s][1]}">${stG(s)}${ST[s][2]}</span>`;
  const badge = (t, k) => `<span class="badge ${k || ''}">${t}</span>`;
  function harnessBadge(c) {
    if (c.harness === 'generic') return badge('Claude Code and Codex');
    return badge(HN[c.harness] + ' only', 'accent');
  }
  function compBadges(c, m) {
    const b = [harnessBadge(c)];
    if (c.partial) b.push(badge('Partly supported on ' + c.partial, 'warn'));
    for (const w of c.warn) b.push(badge(WARN + esc(w), 'warn'));
    if (c.checkPath && c.checkPath === m.name) b.push(badge(WARN + 'Check this path on ' + esc(m.name), 'warn'));
    if (c.secrets && c.secrets.length) b.push(badge(LOCK + plural(c.secrets.length, 'secret') + ' stored'));
    return `<span class="badges">${b.join('')}</span>`;
  }
  function usageHtml(c) {
    if (c.status !== 'ready' || !c.usage) return '';
    const [h, hr, w, wr] = c.usage;
    const bar = (l, p, r) =>

    return `<div class="usage">${bar('5h', h, hr)}${bar('Week', w, wr)}</div>`;

  }

  }
  function opt({ type = 'radio', name, id, checked, disabled, title, sub, extra = '', data = '' }) {
    return `<label class="opt${checked ? ' on' : ''}${disabled ? ' off' : ''}" for="${id}"><input type="${type}" name="${name}" id="${id}"${checked ? ' checked' : ''}${disabled ? ' disabled' : ''} ${data}><span class="opt-main"><span class="t">${title}</span>${sub ? `<span class="s">${sub}</span>` : ''}${extra}</span></label>`;
  }
  const btn = (label, a, attrs = '', cls = '') =>
    `<button type="button" class="btn ${cls}" data-a="${a}" ${attrs}>${label}</button>`;
  const chev = '<span class="chev" aria-hidden="true">›</span>';
  function credRowInner(m, c, opts = {}) {

  }
  function stackHtml(m, layers, opts = {}) {
    // layers listed oldest to newest; shown newest on top
    if (!layers.length) return '<p class="hint">No layers yet.</p>';
    const rows = layers
      .map((l, i) => {
        if (l.p) {

          return `<div class="layer"><span class="n">${i + 1}</span><span><span class="t">Profile · ${esc(p ? p.name : '?')}</span><br><span class="s">${plural(n, 'part')}, used as a base</span></span></div>`;
        }

          .map(
