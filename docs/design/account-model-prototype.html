    if (res === 'skipped')
      return {
        body: `<div class="note"><span>Skipped ${HN[h]}. You can import it later from Settings.</span><div class="acts">${btn('Import ' + HN[h] + ' instead', 'fr-unskip', `data-h="${h}"`, 'sm')}</div></div>`,
        foot: btn('Continue', 'fnext', 'id="step-next"', 'primary block'),
      };
    if (res) {
      const c = find(m.creds, res.credId),
        pr = find(m.profiles, res.profileId);
      const notes = res.notes
        .map(n =>
          note(
            n.k,
            `<span>${esc(n.t)}</span>`,
            '',
            n.t.includes('uvx')
              ? ' data-spot="mcp"'
              : n.t.includes('secret')
                ? ' data-spot="settings"'
                : n.t.includes('instructions')
                  ? ' data-spot="instr"'
                  : '',
          ),
        )
        .join('');
      return {
        body:
          note('ok', `<b>Imported from ${HN[h]}</b>`) +
          `<div class="list">
        <div class="row">${stG(c.status)}<span class="main"><span class="t">Login · <span class="mono">${esc(c.email)}</span></span><span class="s">${ST[c.status][2]}</span></span></div>
        <div class="row"><span class="st" aria-hidden="true"></span><span class="main"><span class="t">${esc(pr.name)} profile</span><span class="s">${res.what.length ? 'Now has ' + listWords(res.what) + '.' : 'A plain starting point with a model set.'}</span></span></div>
      </div>${notes}`,
        foot: btn('Continue', 'fnext', 'id="step-next"', 'primary block'),
      };
    }
    const f = m.fr;
    const signed = f.signed[h];
    const file = h === 'claude' ? 'CLAUDE.md' : 'AGENTS.md';
    const rows = [];
    rows.push(
      `<div class="row"><span class="k">Account</span><span class="main">${signed === 'yes' ? `<span class="stl st-ok">${stG('ready')}Signed in</span><span class="s mono">${'you@example.com'}</span>` : signed === 'refresh' ? `<span class="stl st-warn">${stG('refresh')}Signed in · refresh due</span><span class="s"><span class="mono">you@example.com</span> · it renews on first use</span>` : `<span class="stl st-danger">${stG('signin')}Not signed in</span><span class="s">Your setup can still be imported.</span>`}</span></div>`,
    );
    if (f.config[h]) {
      const otherDone = fl.res[oh] && fl.res[oh] !== 'skipped' && m.fr.config[oh];
      rows.push(
        `<div class="row" data-spot="instr"><span class="k">Instructions</span><span class="main"><span class="t mono">${file}</span><span class="s">${h === 'claude' ? '2.1 KB' : f.same ? '2.1 KB' : '1.4 KB'}</span>${otherDone ? (f.same ? `<span class="badges">${badge('Same as your CLAUDE.md · one shared copy', 'ok')}</span>` : `<span class="badges">${badge('Different from your CLAUDE.md · kept separately', 'accent')}</span>`) : ''}</span></div>`,
      );
      rows.push(
        `<div class="row" data-spot="settings"><span class="k">Settings</span><span class="main"><span class="t mono">${h === 'claude' ? 'settings.json' : 'config.toml'}</span><span class="s">${h === 'claude' ? '6 settings, 1 hook' : '4 settings'}</span>${h === 'claude' && f.secrets ? `<span class="badges">${badge(LOCK + '2 secret values · go to the secret store, never shown', 'warn')}</span>` : ''}</span></div>`,
      );
      rows.push(
        `<div class="row" data-spot="mcp"><span class="k">MCP servers</span><span class="main"><span class="t">${h === 'claude' ? '3' : '2'}</span><span class="s mono">${h === 'claude' ? 'github, linear, notes' : 'github, linear'}</span>${h === 'claude' && f.uvx ? `<span class="badges">${badge(WARN + 'notes · Command not found: uvx', 'warn')}</span>` : ''}</span></div>`,
      );
      rows.push(
        `<div class="row"><span class="k">Skills</span><span class="main"><span class="t">${h === 'claude' ? '5' : '2'}</span><span class="s mono">${h === 'claude' ? 'release-notes, pr-review, changelog, db-migrate, incident-summary' : 'pr-review, changelog'}</span></span></div>`,
      );
    } else {
      rows.push(
        `<div class="row"><span class="k">Setup</span><span class="main"><span class="t">Nothing found</span><span class="s">No ${file}, settings, MCP servers or skills. Ferretry will make a plain Starter profile you can add to later.</span></span></div>`,
      );
    }
    const si = signed === 'no' ? signinHtml('fr-' + h, h, fl.si[h], 'Finish sign-in') : '';
    return {
      body: `<p class="p">Ferretry found ${HN[h]} on ${esc(m.name)}. Import it to use your login and setup from here.</p>
      <div class="sec"><span class="lbl">Found on ${esc(m.name)}</span><div class="list">${rows.join('')}</div></div>${si}
      <p class="hint">Importing copies your setup into Ferretry. ${HN[h]} on ${esc(m.name)} keeps working as before.</p>`,
      foot: `<div class="btns">${btn('Skip ' + HN[h], 'fr-skip', `id="fr-skip" data-h="${h}"`)}${btn(signed === 'no' ? 'Import, sign in later' : 'Import from ' + HN[h], 'fr-import', `id="fr-import" data-h="${h}"`, 'primary')}</div>`,
    };
  }

  /* ---- Add runtime ---- */
  F.addrt = (fl, m) => {
    if (!m.online) return pausedBody(fl, m);
    const at = fl.at;
    if (at === 'cred') {
      if (!m.creds.length)
        return {
          body: `<div class="empty" data-spot="empty"><h2>Add a login first</h2><p class="p">A runtime needs a login to Claude Code or Codex. You don't have one on ${esc(m.name)} yet. Pick which one to sign in to.</p>
        <div class="list" style="width:100%">${['claude', 'codex'].map(h => `<button class="row" data-a="start-addlogin" data-h="${h}" id="addrt-login-${h}"${m.installed[h] ? '' : ' disabled'}><span class="main"><span class="t">Sign in to ${HN[h]}</span><span class="s">${m.installed[h] ? 'Installed on ' + esc(m.name) : 'Not installed on ' + esc(m.name) + ' · install it in Settings'}</span></span>${chev}</button>`).join('')}</div></div>`,
          foot: btn('Next', 'fnext', 'id="step-next" disabled', 'primary block'),
        };
      const rows = ['claude', 'codex']
        .flatMap(h => m.creds.filter(c => c.harness === h))
        .map(c =>
          opt({
            name: 'addrt-cred',
            id: 'addrt-cred-' + c.id,
            checked: fl.credId === c.id,
            title: `<span class="mono">${esc(c.email)}</span>${c.label ? ' ' + badge(esc(c.label), 'accent') : ''}`,
            sub: `${HN[c.harness]} · ${stG(c.status)} ${ST[c.status][2]} · used by ${plural(credRuntimes(m, c.id).length, 'runtime')}${m.installed[c.harness] ? '' : ' · ' + HN[c.harness] + " isn't installed here"}`,
            data: `data-in="addrt-cred" data-x="${c.id}"`,
          }),
        )
        .join('');
      const sel = fl.credId && find(m.creds, fl.credId);
      const si =
        sel && sel.status === 'signin' ? signinHtml('addrt', sel.harness, S.ui.si.addrt, 'Finish sign-in') : '';
      return {
        body: `<p class="p">Which login should this runtime use?</p><div class="list">${rows}<button class="row addrow" data-a="start-addlogin" id="addrt-new-login"><span class="plus" aria-hidden="true">+</span><span class="main"><span class="t">Add a new login</span></span>${chev}</button></div>${si}`,
        foot: btn(
          sel && sel.status === 'signin' ? 'Next, sign in later' : 'Next',
          'fnext',
          `id="step-next"${sel ? '' : ' disabled'}`,
          'primary block',
        ),
      };
    }
    if (at === 'profile') {
      const c = find(m.creds, fl.credId);
      const rows = m.profiles
        .map(p => {
          const k = compat(m, p.id, c.harness);
          const flat = flattenProfile(m, p.id);
          return opt({
            name: 'addrt-profile',
            id: 'addrt-profile-' + p.id,
            checked: fl.profileId === p.id,
            disabled: !k.ok,
            title: esc(p.name),
            sub: `${plural(p.layers.length, 'layer')} · ${plural(flat.length, 'part')}`,
            extra: !k.ok
              ? `<span class="why" data-spot="p-${p.id}">${LOCK}${esc(k.why)}</span>`
              : k.notes.length
                ? `<span class="badges" data-spot="p-${p.id}">${k.notes.map(n => badge(esc(n), 'warn')).join('')}</span>`
                : '',
            data: `data-in="addrt-profile" data-x="${p.id}"`,
          });
        })
        .join('');
      const dup = fl.profileId && m.runtimes.find(r => r.credId === fl.credId && r.profileId === fl.profileId);
      const dupHtml = dup
        ? note(
            'warn',
            `<b><span class="mono">${esc(dup.name)}</span> already uses this login and profile.</b><span>Add another anyway?</span>`,
            fl.dupOk
              ? `<span class="stl st-ok">${stG('ready')}OK, you'll get a second one</span>`
              : btn('Add another anyway', 'dup-ok', 'id="dup-ok"', 'sm') +
                  btn('Pick a different profile', 'dup-no', 'id="dup-no"', 'sm'),
            ' data-spot="dup"',
          )
        : '';
      return {
        body: `<p class="p">Which profile should it use with <span class="mono">${esc(c.email)}</span> on ${HN[c.harness]}?</p><div class="list">${rows}<button class="row addrow" data-a="start-build" id="addrt-new-profile"><span class="plus" aria-hidden="true">+</span><span class="main"><span class="t">Build a new profile</span></span>${chev}</button></div>${dupHtml}`,
        foot: btn(
          'Next',
          'fnext',
          `id="step-next"${fl.profileId && (!dup || fl.dupOk) ? '' : ' disabled'}`,
          'primary block',
        ),
      };
    }
    if (at === 'name') {
      const c = find(m.creds, fl.credId),
        pr = find(m.profiles, fl.profileId);
      const err = runtimeNameError(m, fl.name);
      return {
        body: `<div class="list"><div class="row">${stG(c.status)}<span class="main"><span class="t mono">${esc(c.email)}</span><span class="s">${HN[c.harness]} · ${esc(pr.name)} profile</span></span></div></div>
      <div class="field" data-spot="name"><label for="addrt-name">Runtime name</label><input class="inp mono" id="addrt-name" value="${esc(fl.name)}" autocomplete="off" data-in="addrt-name" aria-invalid="${!!err}">
      ${err ? `<span class="err">${esc(err.msg)}${err.suggest ? ` <button class="link" type="button" data-a="addrt-suggest" data-x="${esc(err.suggest)}" id="addrt-use-suggest">Use ${esc(err.suggest)}</button>` : ''}</span>` : '<span class="hint">Letters, digits and dashes. You type this to launch it.</span>'}</div>
      <div class="list">${opt({ type: 'checkbox', name: 'addrt-agent', id: 'addrt-agent', checked: fl.agent, title: 'Ferretry launches this as an agent', sub: "Adds Ferretry's fixed layer last: no trust or onboarding prompts, and the machine's agent permissions.", data: 'data-in="addrt-agent"' })}</div>`,
        foot: btn('Create runtime', 'addrt-create', `id="step-next"${err ? ' disabled' : ''}`, 'primary block'),
      };
    }
    const r = find(m.runtimes, fl.made);
    const c = find(m.creds, r.credId);
    return {
      body:
        note(
          'ok',
          `<b><span class="mono">${esc(r.name)}</span> is ready to launch</b><span>${HN[c.harness]} · <span class="mono">${esc(c.email)}</span> · ${esc(find(m.profiles, r.profileId).name)} profile${c.status === 'signin' ? '. Sign in before you launch.' : '.'}</span>`,
        ) + (fl.created.length ? `<p class="hint">Also saved for reuse: ${esc(fl.created.join(', '))}.</p>` : ''),
      foot: `<div class="btns">${btn('Back to Runtimes', 'addrt-finish', 'id="addrt-done-list"')}${btn('Open ' + esc(r.name), 'addrt-finish', `id="addrt-done-open" data-x="${r.id}"`, 'primary')}</div>`,
    };
  };
  function pausedBody(fl, m) {
    return {
      body: note(
        'warn',
        `<b>${stG('signin')} ${esc(m.name)} is asleep or offline</b><span>Paused. Your progress is kept.</span>`,
        btn(fl.waking ? 'Checking…' : 'Retry', 'wake', `${fl.waking ? 'disabled' : ''}`, 'primary sm'),
      ),
      foot: '',
    };
  }

  /* ---- Build profile ---- */
  F.build = (fl, m) => {
    const at = fl.at;
    if (at === 'base') {
      const rows = m.profiles
        .map(p => {
          const self = fl.editId && (p.id === fl.editId || includesProfile(m, p.id, fl.editId));
          const on = fl.bases.includes(p.id);
          return opt({
            type: 'checkbox',
            name: 'b-base',
            id: 'b-base-' + p.id,
            checked: on,
            disabled: self,
            title: esc(p.name),
            sub: plural(flattenProfile(m, p.id).length, 'part'),
            extra: self ? `<span class="why" data-spot="loop">${LOCK}Would include itself</span>` : '',
            data: `data-in="b-base" data-x="${p.id}"`,
          });
        })
        .join('');
      const order = fl.bases.length
        ? `<div class="sec"><span class="lbl">Layer order · later wins</span><div class="stack">${fl.bases.map((pid, i) => `<div class="layer"><span class="n">${i + 1}</span><span style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="t">${esc(find(m.profiles, pid).name)}${i === fl.bases.length - 1 && fl.bases.length > 1 ? ' <span class="muted">· wins</span>' : ''}</span><span class="order"><button type="button" data-a="b-move" data-x="${i}" data-d="-1" aria-label="Move ${esc(find(m.profiles, pid).name)} earlier"${i === 0 ? ' disabled' : ''}>↑</button><button type="button" data-a="b-move" data-x="${i}" data-d="1" aria-label="Move ${esc(find(m.profiles, pid).name)} later"${i === fl.bases.length - 1 ? ' disabled' : ''}>↓</button></span></span></div>`).join('')}</div></div>`
        : '';
      return {
        body: `<p class="p">Start from existing profiles, or from nothing. When two layers set the same thing, the later one wins.</p>${m.profiles.length ? `<div class="list">${rows}</div>` : '<p class="hint">No profiles yet. Start from nothing.</p>'}${order}`,
        foot: btn(fl.bases.length ? 'Next' : 'Next, start from nothing', 'fnext', 'id="step-next"', 'primary block'),
      };
    }
    if (BUILD_TYPES.includes(at)) {
      const t = at,
        list = m.comps.filter(c => c.type === t);
      const multi = t !== 'modelset';
      const picks = fl.picks[t];
      const rows = list
        .map(c =>
          opt({
            type: multi ? 'checkbox' : 'radio',
            name: 'b-' + t,
            id: `b-${t}-${c.id}`,
            checked: picks.includes(c.id),
            title: `<span class="${t === 'mcp' ? 'mono' : ''}">${esc(c.name)}</span>`,
            extra: compBadges(c, m),
            data: `data-in="b-pick" data-t="${t}" data-x="${c.id}"`,
          }),
        )
        .join('');
      const none = multi
        ? ''
        : opt({
            name: 'b-' + t,
            id: `b-${t}-none`,
            checked: !picks.length,
            title: 'No model set',
            sub: 'Use the one from a base layer, or the harness default.',
            data: `data-in="b-pick" data-t="${t}" data-x=""`,
          });
      const form =
        fl.nf && fl.nf.type === t
          ? `<div class="note info"><b>New ${TYPES[t].one.toLowerCase()}</b>${compForm('bn', fl.nf, t, m)}<div class="acts">${btn('Save and use it', 'b-new-save', `id="b-new-save"${draftError(m, fl.nf) ? ' disabled' : ''}`, 'primary sm')}${btn('Cancel', 'b-new-cancel', 'id="b-new-cancel"', 'sm')}</div></div>`
          : '';
      const help = {
        instructions: 'What should every session know?',
        mcp: 'Which tools can the agent call?',
        skills: 'Which skills should it have?',
        settings: 'Any harness settings? Flags and environment live here.',
        modelset: 'Which models, and which one by default?',
      }[t];
      return {
        body: `<p class="p">${help} Pick existing, create new, or skip.</p><div class="list">${none}${rows}${form ? '' : `<button class="row addrow" data-a="b-new" data-t="${t}" id="b-new-${t}"><span class="plus" aria-hidden="true">+</span><span class="main"><span class="t">Create new ${TYPES[t].one.toLowerCase()}</span></span>${chev}</button>`}</div>${form}`,
        foot: btn(
          picks.length ? 'Next' : 'Skip, add no ' + TYPES[t].many.toLowerCase(),
          'fnext',
          `id="step-next"${form ? ' disabled' : ''}`,
          'primary block',
        ),
      };
    }
    if (at === 'review') {
      const layers = draftLayers(fl);
      const own = fl.name || (fl.editId ? find(m.profiles, fl.editId).name : 'this profile');
      const conf = conflicts(flattenLayers(m, layers, own, new Set(fl.editId ? [fl.editId] : [])));
      if (!layers.length)
        return {
          body: note(
            'warn',
            `<b>This profile has no layers yet</b><span>Go back and pick a starting profile or at least one part.</span>`,
          ),
          foot: btn('Next', 'fnext', 'id="step-next" disabled', 'primary block'),
        };
      return {
        body: `<p class="p">This is the stack, newest on top. A newer layer wins when two set the same thing.</p>${stackHtml(m, layers)}${sec('Conflicts', conflictsHtml(conf), ' data-spot="conf"')}`,
        foot: btn('Next', 'fnext', `id="step-next"${layers.length ? '' : ' disabled'}`, 'primary block'),
      };
    }
    // name
    const err = !fl.name.trim()
      ? 'Give the profile a name.'
      : m.profiles.some(p => p.name === fl.name.trim() && p.id !== fl.editId)
        ? 'You already have a profile called ' + fl.name.trim() + '.'
        : '';
    return {
      body: `<div class="field"><label for="build-name">Profile name</label><input class="inp" id="build-name" value="${esc(fl.name)}" autocomplete="off" data-in="build-name" aria-invalid="${!!err && !!fl.name}">${err && fl.name ? `<span class="err">${esc(err)}</span>` : '<span class="hint">For example Review, Agent or Docs.</span>'}</div>
      <p class="hint">${plural(draftLayers(fl).length, 'layer')}. ${S.flows.length > 1 && S.flows[S.flows.length - 2].type === 'addrt' ? 'You go back to choosing a profile, with this one picked.' : ''}</p>`,
      foot: btn(
        fl.editId ? 'Save changes' : 'Save profile',
        'b-save',
        `id="step-next"${err ? ' disabled' : ''}`,
        'primary block',
      ),
    };
  };
  function draftLayers(fl) {
    return [
      ...fl.bases.map(p => ({ p })),
      ...['instructions', 'mcp', 'skills', 'settings', 'hooks', 'modelset'].flatMap(t => fl.picks[t].map(c => ({ c }))),
    ];
  }

  /* ---- Add a login ---- */
  F.addlogin = (fl, m) => {
    if (fl.at === 'tool') {
      return {
        body: `<p class="p">Which tool do you want to sign in to on ${esc(m.name)}?</p><div class="list">${['claude', 'codex'].map(h => opt({ name: 'al-tool', id: 'al-tool-' + h, checked: fl.harness === h, disabled: !m.installed[h], title: HN[h], sub: m.installed[h] ? 'Installed · ' + m.installed[h] : 'Not installed on ' + esc(m.name) + ' · install it in Settings', data: `data-in="al-tool" data-x="${h}"` })).join('')}</div>`,
        foot: btn('Next', 'fnext', `id="step-next"${fl.harness ? '' : ' disabled'}`, 'primary block'),
      };
    }
    if (fl.at === 'signin') {
      if (fl.credId)
        return {
          body: note('ok', `<b>Signed in to ${HN[fl.harness]} as <span class="mono">you@example.com</span></b>`),
          foot: btn('Next', 'fnext', 'id="step-next"', 'primary block'),
        };
      return {
        body:
          `<p class="p">Sign in to ${HN[fl.harness]}. The login is kept on ${esc(m.name)}.</p>` +
          signinHtml('al', fl.harness, fl.si, 'Finish sign-in'),
        foot: '',
      };
    }
    // label
    const other = m.creds.find(c => c.harness === fl.harness && c.email === 'you@example.com' && c.id !== fl.credId);
    const ok = fl.labelNew.trim() && fl.labelOld.trim() && fl.labelNew.trim() !== fl.labelOld.trim();
    return {
      body: `<p class="p">You already have a ${HN[fl.harness]} login for <span class="mono">you@example.com</span>. Label both so you can tell them apart.</p>
      <div class="field"><label for="al-label-old">Label for the login you already had</label><input class="inp" id="al-label-old" value="${esc(fl.labelOld)}" placeholder="e.g. personal" data-in="al-label" data-f="labelOld" autocomplete="off"><span class="hint">Used by ${plural(credRuntimes(m, other.id).length, 'runtime')}.</span></div>
      <div class="field"><label for="al-label-new">Label for the new login</label><input class="inp" id="al-label-new" value="${esc(fl.labelNew)}" placeholder="e.g. work" data-in="al-label" data-f="labelNew" autocomplete="off">${fl.labelNew && fl.labelNew.trim() === fl.labelOld.trim() ? '<span class="err">Use two different labels.</span>' : ''}</div>`,
      foot: btn('Save labels', 'al-finish', `id="step-next"${ok ? '' : ' disabled'}`, 'primary block'),
    };
  };

  /* ---- Clone ---- */
  F.clone = (fl, m) => {
    if (fl.at === 'source') {
      const others = Object.values(S.machines).filter(x => x.name !== m.name);
      return {
        body: `<p class="p">Copy setup from which machine into <span class="mono">${esc(m.name)}</span>?</p><div class="list">${others.map(x => opt({ name: 'clone-src', id: 'clone-src-' + x.name, checked: fl.src === x.name, disabled: !x.online || !x.setup, title: `<span class="mono">${esc(x.name)}</span>`, sub: `${esc(x.os)} · ${plural(x.runtimes.length, 'runtime')}`, extra: !x.online ? `<span class="why" data-spot="offline">${stG('signin')}${esc(x.name)} is asleep or offline. Wake it to copy from it.</span>` : !x.setup ? '<span class="why">Not set up yet. Nothing to copy.</span>' : '', data: `data-in="clone-src" data-x="${x.name}"` })).join('')}</div>`,
        foot: btn(
          'Next',
          'fnext',
          `id="step-next"${fl.src && S.machines[fl.src].online ? '' : ' disabled'}`,
          'primary block',
        ),
      };
    }
    const src = S.machines[fl.src];
    if (fl.at === 'preview') {
      const pv = clonePreview(src, m);
      return {
        body: `<p class="p">This is a one-time copy. Later changes on <span class="mono">${esc(src.name)}</span> don't follow.</p>
      ${sec(
        'Copies',
        `<div class="list">
        <div class="row">${stG('ready')}<span class="main"><span class="t">${plural(pv.comps.length, 'component')}</span><span class="s">Instructions, MCP servers, skills, settings and hooks</span></span></div>
        <div class="row">${stG('ready')}<span class="main"><span class="t">${plural(pv.sets.length, 'model set')}</span></span></div>
        <div class="row">${stG('ready')}<span class="main"><span class="t">${plural(src.profiles.length, 'profile')}</span></span></div>
        <div class="row">${stG('ready')}<span class="main"><span class="t">${plural(src.runtimes.length, 'runtime')}</span></span></div></div>`,
      )}
      ${sec(
        "Doesn't copy",
        `<div class="list">
        <div class="row">${stG('signin')}<span class="main"><span class="t">${plural(pv.usedCreds.length, 'login')}</span><span class="s">Each becomes an empty slot on ${esc(m.name)} that needs sign-in. Runtimes keep pointing at their slot.</span></span></div>
        <div class="row">${stG('signin')}<span class="main"><span class="t">History</span><span class="s">Past sessions stay on ${esc(src.name)}.</span></span></div></div>`,
      )}
      ${pv.paths.length ? sec('Check after copying', `<div class="list">${pv.paths.map(c => `<div class="row"><span class="st st-warn">${WARN}</span><span class="main"><span class="t">${esc(c.name)}</span><span class="s mono">${esc((c.body.match(/\/(Users|home)\/[^\s]*/) || [''])[0])}</span><span class="badges">${badge('Check this path on ' + esc(m.name), 'warn')}</span></span></div>`).join('')}</div>`, ' data-spot="paths"') : ''}
      ${pv.missing.length ? note('warn', `<span>${listWords(pv.missing.map(h => HN[h]))} isn't installed on ${esc(m.name)}. Its runtimes are copied and wait until you install it.</span>`) : ''}`,
        foot: btn('Next', 'fnext', 'id="step-next"', 'primary block'),
      };
    }
    if (fl.at === 'conflict') {
      return {
        body: `<p class="p"><span class="mono">${esc(m.name)}</span> already has ${plural(m.profiles.length, 'profile')} and ${plural(m.runtimes.length, 'runtime')}. What should happen to them?</p>
      <div class="list" role="radiogroup" aria-label="Existing setup" data-spot="conflict">
        ${opt({ name: 'clone-mode', id: 'clone-mode-alongside', checked: fl.mode === 'alongside', title: 'Add alongside (rename clashes)', sub: `Keep what's here. Copies with the same name get -2, e.g. <span class="mono">claude-default-2</span>.`, data: 'data-in="clone-mode" data-x="alongside"' })}
        ${opt({ name: 'clone-mode', id: 'clone-mode-replace', checked: fl.mode === 'replace', title: 'Replace', sub: `Delete ${esc(m.name)}'s components, profiles and runtimes first. Its logins stay.`, data: 'data-in="clone-mode" data-x="replace"' })}
      </div>`,
        foot: btn(
          fl.mode === 'replace' ? 'Replace and copy' : 'Copy alongside',
          'clone-do',
          'id="step-next"',
          fl.mode === 'replace' ? 'danger block' : 'primary block',
        ),
      };
    }
    // done
    const r = fl.result;
    const slots = r.slots.map(id => find(m.creds, id)).filter(Boolean);
    const bigSlot = slots.slice().sort((a, b) => credRuntimes(m, b.id).length - credRuntimes(m, a.id).length)[0];
    return {
      body:
        note(
          'ok',
          `<b>Copied from ${esc(src.name)}</b><span>${plural(r.comps, 'component')}, ${plural(r.sets, 'model set')}, ${plural(r.profiles, 'profile')} and ${plural(r.runtimes, 'runtime')}.${r.renamed ? ' ' + plural(r.renamed, 'name') + ' got -2 to avoid a clash.' : ''}</span>`,
        ) +
        sec(
          'Sign in to use them',
          `<div class="list">${slots.map(c => `<button class="row" data-a="go-after-clone" data-x="${c.id}">${stG('signin')}<span class="main"><span class="t">${HN[c.harness]} · <span class="mono">${esc(c.email)}</span>${c.label ? ' ' + badge(esc(c.label), 'accent') : ''}</span><span class="s">Empty slot · used by ${plural(credRuntimes(m, c.id).length, 'runtime')}${m.installed[c.harness] ? '' : ' · ' + HN[c.harness] + " isn't installed here"}</span></span>${chev}</button>`).join('')}</div><p class="hint">Sign in once per slot. Every runtime that uses it is fixed together.</p>`,
        ) +
        (r.paths.length
          ? note(
              'warn',
              `<b>Check ${plural(r.paths.length, 'path')} on ${esc(m.name)}</b><span>${esc(listWords(r.paths))} point at folders on ${esc(src.name)}.</span>`,
            )
          : ''),
      foot: `<div class="btns">${btn('Go to Runtimes', 'clone-finish', 'id="clone-done-list"')}${bigSlot ? btn(`Sign in once for ${plural(credRuntimes(m, bigSlot.id).length, 'runtime')}`, 'go-after-clone', `id="clone-done-signin" data-x="${bigSlot.id}"`, 'primary') : ''}</div>`,
    };
  };

  /* ---- Install (from Settings or a runtime) ---- */
  F.install = (fl, m) => {
    if (!m.online) return pausedBody(fl, m);
    if (fl.inst.phase === 'done')
      return {
        body: installHtml(m, fl.inst, 'in', [fl.harness]),
        foot: btn('Done', 'install-finish', 'id="step-next"', 'primary block'),
      };
    return {
      body: `<p class="p">${HN[fl.harness]} isn't installed on ${esc(m.name)}. Ferretry can install it.</p>${installHtml(m, fl.inst, 'in', [fl.harness])}`,
      foot: '',
    };
  };

  /* =====================================================================
   Actions
   ===================================================================== */
  const A = {};
  const IN = {};
  const curFlow = () => S.flows[S.flows.length - 1];
  function go(v, p) {
    S.nav.push({ v, p });
    S.ui.del = null;
    S.ui.signout = null;
  }
  function tab(v) {
    S.nav = [{ v }];
    S.ui.del = null;
    S.ui.signout = null;
    S.ui.fixed = null;
  }
  A.go = d => go(d.v, { id: d.x });
  A['nav-back'] = () => {
    if (S.nav.length > 1) S.nav.pop();
    S.ui.del = null;
    S.ui.signout = null;
    S.ui.edit = null;
    S.ui.newc = null;
  };
  A.tab = d => tab(d.x);
  A.machines = () => go('machines');
  A.switch = d => {
    S.machine = d.x;
    S.flows = [];
    tab('runtimes');
    const m = M();
    if (!m.setup) S.flows = [newFr()];
  };
  A.wake = () => {
    const fl = curFlow();
    if (fl) fl.waking = true;
    later(900, () => {
      M().online = true;
      if (fl) fl.waking = false;
      toast(M().name + ' is back online.');
    });
  };
  A.launch = d => {
    const r = find(M().runtimes, d.x);
    M().running++;
    toast('Started a ' + r.name + ' session on ' + M().name + '.');
  };

  /* flows: generic */
  function pushFlow(f) {
    S.flows.push(f);
  }
  function stepMove(fl, dir) {
    const steps = flowSteps(fl, M());
    const i = steps.indexOf(fl.at);
    fl.at = steps[Math.max(0, Math.min(steps.length - 1, i + dir))];
  }
  A.fback = () => {
    const fl = curFlow(),
      m = M();
    const steps = flowSteps(fl, m);
    if (steps.indexOf(fl.at) > 0) {
      stepMove(fl, -1);
      return;
    }
    if (S.flows.length > 1) {
      popFlow();
      return;
    } // sub-stepper: Back returns to the parent step
    if (fl.type === 'fr' && !fl.fromSettings) {
      fl.confirm = true;
      return;
    }
    if (fl.type === 'fr' || fl.type === 'install' || fl.type === 'clone') {
      S.flows.pop();
      return;
    }
    fl.confirm = true;
  };
  A.fcancel = () => {
    curFlow().confirm = true;
  };
  A.fkeep = () => {
    curFlow().confirm = false;
  };
  A.fstop = () => {
    const fl = curFlow();
    const saved = fl.created.slice();
    // anything created inside a sub-flow belongs to the parent's "saved for reuse" too
    S.flows.pop();
    const parent = curFlow();
    if (parent) parent.created.push(...saved);
    if (fl.type === 'fr') {
      M().setup = true;
      tab('runtimes');
    }
    toast(saved.length ? 'Stopped. Saved for reuse: ' + saved.join(', ') + '.' : 'Stopped. Nothing was created.');
  };
  function popFlow(result) {
    const fl = S.flows.pop();
    const parent = curFlow();
    if (parent) parent.created.push(...fl.created);
    return { fl, parent };
  }
  A.fnext = () => {
    const fl = curFlow(),
      m = M();
    if (fl.type === 'fr' && fl.at === 'codex') {
      // skip naming when nothing was imported
      const steps = flowSteps(fl, m);
      fl.at = steps[steps.indexOf('codex') + 1];
      return;
    }
    if (fl.type === 'addrt' && fl.at === 'profile' && !fl.name) {
      const c = find(m.creds, fl.credId),
        p = find(m.profiles, fl.profileId);
      fl.name = uniqName(c.harness + '-' + (slug(p.name) || 'runtime'), new Set(m.runtimes.map(r => r.name)));
    }
    if (fl.type === 'addlogin' && fl.at === 'signin' && !fl.needLabel) {
      finishAddLogin(fl);
      return;
    }
    stepMove(fl, 1);
  };

  /* sign-in panels */
  A['si-open'] = d => {
    const st = siState(d.x);
    st.opened = true;
  };
  IN['si-code'] = (v, d) => {
    siState(d.x).code = v;
  };
  function siState(prefix) {
    if (prefix === 'al') return curFlow().si;
    if (prefix.startsWith('fr-')) {
      const fl = curFlow();
      fl.si[prefix.slice(3)] = fl.si[prefix.slice(3)] || {};
      return fl.si[prefix.slice(3)];
    }
    S.ui.si[prefix] = S.ui.si[prefix] || {};
    return S.ui.si[prefix];
  }
  A['si-finish'] = d => {
    const m = M(),
      p = d.x;
    if (p.startsWith('cred-')) {
      const c = find(m.creds, p.slice(5));
      const rids = credRuntimes(m, c.id).map(r => r.id);
      c.status = 'ready';
      c.slot = false;
      S.ui.si[p] = {};
      if (rids.length) {
        S.ui.fixed = { cid: c.id, rids, shown: reduceMotion ? rids.length : 0 };
        S.spot = 'fixed';
        if (!reduceMotion)
          rids.forEach((_, i) =>
            later(450 * (i + 1), () => {
              if (S.ui.fixed && S.ui.fixed.cid === c.id) S.ui.fixed.shown = i + 1;
            }),
          );
      }
      return;
    }
    if (p.startsWith('fr-')) {
      m.fr.signed[p.slice(3)] = 'yes';
      toast('Signed in to ' + HN[p.slice(3)] + '.');
      return;
    }
    if (p === 'addrt') {
      const c = find(m.creds, curFlow().credId);
      c.status = 'ready';
      S.ui.si.addrt = {};
      toast('Signed in. ' + plural(credRuntimes(m, c.id).length, 'runtime') + ' using this login can launch now.');
      return;
    }
    if (p === 'al') {
      const fl = curFlow();
      const exists = m.creds.find(c => c.harness === fl.harness && c.email === 'you@example.com');
      const c = {
        id: nid('cr'),
        harness: fl.harness,
        email: 'you@example.com',
        label: '',
        status: 'ready',
        cli: false,
        usage: [0, '5h 0m', 3, 'Sun'],
      };
      m.creds.push(c);
      fl.credId = c.id;
      fl.created.push(HN[fl.harness] + ' login you@example.com');
      if (exists) {
        fl.needLabel = true;
        fl.labelOld = exists.label || 'personal';
        fl.labelNew = exists.label === 'work' ? 'side' : 'work';
        fl.at = 'label';
      }
    }
  };
  function finishAddLogin(fl) {
    const m = M();
    const c = find(m.creds, fl.credId);
    if (fl.needLabel) {
      const other = m.creds.find(x => x.harness === fl.harness && x.email === c.email && x.id !== c.id);
      other.label = fl.labelOld.trim();
      c.label = fl.labelNew.trim();
      fl.created = fl.created.map(x =>
        x === HN[fl.harness] + ' login you@example.com'
          ? HN[fl.harness] + ' login you@example.com (' + c.label + ')'
          : x,
      );
    }
    const { parent } = popFlow();
    if (parent && parent.type === 'addrt') {
      parent.credId = c.id;
      toast('Login added and picked. Saved for reuse.');
    } else {
      go('cred', { id: c.id });
      toast('Login added.');
    }
  }
  A['al-finish'] = () => finishAddLogin(curFlow());
  IN['al-tool'] = (v, d) => {
    curFlow().harness = d.x;
  };
  IN['al-label'] = (v, d) => {
    curFlow()[d.f] = v;
  };

  /* install */
  function instState(prefix) {
    return curFlow().inst;
  }
  IN['inst-sel'] = (v, d) => {
    instState(d.x).sel[d.h] = v;
  };
  A['inst-go'] = d => runInstall(curFlow());
  A['inst-retry'] = d => {
    const st = curFlow().inst;
    st.tried = true;
    runInstall(curFlow());
  };
  A['inst-skip'] = d => {
    const fl = curFlow();
    if (fl.type === 'install') {
      S.flows.pop();
      return;
    }
    fl.inst.phase = 'skipped';
  };
  function runInstall(fl) {
    const m = M(),
      st = fl.inst;
    const hs = Object.keys(st.sel).filter(h => st.sel[h] && !m.installed[h]);
    st.phase = 'running';
    later(1400, () => {
      if (m.fr.fails && !st.tried) {
        st.phase = 'failed';
        S.spot = 'fail';
        return;
      }
      hs.forEach(h => {
        m.installed[h] = VERSIONS[h];
        m.fr.signed[h] = 'no';
        m.fr.config[h] = false;
      });
      st.did = hs;
      st.phase = 'done';
    });
  }
  A['start-install'] = d => {
    pushFlow(newInstall(d.h));
  };
  A['install-finish'] = () => {
    const fl = curFlow();
    S.flows.pop();
    toast(HN[fl.harness] + ' is installed on ' + M().name + '.');
  };

  /* first run */
  A['fr-import'] = d => doImport(curFlow(), M(), d.h);
  A['fr-skip'] = d => {
    curFlow().res[d.h] = 'skipped';
  };
  A['fr-unskip'] = d => {
    curFlow().res[d.h] = null;
  };
  IN['fr-name'] = (v, d) => {
    curFlow().names[d.h] = v.trim();
  };
  IN['fr-make'] = (v, d) => {
    curFlow().make[d.h] = v;
  };
  A['fr-suggest'] = d => {
    curFlow().names[d.h] = d.x;
  };
  A['fr-create'] = () => {
    const fl = curFlow(),
      m = M();
    for (const h of ['claude', 'codex']) {
      const r = fl.res[h];
      if (!r || r === 'skipped' || !fl.make[h]) continue;
      const rt = { id: nid('r'), name: fl.names[h], credId: r.credId, profileId: r.profileId, agent: false };
      m.runtimes.push(rt);
      fl.made.push(rt.id);
    }
    fl.at = 'done';
  };
  A['fr-finish'] = () => {
    S.flows.pop();
    M().setup = true;
    tab('runtimes');
  };
  A['start-import'] = () => {
    const f = newFr({ fromSettings: true });
    pushFlow(f);
  };

  /* add runtime */
  A['start-addrt'] = () => pushFlow(newAddrt());
  IN['addrt-cred'] = (v, d) => {
    const fl = curFlow();
    if (fl.credId !== d.x) {
      fl.credId = d.x;
      fl.profileId = null;
      fl.dupOk = false;
      fl.name = '';
    }
  };
  IN['addrt-profile'] = (v, d) => {
    const fl = curFlow();
    fl.profileId = d.x;
    fl.dupOk = false;
    fl.name = '';
  };
  A['dup-ok'] = () => {
    curFlow().dupOk = true;
  };
  A['dup-no'] = () => {
    curFlow().profileId = null;
  };
  IN['addrt-name'] = v => {
    curFlow().name = v.trim();
  };
  IN['addrt-agent'] = v => {
    curFlow().agent = v;
  };
  A['addrt-suggest'] = d => {
    curFlow().name = d.x;
  };
  A['addrt-create'] = () => {
    const fl = curFlow(),
      m = M();
    const r = { id: nid('r'), name: fl.name, credId: fl.credId, profileId: fl.profileId, agent: fl.agent };
    m.runtimes.push(r);
    fl.made = r.id;
    fl.at = 'done';
  };
  A['addrt-finish'] = d => {
    S.flows.pop();
    tab('runtimes');
    if (d.x) go('runtime', { id: d.x });
  };
  A['start-addlogin'] = d => pushFlow(newAddLogin(d.h ? { harness: d.h, fixed: true, at: 'signin' } : {}));

  /* build profile */
  A['start-build'] = () => pushFlow(newBuild());
  A['start-build-edit'] = d => {
    const m = M(),
      p = find(m.profiles, d.x);
    const f = newBuild({ editId: p.id, name: p.name });
    for (const l of p.layers) {
      if (l.p) f.bases.push(l.p);
      else {
        const c = find(m.comps, l.c);
        if (c) f.picks[c.type].push(c.id);
      }
    }
    pushFlow(f);
  };
  IN['b-base'] = (v, d) => {
    const fl = curFlow();
    fl.bases = v ? [...fl.bases, d.x] : fl.bases.filter(x => x !== d.x);
  };
  A['b-move'] = d => {
    const fl = curFlow(),
      i = +d.x,
      j = i + +d.d;
    const b = fl.bases.slice();
    [b[i], b[j]] = [b[j], b[i]];
    fl.bases = b;
  };
  IN['b-pick'] = (v, d) => {
    const fl = curFlow(),
      t = d.t;
    if (t === 'modelset') fl.picks[t] = d.x ? [d.x] : [];
    else fl.picks[t] = v ? [...fl.picks[t], d.x] : fl.picks[t].filter(x => x !== d.x);
  };
  A['b-new'] = d => {
    curFlow().nf = blankDraft(d.t);
  };
  A['b-new-cancel'] = () => {
    curFlow().nf = null;
  };
  A['b-new-save'] = () => {
    const fl = curFlow(),
      m = M(),
      d = fl.nf;
    const c = applyDraft(C(nid('c'), d.type, d.name, {}), d);
    m.comps.push(c);
    if (d.type === 'modelset') fl.picks.modelset = [c.id];
    else fl.picks[d.type].push(c.id);
    fl.created.push(TYPES[d.type].one + ' ' + c.name);
    fl.nf = null;
    toast('Saved for reuse: ' + c.name + '.');
  };
  IN['build-name'] = v => {
    curFlow().name = v;
  };
  A['b-save'] = () => {
    const fl = curFlow(),
      m = M();
    let p;
    if (fl.editId) {
      p = find(m.profiles, fl.editId);
      p.name = fl.name.trim();
      p.layers = draftLayers(fl);
    } else {
      p = { id: nid('p'), name: fl.name.trim(), layers: draftLayers(fl) };
      m.profiles.push(p);
      fl.created.push('Profile ' + p.name);
    }
    const { parent } = popFlow();
    if (parent && parent.type === 'addrt') {
      parent.profileId = p.id;
      parent.dupOk = false;
      parent.name = '';
      toast('Profile ' + p.name + ' saved and picked.');
    } else if (fl.editId) toast('Saved. New sessions use the new layers.');
    else {
      go('profile', { id: p.id });
      toast('Profile ' + p.name + ' saved.');
    }
  };

  /* drafts */
  function draftFor(prefix) {
    return prefix === 'bn' ? curFlow().nf : prefix === 'ce' ? S.ui.edit : S.ui.newc;
  }
  IN.draft = (v, d) => {
    const dr = draftFor(d.p);
    dr[d.f] = v;
  };
  IN['draft-model'] = (v, d) => {
    const dr = draftFor(d.p);
    dr.models = v ? ALL_MODELS.filter(x => dr.models.includes(x) || x === d.m) : dr.models.filter(x => x !== d.m);
    if (!dr.models.includes(dr.def)) dr.def = dr.models[0] || '';
  };
  A['comp-save'] = d => {
    const m = M(),
      c = find(m.comps, d.x);
    applyDraft(c, S.ui.edit);
    S.ui.edit = null;
    S.nav.pop();
    toast('Saved. New sessions use the new version.');
  };
  A['comp-create'] = d => {
    const m = M(),
      dr = S.ui.newc;
    const c = applyDraft(C(nid('c'), dr.type, dr.name, {}), dr);
    m.comps.push(c);
    S.ui.newc = null;
    S.nav.pop();
    go('comp', { id: c.id });
    toast('Saved. Add it to a profile to use it.');
  };

  /* delete */
  A['del-ask'] = d => {
    S.ui.del = { kind: d.kind, id: d.x };
    S.spot = 'del';
  };
  A['del-cancel'] = () => {
    S.ui.del = null;
  };
  A['del-detach'] = d => {
    const m = M();
    const names = [];
    if (d.kind === 'comp')
      m.profiles.forEach(p => {
        if (p.layers.some(l => l.c === d.x)) {
          p.layers = p.layers.filter(l => l.c !== d.x);
          names.push(p.name);
        }
      });
    else
      m.profiles.forEach(p => {
        if (p.layers.some(l => l.p === d.x)) {
          p.layers = p.layers.filter(l => l.p !== d.x);
          names.push(p.name);
        }
      });
    S.ui.del.detached = names;
  };
  IN['del-sw'] = (v, d) => {
    S.ui.del.sw[d.x] = v;
  };
  A['del-do'] = d => {
    const m = M();
    if (d.kind === 'comp') {
      const c = find(m.comps, d.x);
      m.comps = m.comps.filter(x => x.id !== d.x);
      toast('Deleted ' + c.name + '.');
    } else {
      const p = find(m.profiles, d.x);
      const sw = (S.ui.del && S.ui.del.sw) || {};
      m.runtimes.forEach(r => {
        if (r.profileId === d.x && sw[r.id]) r.profileId = sw[r.id];
      });
      m.profiles = m.profiles.filter(x => x.id !== d.x);
      toast('Deleted profile ' + p.name + '.');
    }
    S.ui.del = null;
    S.nav.pop();
  };

  /* credentials */
  IN['cred-label'] = (v, d) => {
    find(M().creds, d.x).label = v.trim();
  };
  A['cred-check'] = d => {
    const c = find(M().creds, d.x);
    const was = c.status;
    c.status = 'checking';
    later(1100, () => {
      c.status = 'ready';
      if (!c.usage) c.usage = [20, '3h 5m', 40, 'Sat'];
      toast(was === 'refresh' ? 'Checked. Ferretry renewed the sign-in.' : 'Checked. The login works.');
    });
  };
  A['signout-ask'] = d => {
    S.ui.signout = d.x;
    S.spot = 'signout';
  };
  A['signout-cancel'] = () => {
    S.ui.signout = null;
  };
  A['signout-do'] = d => {
    const m = M(),
      c = find(m.creds, d.x);
    c.status = 'signin';
    S.ui.signout = null;
    S.ui.fixed = null;
    toast('Signed out. ' + plural(credRuntimes(m, c.id).length, 'runtime') + ' need sign-in.');
  };

  /* settings + clone */
  IN.perm = (v, d) => {
    const m = M();
    if (!m.permPrev) m.permPrev = m.perm;
    m.perm = d.x;
    if (m.perm === m.permPrev) m.permPrev = null;
  };
  A['start-clone'] = () => pushFlow(newClone());
  IN['clone-src'] = (v, d) => {
    curFlow().src = d.x;
  };
  IN['clone-mode'] = (v, d) => {
    curFlow().mode = d.x;
  };
  A['clone-do'] = () => {
    const fl = curFlow(),
      m = M();
    fl.hadSetup = true;
    fl.result = doClone(S.machines[fl.src], m, fl.mode);
    fl.at = 'done';
  };

  A['clone-finish'] = () => {
    S.flows.pop();
    tab('runtimes');
  };
  A['go-after-clone'] = d => {
    S.flows.pop();
    tab('creds');
    go('cred', { id: d.x });
    S.spot = 'signin';
  };

  /* preview step for clone has no conflicts page when the target is empty: run the copy on Next */
  const _fnext = A.fnext;
  A.fnext = () => {
    const fl = curFlow(),
      m = M();
    if (fl && fl.type === 'clone' && fl.at === 'preview') {
      if (m.runtimes.length || m.profiles.length) {
        fl.hadSetup = true;
        fl.at = 'conflict';
        return;
      }
      fl.hadSetup = false;
      fl.result = doClone(S.machines[fl.src], m, 'alongside');
      fl.at = 'done';
      return;
    }
    _fnext();
  };

  /* =====================================================================
   Render
   ===================================================================== */
  let lastKey = '';
  function render() {
    const m = M();
    const fl = curFlow();
    let scr, key;
    if (fl) {
      scr = F[fl.type](fl, m);
      key = fl.type + ':' + fl.at + ':' + S.flows.length;
    } else {
      const t = S.nav[S.nav.length - 1];
      scr = V[t.v](t.p || {}, m);
      key = t.v + ':' + ((t.p || {}).id || '') + ':' + S.nav.length;
    }

    // remember focus and scroll
    const ae = document.activeElement;
    const focusId = ae && ae.id && ae.closest && ae.closest('#phone') ? ae.id : null;
    let sel = null;
    try {
      if (focusId && ae.selectionStart != null) sel = [ae.selectionStart, ae.selectionEnd];
    } catch (e) {}
    const oldBody = $('#p-body');
    const oldScroll = oldBody ? oldBody.scrollTop : 0;

    const topbar =
      fl || scr.noSwitch
        ? `<span class="msw static">${m.online ? stG('ready') : stG('signin')}${esc(m.name)}</span><span class="where">${fl ? 'Changes apply to this machine' : 'All machines'}</span>`
        : `<button class="msw" type="button" data-a="machines" id="machine-switcher" aria-label="Machine: ${esc(m.name)}. Switch machine">${m.online ? stG('ready') : stG('signin')}${esc(m.name)}<span class="caret" aria-hidden="true">▾</span></button><span class="where">${m.online ? 'Online' : 'Offline'}</span>`;
    const head = fl
      ? flowHead(fl, m)
      : `${S.nav.length > 1 ? '<div class="hrow"><button class="back" type="button" data-a="nav-back" id="nav-back">‹ Back</button></div>' : ''}<h1 class="p-title${scr.titleMono ? ' mono' : ''}" id="p-title" tabindex="-1">${esc(scr.title)}</h1>${scr.sub ? `<p class="p-sub">${esc(scr.sub)}</p>` : ''}`;
    const body = fl && fl.confirm ? confirmHtml(fl, m) : scr.body;
    const foot = fl && fl.confirm ? '' : scr.foot;
    const curTab = S.nav[0].v;
    const tabs =
      !fl && scr.tabs
        ? `<nav class="tabs" aria-label="${esc(m.name)}">${TABS.map(([v, l]) => `<button class="tab" type="button" data-a="tab" data-x="${v}" id="tab-${v}"${curTab === v ? ' aria-current="page"' : ''}>${TAB_ICONS[v]}<span>${l}</span></button>`).join('')}</nav>`
        : '';
    $('#phone').innerHTML =
      `<div class="p-top">${topbar}</div><div class="p-head">${head}</div><div class="p-body" id="p-body" data-key="${esc(key)}">${body}</div>${foot ? `<div class="p-foot">${foot}</div>` : ''}${tabs}${S.toast ? `<div class="toast${foot ? ' raised' : ''}" role="status">${esc(S.toast)}</div>` : ''}`;

    const nb = $('#p-body');
    if (key === lastKey) nb.scrollTop = oldScroll;
    if (focusId) {
      const n = document.getElementById(focusId);
      if (n && !n.disabled) {
        n.focus({ preventScroll: true });
        if (sel && n.setSelectionRange)
          try {
            n.setSelectionRange(sel[0], sel[1]);
          } catch (e) {}
      } else if (key !== lastKey) $('#p-title').focus({ preventScroll: true });
    }
    if (S.spot) {
      const el = nb.querySelector(`[data-spot="${S.spot}"]`);
      if (el) {
        nb.scrollTop = Math.max(0, el.getBoundingClientRect().top - nb.getBoundingClientRect().top + nb.scrollTop - 12);
        el.classList.add('spot');
      }
      S.spot = null;
    }
    lastKey = key;
  }

  /* =====================================================================

   ===================================================================== */
  function fresh(o = {}) {
    reset();

    if (o.fr) Object.assign(m.fr, o.fr);
    return m;
  }
  function setUp() {
    reset();

    S.flows = [];
    S.nav = [{ v: 'runtimes' }];
    return M();
  }
  function frAt(at, extra) {
    const f = newFr(extra);
    f.at = at;
    S.flows = [f];
    return f;
  }

        [

          () => {

        [
          'E7',

    ],
    [
      'Credentials',

              S.nav = [{ v: 'creds' }];

    [
      'Machines',
      [
        [

          () => {

            S.spot = 'paths';

        [
          'E31',
          'One slot, three runtimes: sign in once',
          () => {
            setUp();
            S.machine = 'work-linux';
            const res = doClone(S.machines['studio-mac'], S.machines['work-linux'], 'alongside');
            const m = M();
            const slot = res.slots
              .map(id => find(m.creds, id))

            S.nav = [{ v: 'creds' }, { v: 'cred', p: { id: slot.id } }];

          'Agent permissions changed while sessions run',
          () => {

            m.permPrev = 'auto';
            m.perm = 'skip';

            S.spot = 'perm';

      ],
    ],
  ];
  const CASE_BY_ID = {};
  function renderCatalogue() {
    $('#catalogue').innerHTML = CASES.map(
      ([g, rows]) =>
        `<div class="cat-group"><h2 class="lbl">${g}</h2><div class="cases">${rows
          .map(([id, title, fn, alt]) => {
            CASE_BY_ID[id] = fn;
            if (alt) CASE_BY_ID[id + '-alt'] = alt[1];
            return `<div class="case" id="case-${id}"><span class="cid mono">${id}</span><span class="ct">${esc(title)}</span><span class="cbtns">${alt ? `<button class="btn sm quiet" type="button" id="show-${id}-alt" data-show="${id}-alt" aria-label="Show ${id}, ${esc(alt[0])}">${esc(alt[0])}</button>` : ''}<button class="btn sm" type="button" id="show-${id}" data-show="${id}" aria-label="Show ${id}">Show</button></span></div>`;
          })
          .join('')}</div></div>`,
    ).join('');
  }
  function showCase(key) {
    CASE_BY_ID[key]();
    S.active = key;
    const id = key.replace('-alt', '');
    document.querySelectorAll('.case').forEach(el => el.classList.toggle('on', el.id === 'case-' + id));
    const row = CASES.flatMap(g => g[1]).find(r => r[0] === id);
    $('#now').innerHTML =
      `<b class="mono">${id}</b><span>${esc(row[1])}${key.endsWith('-alt') ? ' · ' + esc(row[3][0]) : ''}</span>`;
    lastKey = '';
    render();
    if (window.matchMedia('(max-width: 900px)').matches)
      $('#phone').scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
  }

  /* =====================================================================
   Wiring
   ===================================================================== */
  document.addEventListener('click', e => {
    const show = e.target.closest('[data-show]');
    if (show) {
      showCase(show.dataset.show);
      return;
    }
    const th = e.target.closest('[data-theme-set]');
    if (th) {
      const v = th.dataset.themeSet;
      if (v === 'system') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', v);
      document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', String(b === th)));
      return;
    }
    const el = e.target.closest('[data-a]');
    if (!el || el.disabled || !el.closest('#phone')) return;
    const fn = A[el.dataset.a];
    if (fn) {
      fn(el.dataset, el);
      render();
    }
  });
  function onInput(e) {
    const el = e.target;
    if (!el.dataset || !el.dataset.in || !el.closest('#phone')) return;
    const isCheck = el.type === 'checkbox' || el.type === 'radio';
    if ((e.type === 'change') !== (isCheck || el.tagName === 'SELECT')) return;
    IN[el.dataset.in](isCheck ? el.checked : el.value, el.dataset, el);
    render();
  }
  document.addEventListener('input', onInput);
  document.addEventListener('change', onInput);
  $('#reset-fresh').addEventListener('click', () => {
    reset();
    S.active = null;
    document.querySelectorAll('.case').forEach(el => el.classList.remove('on'));
    $('#now').textContent = 'Fresh machine: first-run setup';
    lastKey = '';
    render();
  });
  $('#reset-setup').addEventListener('click', () => {
    setUp();
    document.querySelectorAll('.case').forEach(el => el.classList.remove('on'));
    $('#now').textContent = 'Set-up machine: studio-mac with 5 runtimes';
    lastKey = '';
    render();
  });

  renderCatalogue();
  reset();
  $('#now').textContent = 'Fresh machine: first-run setup';
  render();
</script>
